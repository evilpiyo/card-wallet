<!DOCTYPE html>
<!-- 四角鎖定測試頁（暫時）：只開相機、找卡片四邊、顯示拉正結果。不讀寫資料、不連網。
     定案後併入 index.html，並移除設定頁入口。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob: mediastream:; connect-src 'none'">
  <title>四角鎖定測試</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111; color: #f3f4f6; font: 15px/1.5 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header { flex: none; display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; }
    a { color: #93c5fd; text-decoration: none; padding: 6px 0; }
    #stage { flex: 1; position: relative; overflow: hidden; background: #000; min-height: 0; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #guide { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); width: min(76%, 340px, 80vh); aspect-ratio: 1.586; }
    #status { position: absolute; left: -15%; right: -15%; top: calc(100% + 16px); text-align: center; font-size: 19px; font-weight: 700; text-shadow: 0 1px 4px #000; }
    #fx { position: absolute; inset: 0; pointer-events: none; }
    #fx[hidden] { display: none; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: flash .35s ease-out; }
    #shutter { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; opacity: 0; animation: shutter .5s ease-in-out; }
    @keyframes flash { 25% { opacity: .75; } }
    @keyframes shutter { 0% { opacity: 0; transform: scale(1.35) rotate(0); } 35% { opacity: .7; } 70% { opacity: .7; transform: scale(.8) rotate(55deg); } 100% { opacity: 0; transform: scale(.8) rotate(55deg); } }
    @keyframes fade { 40% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { #flash { animation-name: fade; } #shutter { animation-name: fade; } }
    footer { flex: none; padding: 8px 16px calc(env(safe-area-inset-bottom) + 12px); }
    footer p { margin: 0 0 8px; font-size: 12px; color: #9ca3af; text-align: center; }
    button { width: 100%; min-height: 46px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; background: #374151; color: #fff; }
    #result { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 16px; overflow: auto; }
    #result[hidden] { display: none; }
    #result canvas { width: 100%; max-width: 640px; margin: 0 auto; border-radius: 8px; background: #000; }
    #result p { margin: 0; text-align: center; }
    .small { font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <header><a href="./">‹ 返回首頁</a><b>四角鎖定測試</b><span style="width:5em"></span></header>
  <div id="stage">
    <video id="video" muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="guide"><div id="status">啟動相機中</div></div>
    <div id="fx" hidden>
      <div id="flash"></div>
      <svg id="shutter" viewBox="-50 -50 100 100" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" aria-hidden="true">
        <circle r="44" fill="rgba(0,0,0,.35)"/>
        <path d="M0-44 21-8M38-22 19 14M38 22H-3M0 44-21 8M-38 22-19-14M-38-22H3"/>
      </svg>
    </div>
  </div>
  <footer>
    <p id="stats">尚未鎖定</p>
    <button type="button" id="snap">鎖不住？直接拍目前畫面</button>
  </footer>
  <div id="result" hidden>
    <p id="result-title"></p>
    <canvas id="shot" width="640" height="404"></canvas>
    <p id="result-info" class="small"></p>
    <p class="small">只在畫面上顯示，不存檔、不上傳。<br>截圖分享前請遮住條碼與卡號。</p>
    <button type="button" id="next">下一張</button>
  </div>
<script>
const RATIO = 1.586;
const MARGIN = 0.15;      // 取景框外搜尋範圍（相對框寬）
const SMALL = 400;        // 偵測用影像寬
const EDGE = 22;          // 相鄰像素差達此值視為邊緣
const MIN_SCORE = 0.55;   // 一條邊至少要有這麼多取樣點是邊緣
const LOCK_MS = 1000;     // 對準後要穩定多久才拍
const FADE_MS = 200;      // 開始倒數後四角淡出的時間
const BLUE = 'rgba(59,130,246,.32)', GREEN = 'rgba(74,222,128,.34)';
const MOVE = 0.025;       // 倒數中角點偏離起點超過框寬的這個比例就重算
const COOLDOWN_MS = 600;  // 按「下一張」後多久內不倒數
const SHOT_MS = 500;      // 拍照動畫長度
const SIDES = ['top', 'right', 'bottom', 'left'];

// ---------- 偵測 ----------

// 回傳 gx（左右方向的變化，用來找直邊）與 gy（上下方向，找橫邊）
function edgeMaps({ data, width, height }) {
  const gx = new Uint8Array(width * height), gy = new Uint8Array(width * height);
  const diff = (a, b) => data[a + 3] && data[b + 3] // 超出影像的透明區不算邊
    ? Math.max(Math.abs(data[a] - data[b]), Math.abs(data[a + 1] - data[b + 1]), Math.abs(data[a + 2] - data[b + 2])) : 0;
  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const i = y * width + x, p = i * 4;
      gx[i] = diff(p - 4, p + 4) >= EDGE ? 1 : 0;
      gy[i] = diff(p - width * 4, p + width * 4) >= EDGE ? 1 : 0;
    }
  }
  return { gx, gy };
}

// 找一側的候選直線。橫邊：y = c + k(x - mid)；直邊：x = c + k(y - mid)
function findLines(map, width, height, box, side) {
  const flat = side === 'top' || side === 'bottom';
  const from = flat ? box.x + box.w * 0.1 : box.y + box.h * 0.12;
  const to = flat ? box.x + box.w * 0.9 : box.y + box.h * 0.88;
  const mid = flat ? box.x + box.w / 2 : box.y + box.h / 2;
  const expected = { top: box.y, bottom: box.y + box.h, left: box.x, right: box.x + box.w }[side];
  const tol = flat ? box.h * 0.17 : box.w * 0.12;
  const found = [];
  for (let degree = -8; degree <= 8; degree++) {
    const k = Math.tan(degree * Math.PI / 180);
    for (let c = Math.round(expected - tol); c <= expected + tol; c++) {
      let hits = 0, total = 0;
      for (let t = from; t <= to; t += 2) {
        const along = Math.round(t), across = Math.round(c + k * (t - mid));
        total++;
        for (let d = -1; d <= 1; d++) {
          const x = flat ? along : across + d, y = flat ? across + d : along;
          if (x >= 0 && y >= 0 && x < width && y < height && map[y * width + x]) { hits++; break; }
        }
      }
      if (hits / total >= MIN_SCORE) found.push({ c, k, mid, flat, score: hits / total });
    }
  }
  // 分數相同時取靠中間者；相近的線只留一條
  found.sort((a, b) => b.score - a.score || Math.abs(a.k) - Math.abs(b.k));
  const kept = [];
  for (const line of found) {
    if (kept.every(other => Math.abs(other.c - line.c) > 6)) kept.push(line);
    if (kept.length === 5) break;
  }
  return kept;
}

function cross(flat, upright) {
  // y = c1 + k1(x - m1)、x = c2 + k2(y - m2)
  const a = flat.c - flat.k * flat.mid, b = upright.c - upright.k * upright.mid;
  const y = (a + flat.k * b) / (1 - flat.k * upright.k);
  return { x: b + upright.k * y, y };
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function measure([tl, tr, br, bl]) {
  const top = dist(tl, tr), bottom = dist(bl, br), left = dist(tl, bl), right = dist(tr, br);
  return {
    w: (top + bottom) / 2, h: (left + right) / 2,
    skew: Math.max(top / bottom, bottom / top, left / right, right / left),
    tilt: Math.atan2(tr.y - tl.y + br.y - bl.y, tr.x - tl.x + br.x - bl.x) * 180 / Math.PI,
    cx: (tl.x + tr.x + br.x + bl.x) / 4, cy: (tl.y + tr.y + br.y + bl.y) / 4
  };
}

// image：含取景框外圍的影像；box：取景框在影像中的位置
function detect(image, box) {
  const { gx, gy } = edgeMaps(image);
  const lines = {};
  for (const side of SIDES) {
    lines[side] = findLines(side === 'top' || side === 'bottom' ? gy : gx, image.width, image.height, box, side);
  }
  let best = null;
  for (const t of lines.top) for (const r of lines.right) for (const b of lines.bottom) for (const l of lines.left) {
    const quad = [cross(t, l), cross(t, r), cross(b, r), cross(b, l)];
    const m = measure(quad);
    if (Math.abs(m.w / m.h / RATIO - 1) > 0.1 || m.skew > 1.12 || m.w < box.w * 0.75) continue;
    if (quad.some(p => p.x < 0 || p.y < 0 || p.x > image.width || p.y > image.height)) continue;
    // 分數相近時偏好較外圈的組合，避免抓到卡面上的印刷線條
    const score = t.score + r.score + b.score + l.score + 0.8 * (m.w * m.h) / (box.w * box.h) - 2 * Math.abs(m.w / m.h / RATIO - 1);
    if (!best || score > best.score) best = { quad, score };
  }
  return { sides: Object.fromEntries(SIDES.map(s => [s, lines[s].length > 0])), quad: best && best.quad };
}

// ---------- 拉正 ----------

// 把來源的四邊形貼到 out（透視校正，雙線性取樣）
function warp(source, quad, out) {
  const src = source.getContext('2d').getImageData(0, 0, source.width, source.height);
  const ctx = out.getContext('2d'), dst = ctx.createImageData(out.width, out.height);
  const [p0, p1, p2, p3] = quad;
  const dx1 = p1.x - p2.x, dx2 = p3.x - p2.x, dx3 = p0.x - p1.x + p2.x - p3.x;
  const dy1 = p1.y - p2.y, dy2 = p3.y - p2.y, dy3 = p0.y - p1.y + p2.y - p3.y;
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (dx3 * dy2 - dx2 * dy3) / den, h = (dx1 * dy3 - dx3 * dy1) / den;
  const a = p1.x - p0.x + g * p1.x, b = p3.x - p0.x + h * p3.x;
  const d = p1.y - p0.y + g * p1.y, e = p3.y - p0.y + h * p3.y;
  for (let j = 0; j < out.height; j++) {
    const v = (j + 0.5) / out.height;
    for (let i = 0; i < out.width; i++) {
      const u = (i + 0.5) / out.width, z = g * u + h * v + 1;
      const x = Math.min(Math.max((a * u + b * v + p0.x) / z, 0), source.width - 1.001);
      const y = Math.min(Math.max((d * u + e * v + p0.y) / z, 0), source.height - 1.001);
      const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
      const p = (y0 * source.width + x0) * 4, q = p + source.width * 4, o = (j * out.width + i) * 4;
      for (let n = 0; n < 3; n++) {
        dst.data[o + n] = (src.data[p + n] * (1 - fx) + src.data[p + 4 + n] * fx) * (1 - fy)
          + (src.data[q + n] * (1 - fx) + src.data[q + 4 + n] * fx) * fy;
      }
      dst.data[o + 3] = 255;
    }
  }
  ctx.putImageData(dst, 0, 0);
}

// ---------- 畫面 ----------

const $ = id => document.getElementById(id);
const video = $('video');
const full = document.createElement('canvas');   // 目前影格（原始解析度）
const small = document.createElement('canvas');  // 偵測用
let stream = null, timer = 0, startedAt = 0, readyAt = 0, frame = null, capturing = false;
let anchor = null, since = 0, misses = 0, best = null; // 倒數起點、漏抓格數、期間最清晰的影格
const locks = [];

// 取景框（含外圍搜尋範圍）換算成影像座標
function region() {
  const view = video.getBoundingClientRect(), box = $('guide').getBoundingClientRect();
  const scale = Math.max(view.width / video.videoWidth, view.height / video.videoHeight);
  const offsetX = (view.width - video.videoWidth * scale) / 2, offsetY = (view.height - video.videoHeight * scale) / 2;
  const x = (box.left - view.left - offsetX) / scale, y = (box.top - view.top - offsetY) / scale;
  const w = box.width / scale, h = box.height / scale, m = w * MARGIN;
  return { x: x - m, y: y - m, w: w + 2 * m, h: h + 2 * m, margin: m, boxW: w, boxH: h, scale, offsetX, offsetY, view, box };
}

// 擷取一格並偵測；偵測與拉正用同一格
function analyze() {
  const r = region(), started = performance.now();
  const fit = Math.min(1, 1600 / r.w);
  full.width = Math.round(r.w * fit);
  full.height = Math.round(r.h * fit);
  full.getContext('2d', { willReadFrequently: true }).drawImage(video, r.x, r.y, r.w, r.h, 0, 0, full.width, full.height);
  small.width = SMALL;
  small.height = Math.round(SMALL * r.h / r.w);
  const ctx = small.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, small.width, small.height);
  ctx.drawImage(full, 0, 0, small.width, small.height);
  const k = SMALL / r.w;
  const box = { x: r.margin * k, y: r.margin * k, w: r.boxW * k, h: r.boxH * k };
  const found = detect(ctx.getImageData(0, 0, small.width, small.height), box);
  return { ...found, box, region: r, toFull: full.width / SMALL, cost: performance.now() - started };
}

// 需要調整的提示；空字串代表對準了。拉正可修掉小幅歪斜與遠近，門檻從寬
function advice(result) {
  const { quad, sides, box } = result;
  if (!quad) {
    const missing = SIDES.filter(s => !sides[s]).map(s => ({ top: '上', right: '右', bottom: '下', left: '左' })[s]);
    if (missing.length >= 3) return '把整張卡放進框內';
    if (missing.length) return `還沒抓到${missing.join('、')}邊`;
    return '放平、對齊框線';
  }
  const m = measure(quad);
  if (m.w < box.w * 0.84) return '靠近一點';
  if (m.w > box.w * 1.14) return '拿遠一點';
  if (m.cx - (box.x + box.w / 2) > box.w * 0.09) return '卡片往左一點';
  if (box.x + box.w / 2 - m.cx > box.w * 0.09) return '卡片往右一點';
  if (m.cy - (box.y + box.h / 2) > box.h * 0.11) return '卡片往上一點';
  if (box.y + box.h / 2 - m.cy > box.h * 0.11) return '卡片往下一點';
  if (Math.abs(m.tilt) > 7) return '轉正一點';
  if (m.skew > 1.09) return '手機放平一點';
  return '';
}

// 清晰度：卡片中央相鄰像素差的平方平均，越大越清楚
function sharpness(result) {
  const f = result.toFull, m = measure(result.quad);
  const w = Math.round(m.w * f * 0.7), h = Math.round(m.h * f * 0.7);
  const { data } = full.getContext('2d').getImageData(Math.round(m.cx * f - w / 2), Math.round(m.cy * f - h / 2), w, h);
  let sum = 0, count = 0;
  for (let y = 0; y < h; y += 4) {
    for (let x = 1; x < w; x++, count++) {
      const i = (y * w + x) * 4 + 1, d = data[i] - data[i - 4];
      sum += d * d;
    }
  }
  return sum / count;
}

// 同一時間只畫一種圖形：找卡片時是四個角（灰＝沒抓到、亮白＝抓到），
// 倒數時四角淡出、只在實卡上蓋淡藍，拍下轉綠。corners 是四角的不透明度
function paint(result, quad, corners, fill) {
  const canvas = $('overlay'), r = result.region, ratio = window.devicePixelRatio || 1;
  canvas.width = r.view.width * ratio;
  canvas.height = r.view.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  if (fill && quad) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    quad.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...toScreen(r, p)));
    ctx.closePath();
    ctx.fill();
  }
  if (corners <= 0) return;
  const x = r.box.left - r.view.left, y = r.box.top - r.view.top, w = r.box.width, h = r.box.height, len = w * 0.1;
  ctx.globalAlpha = corners;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const [cx, cy, sx, sy, a, b] of [[x, y, 1, 1, 'top', 'left'], [x + w, y, -1, 1, 'top', 'right'], [x + w, y + h, -1, -1, 'bottom', 'right'], [x, y + h, 1, -1, 'bottom', 'left']]) {
    ctx.strokeStyle = quad || (result.sides[a] && result.sides[b]) ? '#fff' : 'rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.moveTo(cx, cy + sy * len);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx + sx * len, cy);
    ctx.stroke();
  }
}

// 偵測座標換算成畫面座標
function toScreen(r, p) {
  return [(r.x + p.x / SMALL * r.w) * r.scale + r.offsetX, (r.y + p.y / SMALL * r.w) * r.scale + r.offsetY];
}

function reset() {
  anchor = best = null;
  misses = 0;
}

function tick() {
  if (!stream || !$('result').hidden || capturing) return;
  if (video.videoWidth) {
    const result = analyze(), now = performance.now(), text = advice(result);
    frame = result;
    const aligned = !text && now >= readyAt;
    if (aligned) {
      if (anchor && result.quad.some((p, i) => dist(p, anchor[i]) > result.box.w * MOVE)) reset();
      if (!anchor) { anchor = result.quad; since = now; }
      misses = 0;
      const score = sharpness(result);
      if (!best || score > best.score) {
        const source = best ? best.source : document.createElement('canvas');
        source.width = full.width;
        source.height = full.height;
        source.getContext('2d', { willReadFrequently: true }).drawImage(full, 0, 0);
        best = { result, source, score };
      }
    } else if (anchor && !result.quad && misses < 1) {
      misses++; // 偶爾一格沒抓到不重算
    } else {
      reset();
    }
    const held = anchor ? now - since : 0;
    paint(result, result.quad || anchor, anchor ? 1 - held / FADE_MS : 1, anchor ? BLUE : null);
    $('status').textContent = anchor ? '別動' : text || '對準了';
    if (aligned && held >= LOCK_MS) return capture(best.result, best.source, true);
  }
  timer = setTimeout(tick, 70);
}

// 拍下：卡片轉綠、閃光、快門圖示收合，再顯示結果
function capture(result, source, locked) {
  clearTimeout(timer);
  capturing = true;
  const seconds = (performance.now() - startedAt) / 1000;
  paint(result, result.quad, 0, GREEN);
  $('status').textContent = '已拍好';
  const r = result.region;
  const [cx, cy] = result.quad
    ? result.quad.map(p => toScreen(r, p)).reduce((sum, p) => [sum[0] + p[0] / 4, sum[1] + p[1] / 4], [0, 0])
    : [r.box.left - r.view.left + r.box.width / 2, r.box.top - r.view.top + r.box.height / 2];
  $('shutter').style.left = `${cx}px`;
  $('shutter').style.top = `${cy}px`;
  $('fx').hidden = false;
  if (locked && navigator.vibrate) navigator.vibrate(60);
  // 手動拍時 source 就是目前影格，先拉正再播動畫
  render(result, source);
  timer = setTimeout(() => show(result, locked, seconds), SHOT_MS);
}

function render(result, source) {
  const f = result.toFull;
  const quad = result.quad
    ? result.quad.map(p => ({ x: p.x * f, y: p.y * f }))
    : (({ x, y, w, h }) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]].map(([px, py]) => ({ x: px * f, y: py * f })))(result.box);
  warp(source, quad, $('shot'));
}

function show(result, locked, seconds) {
  capturing = false;
  $('fx').hidden = true;
  reset();
  if (locked) {
    locks.push(seconds);
    $('stats').textContent = `已鎖定 ${locks.length} 次・平均 ${(locks.reduce((a, b) => a + b, 0) / locks.length).toFixed(1)} 秒`;
  }
  $('result-title').textContent = locked ? '已鎖定，拉正結果' : result.quad ? '手動拍攝（已抓到四角）' : '手動拍攝（沒抓到四角，照取景框裁切）';
  const missing = SIDES.filter(s => !result.sides[s]).map(s => ({ top: '上', right: '右', bottom: '下', left: '左' })[s]);
  $('result-info').textContent = `耗時 ${seconds.toFixed(1)} 秒・單次偵測 ${Math.round(result.cost)} ms・影像 ${video.videoWidth}×${video.videoHeight}` + (result.quad ? '' : `・未抓到：${missing.join('') || '無（比例不符）'}`);
  $('result').hidden = false;
  // 卡片從取景位置放大到結果位置
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const from = result.region.box, to = $('shot').getBoundingClientRect();
  $('shot').animate([
    { transform: `translate(${from.left + from.width / 2 - to.left - to.width / 2}px, ${from.top + from.height / 2 - to.top - to.height / 2}px) scale(${from.width / to.width})` },
    { transform: 'none' }
  ], { duration: 280, easing: 'ease-out' });
}

function resume() {
  $('result').hidden = true;
  $('fx').hidden = true;
  capturing = false;
  reset();
  startedAt = performance.now();
  readyAt = startedAt + COOLDOWN_MS;
  clearTimeout(timer);
  tick();
}

let request = 0, starting = false;

async function start() {
  if (stream || starting || document.hidden) return;
  starting = true;
  const mine = ++request;
  try {
    const opened = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }
    });
    if (mine !== request) return opened.getTracks().forEach(t => t.stop()); // 開啟途中已離開
    stream = opened;
    video.srcObject = stream;
    await video.play();
    resume();
  } catch (err) {
    if (mine === request) $('status').textContent = '無法啟動相機，請確認為 HTTPS 並允許相機權限';
  } finally {
    if (mine === request) starting = false;
  }
}

function stop() {
  request++;
  starting = false;
  clearTimeout(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

$('next').onclick = resume;
$('snap').onclick = () => { if (frame && !capturing) capture(analyze(), full, false); };
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
window.addEventListener('pagehide', stop);
window.addEventListener('pageshow', start);
start();
</script>
</body>
</html>
