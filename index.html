<!DOCTYPE html>
<html lang="zh-TW" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>小七商品卡管家</title>
  <meta name="apple-mobile-web-app-title" content="小七卡管家">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <script src="vendor/tailwindcss-3.4.17.js"></script>
  <script src="vendor/html5-qrcode-2.3.8.min.js"></script>
  <script src="vendor/jsbarcode-3.11.6.min.js"></script>
  <style>
    /* ===== Theme token：新增主題時，加一組 [data-theme="名稱"] 覆寫即可 ===== */
    :root {
      --bg: #f6f4ef; --surface: #ffffff; --text: #1d1d1b; --muted: #6f6c65; --line: #e6e2d9;
      --action: #1f6f54; --on-action: #ffffff; --danger: #c0271c; --warn: #9a5b00;
    }

    /* ===== 元件（顏色只用 token；Tailwind 僅管排版） ===== */
    [hidden] { display: none !important; }
    body { background: var(--bg); color: var(--text); }

    .page { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); max-width: 28rem; margin: 0 auto; }
    .page-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 14px; }
    .page-bar { display: flex; gap: 12px; padding: 10px 20px calc(16px + env(safe-area-inset-bottom)); }
    #view-home { z-index: 10; }
    .sub-page { z-index: 20; }

    .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 14px; padding: 12px 16px; cursor: pointer; }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-primary { background: var(--action); border-color: var(--action); color: var(--on-action); font-weight: 700; }
    .btn-danger { color: var(--danger); }
    .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 99px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); font-weight: 700; }
    .field { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; padding: 12px; font-size: 16px; }
    .muted { color: var(--muted); font-size: 14px; }
    .page-title { font-size: 20px; font-weight: 700; }
    .version { margin-top: auto; text-align: center; font-size: 12px; color: var(--muted); }

    /* 首頁：四季風景、扇形手牌、最近消費。季節色依手機月份切換 */
    #view-home[data-season="spring"] { --s-ink: #8a3558; --s-band: #5f8a49; --t1: #c2306a; --t2: #8a3f7d; }
    #view-home[data-season="summer"] { --s-ink: #11607c; --s-band: #1f7288; --t1: #06618a; --t2: #0b7f74; }
    #view-home[data-season="autumn"] { --s-ink: #8c4616; --s-band: #9a5226; --t1: #a83a12; --t2: #7c4a06; }
    #view-home[data-season="winter"] { --s-ink: #33497c; --s-band: #5873a3; --t1: #24467f; --t2: #4a4f8c; }
    .home-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 8px; }
    .hero { position: relative; flex: none; height: 232px; padding: 16px 20px; overflow: hidden; color: #1d1d1b; }
    .hero-bg { position: absolute; inset: 0; pointer-events: none; }
    .hero-bg svg { display: block; width: 100%; height: 100%; transform: translateY(-22px); }
    .hero-bg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 62px; --mid: color-mix(in srgb, var(--s-band) 88%, transparent); background: linear-gradient(transparent, var(--mid) 36%, var(--mid) 56%, var(--bg) 96%); }
    .decor-sun { transform: translateY(28px); }
    .decor-top { transform: translateY(52px); }
    .fall { animation: fall 5s ease-in-out infinite alternate; }
    @keyframes fall { to { transform: translate(-6px, 10px); } }
    .hero-bar, .hero-label, .hero-total { position: relative; }
    .hero-bar { display: flex; align-items: center; gap: 8px; }
    .hero-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 23px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(100deg, var(--t1), var(--t2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @media (max-width: 359px) { .hero-title { font-size: 20px; letter-spacing: 0; } }
    .bell { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #e6e2d9; background: rgba(255,255,255,.92); color: #1d1d1b; display: grid; place-items: center; }
    .bell.due::after { content: ""; position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; }
    .hero-label { margin-top: 6px; width: fit-content; max-width: 70%; font-size: 14px; color: #4d4a45; }
    .hero-total { font-size: 58px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; }
    .hero-date { position: absolute; left: 20px; right: 20px; bottom: 23px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; line-height: 18px; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .pay { flex: 1; height: 58px; font-size: 20px; border-radius: 16px; }

    /* 扇形手牌：彩色＝可用、淡化＝已用完、灰階＝沒有 */
    .cards { position: relative; flex: none; height: 142px; touch-action: pan-y; }
    .cards button { position: absolute; left: calc(50% - 29px); top: 30px; width: 58px; aspect-ratio: 54 / 85.6; padding: 0; border: 0; border-radius: 9px; overflow: hidden; background: #fff; color: #222; cursor: pointer; box-shadow: 0 4px 11px rgba(60,50,30,.24); transform-origin: 50% 90%; transition: transform .28s cubic-bezier(.3,1.3,.5,1), box-shadow .28s; }
    .cards img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .cards span, .cards b { position: absolute; left: 5px; font-size: 12px; font-weight: 800; line-height: 1; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
    .cards span { top: 6px; }
    .cards b { bottom: 5px; }
    .cards .spent img { opacity: .35; }
    .cards .none img { filter: grayscale(1); opacity: .55; }
    .cards button[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--tone), 0 10px 20px rgba(60,50,30,.3); }
    .subtotal { flex: none; text-align: center; font-size: 14px; line-height: 20px; color: var(--muted); }
    .subtotal b { margin-left: 10px; font-size: 16px; color: var(--text); }
    .home-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 20px 0; text-align: center; font-weight: 700; }
    .link { background: none; border: 0; padding: 6px; color: var(--muted); font-size: 14px; font-weight: 400; text-decoration: underline; cursor: pointer; }
    .quote { flex: none; margin-top: 24px; padding: 0 16px; background: none; border: 0; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: .5px; line-height: 22px; color: color-mix(in srgb, var(--s-ink) 68%, #f6f4ef); }
    .recent { flex: none; margin: 58px 24px 0; font-size: 14px; }
    .recent h3 { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .recent li { display: flex; gap: 10px; align-items: baseline; height: 29px; line-height: 29px; border-bottom: 1px solid var(--line); }
    .recent li:last-child { border-bottom: 0; }
    .recent time { flex: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
    .recent b { font-size: 16px; font-variant-numeric: tabular-nums; }
    .recent i { width: 34px; text-align: right; font-style: normal; font-size: 12px; color: var(--muted); }
    .recent .empty { color: var(--muted); }
    #view-home.hints2 .recent li:nth-child(n+3) { display: none; }
    @media (max-height: 700px) {
      .quote { margin-top: 14px; }
      .recent { margin-top: 24px; }
      .recent li:nth-child(n+3) { display: none; }
      #view-home.hints2 .recent li:nth-child(n+2) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .fall { animation: none; } .cards button { transition: none; } }

    /* 面額代表色 */
    .f35 { --tone: #e4602f; } .f50 { --tone: #1e9fd0; } .f100 { --tone: #17a455; } .f200 { --tone: #eeb008; }
    .f500 { --tone: #93bc1f; } .f1000 { --tone: #e0343a; } .fx { --tone: #9ca3af; }
    .mini { position: relative; display: block; flex: none; width: 36px; aspect-ratio: 54 / 85.6; border-radius: 7px; overflow: hidden; background: linear-gradient(#e4e4e4, #bdbdbd); color: #222; }
    .mini img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .mini i { position: absolute; right: 3px; top: 3px; font-style: normal; font-size: 11px; font-weight: 700; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
    .num { font-family: ui-monospace, Consolas, monospace; font-size: 14px; white-space: nowrap; }
    .row { display: flex; align-items: center; gap: 10px; }

    /* 卡片管理 */
    .cards-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; padding: 10px; background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 700; color: var(--muted); }
    .tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--action); }
    .filters { display: flex; flex: none; justify-content: space-between; gap: 2px; padding: 10px 12px 2px; overflow-x: auto; }
    .filter { position: relative; flex: none; width: 42px; min-height: 80px; padding: 0; background: none; border: 0; font-size: 12px; color: var(--text); }
    .filter .mini, .filter .all { width: 38px; margin: 0 auto 3px; border: 2px solid transparent; }
    .filter .all { display: grid; place-items: center; aspect-ratio: 54 / 85.6; border-radius: 7px; background: var(--surface); border-color: var(--line); font-weight: 700; }
    .filter[aria-pressed="true"] { transform: translateY(-3px); font-weight: 700; }
    .filter[aria-pressed="true"] .mini, .filter[aria-pressed="true"] .all { border-color: #111; }
    .filter[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -6px; right: 0; width: 16px; height: 16px; border-radius: 50%; background: #111; color: #fff; font-size: 10px; display: grid; place-items: center; }
    .filter.none .mini img { filter: grayscale(1); opacity: .6; }
    .list-note { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 12px 2px 16px; font-size: 13px; color: var(--muted); }
    .eye { width: 40px; height: 32px; display: grid; place-items: center; flex: none; background: none; border: 0; color: var(--muted); }
    .card-list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 12px; }
    .item { position: relative; margin: 8px 12px; border-radius: 14px; overflow: hidden; }
    .item > .hist, .item > .del { position: absolute; top: 2px; bottom: 2px; width: 78px; border: 0; color: #fff; font-weight: 700; }
    .item > .hist { left: 2px; border-radius: 12px 0 0 12px; background: #2563eb; }
    .item > .del { right: 2px; border-radius: 0 12px 12px 0; background: var(--danger); }
    .item .face { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; background: color-mix(in srgb, var(--tone) 11%, #fff); border-left: 6px solid var(--tone); color: #1d1d1b; touch-action: pan-y; user-select: none; transition: transform .2s; cursor: pointer; }
    .item.used .face { background: color-mix(in srgb, var(--tone) 4%, #fff); border-left-color: color-mix(in srgb, var(--tone) 35%, #fff); }
    .item.used .mini img { opacity: .35; }
    .editbtn { flex: none; min-height: 40px; padding: 0 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 14px; font-weight: 700; color: #1d1d1b; }
    .badge { display: inline-block; font-size: 12px; border: 1px solid var(--warn); color: var(--warn); border-radius: 99px; padding: 0 8px; }

    /* 底部面板與提示 */
    .shade { position: fixed; top: 0; left: 0; right: 0; height: 100%; height: 100dvh; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
    .sheet { width: 100%; max-width: 28rem; max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; background: var(--bg); color: var(--text); }
    .sheet-x { position: sticky; top: 0; z-index: 2; flex: none; align-self: flex-end; display: grid; place-items: center; width: 36px; height: 36px; margin: -4px -2px 0 0; padding: 0; border: 0; border-radius: 50%; background: var(--text); color: var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: pointer; }
    .sheet-x::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
    .sheet-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 60; max-width: 26rem; margin: 0 auto; padding: 10px 14px; border-radius: 12px; background: #222; color: #fff; font-size: 14px; text-align: center; }
    .btn-fill-danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
    .face-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-items: center; }
    .face-grid button { background: none; border: 2px solid transparent; border-radius: 10px; padding: 4px 8px; color: var(--text); }
    .face-grid button[aria-pressed="true"] { border-color: var(--text); }
    .face-grid .mini { margin: 0 auto 4px; }
    .fillcard { position: relative; width: 110px; aspect-ratio: 54 / 85.6; margin: 0 auto; flex: none; border-radius: 14px; overflow: hidden; background: linear-gradient(#e4e4e4, #bdbdbd); box-shadow: 0 8px 20px rgba(0,0,0,.18); color: #222; }
    .fillcard img { width: 100%; height: 100%; object-fit: cover; }
    .fillcard .empty { position: absolute; left: 0; right: 0; top: 0; background: rgba(235,233,228,.93); border-bottom: 3px solid var(--tone); transition: height .25s; }
    .fillcard b { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 26px; text-shadow: 0 0 6px #fff, 0 0 6px #fff; }
    .histrow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .photo { width: 100%; border-radius: 10px; border: 1px solid var(--line); }

    /* 設定 */
    .group { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .group > * { display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); cursor: pointer; }
    .group > *:last-child { border-bottom: 0; }
    .remind { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface); color: var(--text); font-size: 16px; }
    .ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .home-check { flex: none; background: none; border: 0; color: var(--warn); font-size: 14px; line-height: 20px; text-decoration: underline; padding: 0 20px; cursor: pointer; }

    /* 掃描畫面：取景框靠上、清單在下 */
    #view-scanner { background: #111418; color: #fff; }
    .scan-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; }
    .dark { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 10px; padding: 7px 12px; font-size: 14px; }
    .cam { position: relative; flex: none; display: flex; justify-content: center; overflow: hidden; background: #000; }
    #reader { position: absolute; inset: 0; }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
    /* 取景框固定不動、不畫框線：條碼與面額依它的位置讀取，四角畫在 #lock-overlay。
       左右留白讓卡片的邊落在畫面內，才找得到四邊 */
    .cam { padding: 18px 10% 38px; }
    #guide-box { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1.586 / 1; pointer-events: none; }
    #lock-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #lock-hint { position: absolute; left: -12%; right: -12%; top: calc(100% + 8px); text-align: center; font-size: 17px; font-weight: 700; line-height: 22px; text-shadow: 0 1px 4px #000; }
    #lock-fx { position: absolute; inset: 0; pointer-events: none; }
    #lock-fx[hidden] { display: none; }
    #lock-flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: shot-flash .35s ease-out; }
    #lock-shutter { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; opacity: 0; animation: shot-shutter .5s ease-in-out; }
    @keyframes shot-flash { 25% { opacity: .75; } }
    @keyframes shot-shutter { 0% { opacity: 0; transform: scale(1.35) rotate(0); } 35% { opacity: .7; } 70% { opacity: .7; transform: scale(.8) rotate(55deg); } 100% { opacity: 0; transform: scale(.8) rotate(55deg); } }
    @keyframes shot-fade { 40% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { #lock-flash, #lock-shutter { animation-name: shot-fade; } }
    /* 三個讀取燈號：藍＝等待、綠＝已讀到、黃＝需注意 */
    .zones { display: flex; flex: none; justify-content: center; gap: 10px; padding: 8px 16px 0; }
    .z { --c: 96,165,250; min-width: 54px; text-align: center; border: 1px solid rgba(var(--c),.9); border-radius: 99px; padding: 1px 10px; font-size: 12px; color: rgb(var(--c)); animation: breathe 2.4s ease-in-out infinite; }
    .z.ok, .z.warn { background: rgb(var(--c)); color: #111; animation: none; }
    .z.ok { --c: 74,222,128; }
    .z.warn { --c: 251,191,36; }
    .z b { font-weight: 700; }
    @keyframes breathe { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .z { animation: none; } }
    .scan-drop { color: #fca5a5; }
    .scan-drop.off { visibility: hidden; }
    .scanbar { flex: none; padding: 8px 16px 6px; border-bottom: 1px solid #374151; min-height: 74px; }
    .scan-status { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 700; }
    #scan-status, #scan-dot { transition: opacity 1s; }
    .scan-status.fading #scan-status, .scan-status.fading #scan-dot { opacity: 0; transition-duration: 1s; }
    @media (prefers-reduced-motion: reduce) { #scan-status, #scan-dot { transition: none !important; } }
    .scan-status .dot { width: 10px; height: 10px; border-radius: 50%; background: #60a5fa; flex: none; }
    .latest { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; }
    .shot-link { display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0; background: none; border: 0; color: inherit; cursor: pointer; }
    .shot-link .num { text-decoration: underline; text-underline-offset: 3px; }
    .shot-link .ic { width: 16px; height: 16px; opacity: .7; }
    .trash { width: 44px; height: 36px; display: grid; place-items: center; flex: none; margin-left: auto; background: none; border: 0; color: inherit; }
    .groups { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px env(safe-area-inset-bottom); }
    .grp { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 52px; padding: 5px 0; background: none; border: 0; border-bottom: 1px solid #252b33; color: inherit; text-align: left; }
    .grp .mini { width: 28px; border-radius: 5px; }
    .grp .mini i { font-size: 9px; right: 2px; top: 2px; }
    .grp.bump { animation: bump .9s ease-out; }
    @keyframes bump { from { background: rgba(74,222,128,.25); } }
    .sheet-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }

    /* 付款（收銀小票）：固定白底黑條碼，不套用 Theme */
    .payview { position: fixed; top: 0; left: 0; right: 0; height: 100%; height: 100dvh; z-index: 40; max-width: 28rem; margin: 0 auto; display: flex; flex-direction: column; background: #fff; color: #111; --text: #111; --surface: #fff; --bg: #f3f2ee; --line: #e6e2d9; --muted: #6f6c65; --action: #1f6f54; --on-action: #fff; --danger: #c0271c; --head: #22342d; --paper: #fbf8f1; }
    .pay-top { flex: none; background: var(--head); color: #fff; padding: 2px 10px 8px; }
    .pay-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .pay-head button { min-width: 44px; height: 44px; border: 0; border-radius: 22px; display: grid; place-items: center; background: #fff; color: var(--head); font-size: 15px; font-weight: 700; padding: 0 10px; }
    .pay-head svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
    .pay-head b { font-size: 15px; letter-spacing: 3px; }
    .pay-head .gap { width: 44px; }
    .sum { display: flex; align-items: flex-end; padding: 0 8px; }
    .sum div { font-size: 12px; line-height: 1.3; color: #c9d3ce; }
    .sum b { display: block; font-size: 18px; color: #fff; font-variant-numeric: tabular-nums; }
    .sum div + div { margin-left: 22px; }
    .sum .left { margin-left: auto; text-align: right; color: #fff; }
    .sum .left b { font-size: 34px; line-height: 1.1; color: #ffd873; }

    /* 橫式卡面（比例同實體卡） */

    .wide img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .wide i { position: absolute; left: 9%; top: 13%; font-style: normal; font-weight: 800; line-height: 1; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--stroke); paint-order: stroke fill; }

    .pay-item { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px; }
    .pay-item .wide { width: 72px; }
    .pay-item .wide i { font-size: 15px; }

    .pay-item .use b { display: block; font-size: 30px; line-height: 1.1; color: var(--danger); font-variant-numeric: tabular-nums; }

    .pay-mid { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; touch-action: pan-y; }
    .codes { flex: none; margin: auto 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
    .codes svg { width: 300px; max-width: 96%; height: auto; display: block; }
    .codes .seg { display: flex; align-items: center; gap: 6px; width: 300px; max-width: 96%; margin-bottom: 2px; font-size: 12px; font-weight: 700; }
    .codes .seg em { width: 18px; height: 18px; border-radius: 50%; background: #111; color: #fff; font-style: normal; display: grid; place-items: center; font-size: 11px; }
    .codes .seg.second { margin-top: 20px; }
    .codes img { max-width: 96%; max-height: 220px; border-radius: 6px; }
    .used-mark { margin-top: 10px; padding: 2px 16px; border: 3px double var(--danger); border-radius: 8px; color: var(--danger); font-size: 16px; font-weight: 900; letter-spacing: 3px; transform: rotate(-4deg); }
    .gone { text-align: center; padding: 0 24px; }
    .gone .used-mark { display: inline-block; margin: 0; font-size: 26px; padding: 8px 22px; }
    .gone p { margin-top: 16px; font-size: 14px; color: var(--muted); }
    .gone .btn { display: block; margin: 14px auto 0; min-height: 44px; font-size: 14px; }
    .gone .link { display: block; margin: 4px auto 0; min-height: 44px; }
    .gone small { display: block; font-size: 11px; color: var(--muted); }
    .pay-mid > .link { flex: none; align-self: center; min-height: 44px; margin-bottom: auto; }
    .pay-mid > .codes:last-child { margin-bottom: auto; }

    /* 小卡與長條合成一條：票根缺口、下緣連續進度 */
    .tray { flex: none; display: flex; justify-content: safe center; overflow-x: auto; padding: 4px 12px 0; scrollbar-width: none; }
    .tray::-webkit-scrollbar { display: none; }
    .chipcard { position: relative; flex: none; display: flex; flex-direction: column; justify-content: flex-start; width: 68px; height: 48px; padding: 0; border: 0; background: none; }
    .chip-face { display: grid; place-items: center; width: 100%; height: 40px; background: var(--pale); color: var(--stroke); font-size: 13px; font-weight: 800; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-variant-numeric: tabular-nums;
      -webkit-mask: radial-gradient(circle 4px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 4px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
      mask: radial-gradient(circle 4px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 4px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat; }
    .chipcard:first-child .chip-face { border-top-left-radius: 8px; }
    .chipcard:last-child .chip-face { border-top-right-radius: 8px; }
    .chip-bar { position: absolute; left: 0; right: 0; top: 40px; height: 6px; background: #e6e2d8; }
    .chipcard:first-child .chip-bar { border-bottom-left-radius: 4px; }
    .chipcard:last-child .chip-bar { border-bottom-right-radius: 4px; }
    .chipcard.done .chip-face { padding-top: 10px; }
    .chipcard.done .chip-bar { background: var(--action); }
    .chipcard.current .chip-bar { background: var(--action); }

    .chipcard.current:not(.done) .chip-bar { animation: breathe-bar 1.8s ease-in-out infinite; }
    @keyframes breathe-bar { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    .chip-ok { position: absolute; top: 2px; right: 6px; width: 14px; height: 14px; border-radius: 50%; background: #15803d; color: #fff; display: grid; place-items: center; font-size: 9px; font-weight: 900; }
    .pay-count { flex: none; text-align: center; font-size: 12px; line-height: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .keys button:active { background: #f1eee4; }

    @media (prefers-reduced-motion: reduce) {

  </style>

  <script>
    const APP_VERSION = '2026.11.27・abbffe9'; // 由 docs/tools/sw_version.py 寫入
    const DB_NAME = '711CardVaultDB';
    const STORE_NAME = 'cards';
    const PAY_STORE = 'payment'; // 未完成的付款，只有一筆 current
    const FACE_VALUES = [35, 50, 100, 200, 500, 1000];
    let db;
    let allCards = [];
    let payment = null;
    let waitingWorker = null; // 已下載、等待套用的新版本
    let cardTab = 'active';
    let cardFace = 0;      // 0＝全部
    let showNumbers = false;

    const $ = id => document.getElementById(id);

    // 偏好設定存 localStorage；讀寫失敗就用預設值
    function readPref(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function writePref(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 2);
        // 版本 2 只新增 payment，不動既有卡片
        request.onupgradeneeded = (e) => {
          const next = e.target.result;
          for (const name of [STORE_NAME, PAY_STORE]) {
            if (!next.objectStoreNames.contains(name)) next.createObjectStore(name, { keyPath: 'id' });
          }
        };
        request.onblocked = () => alert('請關閉其他開著本 app 的分頁，才能完成更新。');
        request.onsuccess = (e) => {
          db = e.target.result;
          db.onversionchange = () => {
            db.close();
            db = null;
            alert('app 已更新，請重新整理此頁面。');
          };
          loadCards().then(resolve);
        };
        request.onerror = (e) => reject(e);
      });
    }

    function loadCards() {
      return new Promise((resolve) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readonly');
        const cards = tx.objectStore(STORE_NAME).getAll();
        const record = tx.objectStore(PAY_STORE).get('current');
        tx.oncomplete = () => {
          allCards = cards.result.sort((a, b) => b.createdAt - a.createdAt);
          payment = record.result || null;
          render();
          resolve();
        };
      });
    }

    function writeStore(action) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        action(tx.objectStore(STORE_NAME));
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => reject(tx.error);
      });
    }

    function removeCard(id) {
      return writeStore(store => store.delete(id));
    }

    // 在同一個 transaction 內重新讀取再修改，避免用畫面上的舊物件覆蓋
    function updateCard(id, mutate) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const request = store.get(id);
        request.onsuccess = () => {
          const card = request.result;
          if (!card) { failure = new Error('找不到這張卡'); return tx.abort(); }
          mutate(card);
          store.put(card);
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 新增前在同一個 transaction 內檢查重複（另一個分頁可能剛建過）
    function addCard(card) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const request = store.getAll();
        request.onsuccess = () => {
          const codes = [card.barcode, card.barcode2].filter(Boolean);
          if (request.result.some(c => codes.includes(c.barcode) || codes.includes(c.barcode2))) {
            failure = new Error('這張卡已經建檔過');
            return tx.abort();
          }
          store.add(card);
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 變更餘額或面額，並追加紀錄。舊卡第一次變動時先留下原值（時間不明）
    function applyChange(card, type, balance, face = card.initialAmount) {
      if (balance !== card.balance || face !== card.initialAmount) {
        const history = Array.isArray(card.history) ? card.history
          : [{ at: null, balance: card.balance, face: card.initialAmount, type: 'before' }];
        card.history = [...history, { at: Date.now(), balance, face, type }];
        card.balance = balance;
        card.initialAmount = face;
      }
      card.status = balance > 0 ? 'active' : 'used';
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && db) loadCards();
    });

    // ===== 頁面切換 =====
    function showPage(id) {
      document.querySelectorAll('.sub-page').forEach(page => page.hidden = page.id !== id);
      $('view-home').hidden = Boolean(id);
      closeSheet();
      if (id === 'view-text') {
        document.querySelectorAll('[data-text]').forEach(input => input.value = textOf(input.dataset.text));
      }
    }

    // ===== 卡片四邊偵測與拉正 =====
    const CardEdge = (() => {
      const RATIO = 1.586;
      const EDGE = 22;          // 相鄰像素差達此值視為邊緣
      const MIN_SCORE = 0.55;   // 一條邊至少要有這麼多取樣點是邊緣
      const SIDES = ['top', 'right', 'bottom', 'left'];

      // 回傳 gx（左右方向的變化，用來找直邊）與 gy（上下方向，找橫邊）
      function edgeMaps({ data, width, height }) {
        const gx = new Uint8Array(width * height), gy = new Uint8Array(width * height);
        const diff = (a, b) => data[a + 3] && data[b + 3] // 超出影像的透明區不算邊
          ? Math.max(Math.abs(data[a] - data[b]), Math.abs(data[a + 1] - data[b + 1]), Math.abs(data[a + 2] - data[b + 2])) : 0;
        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            const i = y * width + x, p = i * 4;
            gx[i] = diff(p - 4, p + 4) >= EDGE ? 1 : 0;
            gy[i] = diff(p - width * 4, p + width * 4) >= EDGE ? 1 : 0;
          }
        }
        return { gx, gy };
      }

      // 找一側的候選直線。橫邊：y = c + k(x - mid)；直邊：x = c + k(y - mid)
      function findLines(map, width, height, box, side) {
        const flat = side === 'top' || side === 'bottom';
        const from = flat ? box.x + box.w * 0.1 : box.y + box.h * 0.12;
        const to = flat ? box.x + box.w * 0.9 : box.y + box.h * 0.88;
        const mid = flat ? box.x + box.w / 2 : box.y + box.h / 2;
        const expected = { top: box.y, bottom: box.y + box.h, left: box.x, right: box.x + box.w }[side];
        const tol = flat ? box.h * 0.17 : box.w * 0.12;
        const found = [];
        for (let degree = -8; degree <= 8; degree++) {
          const k = Math.tan(degree * Math.PI / 180);
          for (let c = Math.round(expected - tol); c <= expected + tol; c++) {
            let hits = 0, total = 0;
            for (let t = from; t <= to; t += 2) {
              const along = Math.round(t), across = Math.round(c + k * (t - mid));
              total++;
              for (let d = -1; d <= 1; d++) {
                const x = flat ? along : across + d, y = flat ? across + d : along;
                if (x >= 0 && y >= 0 && x < width && y < height && map[y * width + x]) { hits++; break; }
              }
            }
            if (hits / total >= MIN_SCORE) found.push({ c, k, mid, flat, score: hits / total });
          }
        }
        // 分數相同時取靠中間者；相近的線只留一條
        found.sort((a, b) => b.score - a.score || Math.abs(a.k) - Math.abs(b.k));
        const kept = [];
        for (const line of found) {
          if (kept.every(other => Math.abs(other.c - line.c) > 6)) kept.push(line);
          if (kept.length === 5) break;
        }
        return kept;
      }

      function cross(flat, upright) {
        // y = c1 + k1(x - m1)、x = c2 + k2(y - m2)
        const a = flat.c - flat.k * flat.mid, b = upright.c - upright.k * upright.mid;
        const y = (a + flat.k * b) / (1 - flat.k * upright.k);
        return { x: b + upright.k * y, y };
      }

      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      function measure([tl, tr, br, bl]) {
        const top = dist(tl, tr), bottom = dist(bl, br), left = dist(tl, bl), right = dist(tr, br);
        return {
          w: (top + bottom) / 2, h: (left + right) / 2,
          skew: Math.max(top / bottom, bottom / top, left / right, right / left),
          tilt: Math.atan2(tr.y - tl.y + br.y - bl.y, tr.x - tl.x + br.x - bl.x) * 180 / Math.PI,
          cx: (tl.x + tr.x + br.x + bl.x) / 4, cy: (tl.y + tr.y + br.y + bl.y) / 4
        };
      }

      // image：含取景框外圍的影像；box：取景框在影像中的位置
      function detect(image, box) {
        const { gx, gy } = edgeMaps(image);
        const lines = {};
        for (const side of SIDES) {
          lines[side] = findLines(side === 'top' || side === 'bottom' ? gy : gx, image.width, image.height, box, side);
        }
        let best = null;
        for (const t of lines.top) for (const r of lines.right) for (const b of lines.bottom) for (const l of lines.left) {
          const quad = [cross(t, l), cross(t, r), cross(b, r), cross(b, l)];
          const m = measure(quad);
          if (Math.abs(m.w / m.h / RATIO - 1) > 0.1 || m.skew > 1.12 || m.w < box.w * 0.75) continue;
          if (quad.some(p => p.x < 0 || p.y < 0 || p.x > image.width || p.y > image.height)) continue;
          // 分數相近時偏好較外圈的組合，避免抓到卡面上的印刷線條
          const score = t.score + r.score + b.score + l.score + 0.8 * (m.w * m.h) / (box.w * box.h) - 2 * Math.abs(m.w / m.h / RATIO - 1);
          if (!best || score > best.score) best = { quad, score };
        }
        return { sides: Object.fromEntries(SIDES.map(s => [s, lines[s].length > 0])), quad: best && best.quad };
      }

      // 把來源的四邊形貼到 out（透視校正，雙線性取樣）
      function warp(source, quad, out) {
        const src = source.getContext('2d').getImageData(0, 0, source.width, source.height);
        const ctx = out.getContext('2d'), dst = ctx.createImageData(out.width, out.height);
        const [p0, p1, p2, p3] = quad;
        const dx1 = p1.x - p2.x, dx2 = p3.x - p2.x, dx3 = p0.x - p1.x + p2.x - p3.x;
        const dy1 = p1.y - p2.y, dy2 = p3.y - p2.y, dy3 = p0.y - p1.y + p2.y - p3.y;
        const den = dx1 * dy2 - dx2 * dy1;
        const g = (dx3 * dy2 - dx2 * dy3) / den, h = (dx1 * dy3 - dx3 * dy1) / den;
        const a = p1.x - p0.x + g * p1.x, b = p3.x - p0.x + h * p3.x;
        const d = p1.y - p0.y + g * p1.y, e = p3.y - p0.y + h * p3.y;
        for (let j = 0; j < out.height; j++) {
          const v = (j + 0.5) / out.height;
          for (let i = 0; i < out.width; i++) {
            const u = (i + 0.5) / out.width, z = g * u + h * v + 1;
            const x = Math.min(Math.max((a * u + b * v + p0.x) / z, 0), source.width - 1.001);
            const y = Math.min(Math.max((d * u + e * v + p0.y) / z, 0), source.height - 1.001);
            const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
            const p = (y0 * source.width + x0) * 4, q = p + source.width * 4, o = (j * out.width + i) * 4;
            for (let n = 0; n < 3; n++) {
              dst.data[o + n] = (src.data[p + n] * (1 - fx) + src.data[p + 4 + n] * fx) * (1 - fy)
                + (src.data[q + n] * (1 - fx) + src.data[q + 4 + n] * fx) * fy;
            }
            dst.data[o + 3] = 255;
          }
        }
        ctx.putImageData(dst, 0, 0);
      }

      // 需要調整的提示；空字串代表對準了。拉正可修掉小幅歪斜與遠近，門檻從寬
      function advice(result) {
        const { quad, sides, box } = result;
        if (!quad) {
          const missing = SIDES.filter(s => !sides[s]).map(s => ({ top: '上', right: '右', bottom: '下', left: '左' })[s]);
          if (missing.length >= 3) return '把整張卡放進框內';
          if (missing.length) return `還沒抓到${missing.join('、')}邊`;
          return '放平、對齊框線';
        }
        const m = measure(quad);
        if (m.w < box.w * 0.84) return '靠近一點';
        if (m.w > box.w * 1.14) return '拿遠一點';
        if (m.cx - (box.x + box.w / 2) > box.w * 0.09) return '卡片往左一點';
        if (box.x + box.w / 2 - m.cx > box.w * 0.09) return '卡片往右一點';
        if (m.cy - (box.y + box.h / 2) > box.h * 0.11) return '卡片往上一點';
        if (box.y + box.h / 2 - m.cy > box.h * 0.11) return '卡片往下一點';
        if (Math.abs(m.tilt) > 7) return '轉正一點';
        if (m.skew > 1.09) return '手機放平一點';
        return '';
      }

      // 清晰度：卡片中央相鄰像素差的平方平均，越大越清楚
      function sharpness(full, result) {
        const f = result.toFull, m = measure(result.quad);
        const w = Math.round(m.w * f * 0.7), h = Math.round(m.h * f * 0.7);
        const { data } = full.getContext('2d').getImageData(Math.round(m.cx * f - w / 2), Math.round(m.cy * f - h / 2), w, h);
        let sum = 0, count = 0;
        for (let y = 0; y < h; y += 4) {
          for (let x = 1; x < w; x++, count++) {
            const i = (y * w + x) * 4 + 1, d = data[i] - data[i - 4];
            sum += d * d;
          }
        }
        return sum / count;
      }

      return { detect, warp, advice, measure, sharpness, dist };
    })();

    // ===== 兩段條碼 =====
    const SEGMENT_PATTERNS = { 1: /^\d{16}$/, 2: /^[0-9A-Z]{8}$/ };

    function segmentOf(value) {
      return SEGMENT_PATTERNS[1].test(value) ? 1 : SEGMENT_PATTERNS[2].test(value) ? 2 : 0;
    }

    function isComplete(card) {
      return SEGMENT_PATTERNS[2].test(card.barcode2 || '');
    }

    // ===== 西曆、農曆、節氣、節日（離線查表） =====
    // 瀏覽器內建的農曆在 2027 年春節等日子會差一天，故不用
    const Almanac = (() => {
      const WEEK = '日一二三四五六';
      const TERMS = ['春分', '清明', '穀雨', '立夏', '小滿', '芒種', '夏至', '小暑', '大暑', '立秋', '處暑', '白露',
        '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒', '立春', '雨水', '驚蟄'];
      const MONTHS = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '臘'];
      const DIGITS = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
      const dayName = d => d <= 10 ? `初${DIGITS[d]}` : d < 20 ? `十${DIGITS[d - 10]}` : d === 20 ? '二十' : d < 30 ? `廿${DIGITS[d - 20]}` : '三十';
      const STEMS = '甲乙丙丁戊己庚辛壬癸', BRANCHES = '子丑寅卯辰巳午未申酉戌亥';

      // 資料整理自香港天文台公曆與農曆對照表（2025–2050）
      const FIRST = Date.UTC(2025, 0, 29); // 正月初一
      const MONTH_CODE = 'babaabAbabbbababaabaabbbabbabaabaabbabbbabAabaabbabbabababaabbababbabababaabbAbabbabababaababbabbababaabababbbAbabaabababbabbabaabaabbabbbabaaBaababbbbabaabaababbbabababaababbabbAbababaababbababbabaabababbabbababAabababbabbabaabaabbabbbabaabaAbabbbbabaabaababbbabababaababbabbaBabaabababbabbabaababababbabbabaabaBababbab'; // a=29 天、b=30 天，大寫為閏月
      const TERM_DAYS = [ // 2025 起，每年 24 個節氣的日期（32 進位）
        '5k3i5k4k5l5l7m7n7n8n7m7l',
        '5k4i5k5k5l5l7n7n7n8n7m7m',
        '5k4j6l5k6l6l7n8n8n8n7m7m',
        '6k4j5k4j5k5l6m7m7m8n7m6l',
        '5k3i5k4k5l5l7m7n7n8n7m7l',
        '5k4i5k5k5l5l7n7n7n8n7m7m',
        '5k4j6l5k6l6l7n8n8n8n7m7m',
        '6k4j5k4j5k5l6m7m7m8n7m6l',
        '5k3i5k4k5l5l7m7n7n8n7m7l',
        '5k4i5k5k5l5l7n7n7n8n7m7m',
        '5k4j6l5k5l6l7n7n8n8n7m7m',
        '6k4j5k4j5k5l6m7m7m8n7m6l',
        '5k3i5k4k5l5l7m7n7n8n7m7l',
        '5k4i5k5k5l5l7n7n7n8n7m7m',
        '5k4j6l5k5l6l7n7n8n8n7m7m',
        '6k4j5k4j5k5l6m7m7m8n7m6l',
        '5k3i5k4k5k5l7m7n7m8n7m7l',
        '5k4i5k4k5l5l7n7n7n8n7m7m',
        '5k4j6l5k5l6l7n7n8n8n7m7m',
        '6k4j5k4j5k5l6m7m7m7n7m6l',
        '5k3i5k4j5k5l7m7n7m8n7m7l',
        '5k4i5k4k5l5l7m7n7n8n7m7m',
        '5k4j6l5k5l6l7n7n8n8n7m7m',
        '6k4j5k4j5k5k6m7m7m7n7l6l',
        '5j3i5k4j5k5l6m7m7m8n7m7l',
        '5k3i5k4k5l5l7m7n7n8n7m7m',
      ];

      // 展開成每個農曆月的起始日
      const STARTS = [];
      for (let i = 0, at = FIRST, year = 2025, month = 0; i < MONTH_CODE.length; i++) {
        const c = MONTH_CODE[i], leap = c !== c.toLowerCase();
        if (!leap) { month = month % 12 + 1; if (month === 1 && i) year++; }
        STARTS.push({ at, year, month, leap });
        at += (c.toLowerCase() === 'a' ? 29 : 30) * 86400000;
      }
      const END = STARTS[STARTS.length - 1].at + 29 * 86400000;

      // y、m、d 為西曆日期（m 從 1 起）；超出資料範圍回傳 null
      function lunar(y, m, d) {
        const day = Date.UTC(y, m - 1, d);
        if (day < FIRST || day >= END) return null;
        let i = STARTS.length - 1;
        while (STARTS[i].at > day) i--;
        const s = STARTS[i];
        return { year: s.year, month: s.month, leap: s.leap, day: Math.round((day - s.at) / 86400000) + 1,
          ganzhi: STEMS[(s.year - 4) % 10] + BRANCHES[(s.year - 4) % 12] };
      }

      function solarTerm(y, m, d) {
        const days = TERM_DAYS[y - 2025];
        if (!days) return null;
        for (const i of [(m - 1) * 2, (m - 1) * 2 + 1]) {
          // 資料順序從小寒起；TERMS 從春分起
          if (parseInt(days[i], 32) === d) return TERMS[(i + 19) % 24];
        }
        return null;
      }

      const SOLAR = { '1/1': '元旦', '2/14': '西洋情人節', '2/28': '和平紀念日', '3/8': '婦女節', '4/4': '兒童節', '5/1': '勞動節',
        '8/8': '父親節', '9/28': '教師節', '10/10': '國慶日', '10/25': '光復節', '12/25': '聖誕節' };
      const LUNAR = { '1/1': '春節', '1/2': '初二回娘家', '1/15': '元宵節', '5/5': '端午節', '7/7': '七夕', '7/15': '中元節', '8/15': '中秋節', '9/9': '重陽節', '12/8': '臘八節' };

      function festivals(y, m, d) {
        const list = [], cal = lunar(y, m, d);
        if (!cal) return SOLAR[`${m}/${d}`] ? [SOLAR[`${m}/${d}`]] : [];
        const tomorrow = new Date(Date.UTC(y, m - 1, d + 1));
        const next = lunar(tomorrow.getUTCFullYear(), tomorrow.getUTCMonth() + 1, tomorrow.getUTCDate());
        if (next && cal.month === 12 && next.month === 1) list.push('除夕');
        if (!cal.leap && LUNAR[`${cal.month}/${cal.day}`]) list.push(LUNAR[`${cal.month}/${cal.day}`]);
        if (SOLAR[`${m}/${d}`]) list.push(SOLAR[`${m}/${d}`]);
        const weekday = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
        if (m === 5 && weekday === 0 && d > 7 && d <= 14) list.push('母親節');
        return list;
      }

      // 回傳畫面需要的文字；節氣與節日只在當天出現
      function describe(date) {
        const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
        const cal = lunar(y, m, d);
        const two = n => String(n).padStart(2, '0');
        return {
          solar: `${y}/${two(m)}/${two(d)} 週${WEEK[date.getDay()]}`,
          lunar: cal ? `${cal.leap ? '閏' : ''}${MONTHS[cal.month - 1]}月${dayName(cal.day)}` : '',
          today: [solarTerm(y, m, d), ...festivals(y, m, d)].filter(Boolean)
        };
      }

      return { describe, solarTerm, lunar, festivals };
    })();

    // ===== 首頁與清單 =====
    function activeCards() {
      return allCards.filter(c => c.status === 'active' && c.balance > 0);
    }

    // 兩段齊全且非待核對才能付款
    function payableCards() {
      return activeCards().filter(c => isComplete(c) && !c.needsCheck);
    }

    // ===== 首頁：季節風景與日期 =====
    const SCENE = {
      spring: { sky: ['#ffe3ec', '#fff6f1'], far: '#cfe3b4', near: '#a9cd8c', sun: '#ffd1a8' },
      summer: { sky: ['#bfe6ff', '#effaff'], far: '#7fcad0', near: '#4aa9bd', sun: '#ffd34d' },
      autumn: { sky: ['#ffdcae', '#fff3de'], far: '#e3a35c', near: '#c2703a', sun: '#f7934c' },
      winter: { sky: ['#cfdcf0', '#f1f6fc'], far: '#dbe5f3', near: '#ffffff', sun: '#fff4d6' }
    };

    function seasonArt(season) {
      const many = (list, draw) => list.map(draw).join('');
      const flower = (x, y, r) => `<g transform="translate(${x} ${y})">${many([0, 72, 144, 216, 288], a => `<ellipse cy="${-r}" rx="${r * .62}" ry="${r}" fill="#ff9fbc" transform="rotate(${a})"/>`)}<circle r="${r * .45}" fill="#ffe27a"/></g>`;
      const leaf = (x, y, s, a, c) => `<path transform="translate(${x} ${y}) rotate(${a}) scale(${s})" fill="${c}" d="M0-10 3-4 9-6 7 0 11 3 4 4 5 9 1 7 0 13-1 7-5 9-4 4-11 3-7 0-9-6-3-4Z"/>`;
      const pine = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path fill="#5d7f8e" d="M0-34 12-14H6L16 2H8L18 18H-18L-8 2H-16L-6-14H-12Z"/><path fill="#fff" d="M0-34 7-22 2-24-2-20-7-22Z"/><rect x="-2" y="18" width="4" height="7" fill="#6b5646"/></g>`;
      const decor = {
        spring: () => `<g class="decor-top"><path d="M368 18C320 30 296 56 262 62M318 40C310 58 296 74 292 92" stroke="#8a5a4a" stroke-width="4" fill="none" stroke-linecap="round"/>${many([[266, 62, 8], [296, 52, 10], [330, 34, 9], [292, 92, 8], [308, 72, 6], [348, 56, 7]], p => flower(...p))}
          <g class="fall" fill="#ffb3c9">${many([[220, 80], [250, 130], [320, 120], [190, 40], [338, 160]], ([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="2.6" transform="rotate(30 ${x} ${y})"/>`)}</g></g>`,
        summer: () => `<g fill="#fff"><path class="decor-sun" d="M226 112a14 14 0 0 1 22-14a18 18 0 0 1 34 2a13 13 0 0 1 14 12z"/><path opacity=".8" d="M150 74a9 9 0 0 1 14-8a12 12 0 0 1 22 2a8 8 0 0 1 8 6z"/></g>
          <path d="M270 190l26-34v34z" fill="#fff"/><path d="M299 190v-30l18 30z" fill="#ff8a6b"/><path d="M262 192h62l-10 10h-42z" fill="#7a5236"/>`,
        autumn: () => `<g class="fall">${many([[312, 100, 1.4, 20, '#d9542b'], [254, 108, 1, -35, '#e98a24'], [336, 126, 1.1, 60, '#c23c28'], [220, 52, .8, 10, '#e6a82a'], [316, 164, .7, -20, '#d9542b'], [266, 148, .6, 45, '#e98a24']], p => leaf(...p))}</g>`,
        winter: () => `${pine(300, 170, 1.2)}${pine(334, 182, .9)}${pine(268, 188, .7)}
          <g class="fall" fill="#fff">${many([[40, 70, 3], [96, 40, 2], [172, 96, 3], [214, 50, 2.4], [250, 112, 3], [288, 78, 2], [340, 104, 3], [140, 150, 2], [62, 168, 2.6], [228, 160, 2]], ([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" stroke="#b9cbe6" stroke-width=".6"/>`)}</g>`
      };
      const s = SCENE[season];
      return `<svg viewBox="-30 0 390 232" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
        <defs><linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${s.sky[0]}"/><stop offset="1" stop-color="${s.sky[1]}"/></linearGradient></defs>
        <rect x="-30" width="390" height="254" fill="url(#hero-sky)"/>
        <circle class="${season === 'autumn' ? '' : 'decor-sun'}" cx="256" cy="${season === 'autumn' ? 150 : 86}" r="22" fill="${s.sun}" opacity=".85"/>
        <path d="M-30 176Q-14 192 0 186Q60 156 130 180T260 172T360 166V232H-30Z" fill="${s.far}"/>
        <path d="M-30 206L0 204Q90 180 180 202T360 194V232H-30Z" fill="${s.near}"/>
        ${decor[season]()}</svg>`;
    }

    const seasonOf = month => month >= 3 && month <= 5 ? 'spring' : month >= 6 && month <= 8 ? 'summer' : month >= 9 && month <= 11 ? 'autumn' : 'winter';

    // 西曆、農曆；節氣與節日只在當天出現。季節依月份切換
    function renderToday() {
      const now = new Date();
      const info = Almanac.describe(now);
      const season = seasonOf(now.getMonth() + 1);
      if ($('view-home').dataset.season !== season) {
        $('view-home').dataset.season = season;
        $('hero-bg').innerHTML = seasonArt(season);
      }
      $('date-solar').textContent = info.solar;
      $('date-lunar').textContent = [info.lunar, ...info.today].filter(Boolean).join('・');
      showQuote(); // 跨日後回到 app 時一併換句
    }

    function render() {
      renderHome();
      renderCardList();
    }

    function renderHome() {
      const cards = payableCards();
      const sumOf = list => list.reduce((sum, c) => sum + Number(c.balance), 0);
      renderToday();
      $('total-balance').textContent = `$${sumOf(cards).toLocaleString()}`;
      $('btn-pay').disabled = cards.length === 0 && !payment;
      $('btn-pay').textContent = payment ? '繼續付款' : '付款';
      $('home-pending').hidden = !payment;
      $('home-update').hidden = !waitingWorker || Boolean(payment); // 付款中不提示換版
      const toCheck = activeCards().filter(c => c.needsCheck).length;
      $('home-check').hidden = toCheck === 0;
      $('home-check').textContent = `${toCheck} 張待核對，未計入`;
      renderHomeEmpty(cards.length);
      renderDenominations(cards);
      renderRecent();
      renderBackup();
    }

    // 有提示時取代面額小計；兩則以上時少顯示一筆消費
    function renderHints() {
      const count = ['home-update', 'home-pending', 'home-check'].filter(id => !$(id).hidden).length;
      $('subtotal').hidden = count > 0 || !$('home-empty').hidden;
      $('view-home').classList.toggle('hints2', count > 1);
    }

    // 沒有可付款的卡時，依原因給不同引導
    function renderHomeEmpty(payableCount) {
      const box = $('home-empty');
      box.hidden = payableCount > 0;
      // 第三種狀態本身已說明原因，不再重複提示
      $('pay-hint').hidden = Boolean(payment) || payableCount > 0 || (allCards.length > 0 && activeCards().length > 0);
      if (payableCount > 0) return box.replaceChildren();

      const title = document.createElement('p');
      const button = (text, className, onClick) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = className;
        btn.textContent = text;
        btn.onclick = onClick;
        return btn;
      };
      if (allCards.length === 0) {
        title.textContent = '尚未加入商品卡';
        box.replaceChildren(title, button('新增第一張卡', 'btn btn-primary', openScanner));
      } else if (activeCards().length === 0) {
        title.textContent = '卡片已用完';
        box.replaceChildren(title, button('新增卡片', 'btn btn-primary', openScanner),
          button('查看已用完卡片', 'link', () => openCards('used')));
      } else {
        title.textContent = '目前沒有可付款的卡片';
        box.replaceChildren(title, button('前往卡片管理', 'btn', () => openCards()));
      }
    }

    // 扇形手牌：固定五種面額，1000 只在有可付款的卡時出現。部分使用的卡仍算在原面額
    let pickedFace = 0;
    let fanData = [];

    function renderDenominations(payable) {
      const of = (list, value) => list.filter(c => Number(c.initialAmount) === value);
      fanData = FACE_VALUES.filter(value => value !== 1000 || of(payable, value).length > 0).map(value => {
        const usable = of(payable, value);
        return { value, count: usable.length, total: usable.reduce((sum, c) => sum + Number(c.balance), 0),
          state: usable.length ? '' : of(allCards, value).length ? 'spent' : 'none' };
      });
      const box = $('denominations');
      const key = fanData.map(f => f.value).join();
      if (box.dataset.faces !== key) {
        box.dataset.faces = key;
        box.innerHTML = fanData.map(f => `<button type="button" data-value="${f.value}"><img src="cards/card-${f.value}.svg" alt="" draggable="false"><span>${f.value}</span><b></b></button>`).join('');
        box.querySelectorAll('button').forEach(btn => btn.onclick = () => { if (!box.dataset.swiped) pickFace(Number(btn.dataset.value)); });
      }
      if (!fanData.some(f => f.value === pickedFace)) {
        pickedFace = (fanData.find(f => f.value === 100 && f.count) || fanData.find(f => f.count) || fanData[2]).value;
      }
      drawFan();
      renderHints();
    }

    function drawFan() {
      const middle = (fanData.length - 1) / 2;
      $('denominations').querySelectorAll('button').forEach((node, i) => {
        const f = fanData[i], o = i - middle, on = f.value === pickedFace;
        const label = f.count ? `${f.count} 張可用` : f.state === 'spent' ? '沒有可用的卡' : '沒有卡';
        node.className = `f${f.value} ${f.state}`;
        node.setAttribute('aria-label', `面額 ${f.value}，${label}`);
        node.setAttribute('aria-pressed', on);
        node.querySelector('b').textContent = f.state === 'none' ? '' : `×${f.count}`;
        node.style.zIndex = on ? 20 : i + 1;
        node.style.transform = on ? `translate(${o * 42}px, -14px) scale(1.25)` : `translate(${o * 44}px, ${o * o * 2.4}px) rotate(${o * 6}deg)`;
      });
      const f = fanData.find(item => item.value === pickedFace);
      $('subtotal').innerHTML = f.count ? `面額 ${f.value}<b>${money(f.total)}</b>` : `面額 ${f.value}　${f.state === 'spent' ? '已用完' : '尚未擁有'}`;
    }

    function pickFace(value) {
      pickedFace = value;
      drawFan();
    }

    (function bindFan() {
      const box = $('denominations');
      let startX = null;
      box.onpointerdown = e => { startX = e.clientX; box.dataset.swiped = ''; };
      box.onpointercancel = () => startX = null;
      box.onpointerup = e => {
        if (startX === null) return;
        const dx = e.clientX - startX;
        startX = null;
        if (Math.abs(dx) < 30) return;
        box.dataset.swiped = '1';
        const at = fanData.findIndex(f => f.value === pickedFace) + (dx < 0 ? 1 : -1);
        if (fanData[at]) pickFace(fanData[at].value);
      };
    })();

    // 由各卡的付款紀錄推得；同一次付款寫入時間相近，合併成一筆。只含商品卡扣款
    function recentSpending() {
      const entries = [];
      for (const card of allCards) {
        const history = Array.isArray(card.history) ? card.history : [];
        history.forEach((h, i) => {
          if (h.type !== 'pay' || !i) return;
          const amount = history[i - 1].balance - h.balance;
          if (amount > 0) entries.push({ at: h.at, amount });
        });
      }
      const groups = [];
      for (const entry of entries.sort((a, b) => b.at - a.at)) {
        const last = groups[groups.length - 1];
        if (last && last.from - entry.at <= 2000) {
          last.amount += entry.amount;
          last.count++;
          last.from = entry.at;
        } else {
          groups.push({ at: entry.at, from: entry.at, amount: entry.amount, count: 1 });
        }
      }
      return groups.slice(0, 3);
    }

    function renderRecent() {
      $('recent').hidden = allCards.length === 0;
      const two = n => String(n).padStart(2, '0');
      $('recent-list').innerHTML = recentSpending().map(g => {
        const at = new Date(g.at);
        return `<li><time>${two(at.getMonth() + 1)}/${two(at.getDate())} ${two(at.getHours())}:${two(at.getMinutes())}</time><b>−${escapeHTML(money(g.amount))}</b><i>${g.count} 張</i></li>`;
      }).join('') || '<li class="empty">尚無消費</li>';
    }

    // 卡片欄位來自掃描或匯入檔，寫入 innerHTML 前一律跳脫
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    const EYE = '<svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = EYE.replace('</svg>', '<path d="M4 4l16 16"/></svg>');
    const money = value => `$${Number(value).toLocaleString()}`;
    const faceClass = value => FACE_VALUES.includes(Number(value)) ? `f${Number(value)}` : 'fx';
    const fullNo = no => String(no).replace(/(.{4})(?=.)/g, '$1 ');
    const maskedNo = no => {
      const text = String(no);
      return text.length === 16 ? `**** **** ${text.slice(8, 12)} ${text.slice(12)}` : `**** ${text.slice(-4)}`;
    };
    const findCard = id => allCards.find(c => c.id === id);
    const isLocked = id => Boolean(payment?.items.some(i => i.cardId === id));
    const LOCKED_HINT = '這張卡在未完成的付款中，請先完成或放棄付款';
    const isUsed = card => !(card.status === 'active' && card.balance > 0);

    function faceImage(value) {
      return FACE_VALUES.includes(Number(value)) ? `<img src="cards/card-${Number(value)}.svg" alt="">` : '';
    }

    function miniCard(value, label = true) {
      return `<span class="mini">${faceImage(value)}${label ? `<i>${escapeHTML(value)}</i>` : ''}</span>`;
    }

    // 進入卡片管理：回到遮蔽與全部面額
    function openCards(tab = 'active') {
      showPage('view-cards');
      cardTab = tab;
      cardFace = 0;
      showNumbers = false;
      renderCardList();
    }

    function setCardTab(tab) {
      cardTab = tab;
      renderCardList();
    }

    function setCardFace(value) {
      cardFace = value;
      renderCardList();
    }

    function toggleNumbers() {
      showNumbers = !showNumbers;
      renderCardList();
    }

    function renderCardList() {
      const inTab = tab => allCards.filter(c => isUsed(c) === (tab === 'used'));
      const pool = inTab(cardTab);
      for (const [tab, label] of [['active', '未用完'], ['used', '已用完']]) {
        $(`tab-${tab}`).textContent = `${label} ${inTab(tab).length}`;
        $(`tab-${tab}`).setAttribute('aria-pressed', tab === cardTab);
      }

      const shown = FACE_VALUES.filter(v => v !== 1000 || pool.some(c => Number(c.initialAmount) === v));
      if (cardFace && !shown.includes(cardFace)) cardFace = 0;
      $('filters').innerHTML = [0, ...shown].map(value => {
        const count = pool.filter(c => !value || Number(c.initialAmount) === value).length;
        return `<button type="button" class="filter ${value && !count ? 'none' : ''}" data-face="${value}" aria-pressed="${cardFace === value}" aria-label="${value ? `面額 ${value}` : '全部'}，${count} 張">
          ${value ? miniCard(value) : '<span class="all">全部</span>'}${value && !count ? '' : count}</button>`;
      }).join('');
      $('filters').querySelectorAll('button').forEach(btn => btn.onclick = () => setCardFace(Number(btn.dataset.face)));

      const rows = pool.filter(c => !cardFace || Number(c.initialAmount) === cardFace)
        .sort((a, b) => a.initialAmount - b.initialAmount || a.createdAt - b.createdAt);
      const payableSum = rows.filter(c => isComplete(c) && !c.needsCheck && !isUsed(c)).reduce((sum, c) => sum + Number(c.balance), 0);
      $('list-summary').textContent = `${rows.length} 張・可付款 ${money(payableSum)}`;
      $('eye-all').innerHTML = showNumbers ? EYE_OFF : EYE;
      $('eye-all').setAttribute('aria-pressed', showNumbers);
      $('eye-all').setAttribute('aria-label', showNumbers ? '遮蔽全部卡號' : '顯示全部完整卡號');

      $('card-list').innerHTML = rows.map(card => `
        <div class="item ${faceClass(card.initialAmount)} ${isUsed(card) ? 'used' : ''}">
          <button type="button" class="hist" tabindex="-1">紀錄</button>
          <button type="button" class="del" data-del="${escapeHTML(card.id)}">刪除</button>
          <div class="face" data-id="${escapeHTML(card.id)}" role="button" tabindex="0" aria-label="看原圖">
            ${miniCard(card.initialAmount)}
            <div class="flex-1 min-w-0">
              <div class="num">${escapeHTML(showNumbers ? fullNo(card.barcode) : maskedNo(card.barcode))}</div>
              <b class="text-xl">${escapeHTML(money(card.balance))}</b>
              ${card.needsCheck ? '<span class="badge">待核對</span>' : ''}
              ${isLocked(card.id) ? '<span class="badge">付款中</span>' : ''}
              ${isComplete(card) ? '' : '<div class="text-xs" style="color:var(--danger)">缺第②段，請刪除後重掃</div>'}
            </div>
            <button type="button" class="editbtn" data-edit="${escapeHTML(card.id)}">改餘額</button>
          </div>
        </div>`).join('') || `<p class="muted text-center py-10">沒有符合的卡片</p>`;
      bindCardRows();
    }

    // 左滑：露出刪除；右滑：開餘額紀錄；點一下：看原圖
    function bindCardRows() {
      const list = $('card-list');
      let openRow = null;
      const move = (el, x) => el.style.transform = `translateX(${x}px)`;

      list.querySelectorAll('.face').forEach(el => {
        let start = null, dx = 0, axis = '', base = 0;
        el.onpointerdown = e => {
          if (e.target.closest('button')) return;
          if (e.clientX < 24 || window.innerWidth - e.clientX < 24) return; // 讓出邊緣返回手勢
          start = { x: e.clientX, y: e.clientY };
          dx = 0; axis = ''; base = openRow === el ? -80 : 0;
        };
        el.onpointermove = e => {
          if (!start) return;
          const mx = e.clientX - start.x, my = e.clientY - start.y;
          if (!axis && Math.hypot(mx, my) > 12) {
            axis = Math.abs(mx) > Math.abs(my) * 1.5 ? 'x' : 'y';
            if (axis === 'x') el.setPointerCapture(e.pointerId);
          }
          if (axis !== 'x') return;
          dx = Math.max(-80, Math.min(base ? 0 : 80, base + mx));
          el.style.transition = 'none';
          move(el, dx);
        };
        el.onpointerup = () => {
          if (!start) return;
          start = null;
          el.style.transition = '';
          if (axis === 'x') {
            if (openRow && openRow !== el) move(openRow, 0);
            openRow = dx < -40 ? el : null;
            move(el, openRow ? -80 : 0);
            if (dx > 40) showHistory(el.dataset.id);
          } else if (!axis) {
            if (openRow) { move(openRow, 0); openRow = null; }
            else viewPhoto(el.dataset.id);
          }
        };
        el.onpointercancel = () => {
          start = null;
          el.style.transition = '';
          move(el, openRow === el ? -80 : 0);
        };
        el.onkeydown = e => { if (e.key === 'Enter' && e.target === el) viewPhoto(el.dataset.id); };
      });
      list.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => editBalance(btn.dataset.edit));
      list.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => askDelete(btn.dataset.del));
    }

    // ----- 底部面板 -----
    let sheetOpenedAt = 0;
    let toastTimer;

    let sheetDismiss = null;

    function openSheet(html, onDismiss = null) {
      sheetDismiss = onDismiss;
      // 右上角 ✕ 固定可見（底部按鈕可能被瀏覽器網址列擋住），作用同點背景
      $('sheet').innerHTML = '<button type="button" class="sheet-x" aria-label="關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' + html;
      $('sheet').querySelector('.sheet-x').onclick = () => (sheetDismiss || closeSheet)();
      $('sheet').scrollTop = 0;
      $('shade').hidden = false;
      sheetOpenedAt = Date.now();
    }

    function closeSheet() {
      $('shade').hidden = true;
      $('sheet').replaceChildren();
    }

    // 剛開啟的瞬間不接受點背景，避免同一次觸控把面板關掉
    $('shade').onclick = e => {
      if (e.target === $('shade') && Date.now() - sheetOpenedAt > 350) (sheetDismiss || closeSheet)();
    };

    function sheetButton(action, handler) {
      $('sheet').querySelector(`[data-act="${action}"]`).onclick = handler;
    }

    function toast(text) {
      $('toast').textContent = text;
      $('toast').hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').hidden = true, 2200);
    }

    function viewPhoto(id) {
      const card = findCard(id);
      if (!card) return;
      const hasImage = String(card.cropImage || '').startsWith('data:image/');
      openSheet(`<div class="row justify-between"><span class="num">${escapeHTML(maskedNo(card.barcode))}</span><b>面額 $${escapeHTML(card.initialAmount)}</b></div>
        ${hasImage ? '<img class="photo" alt="卡背原圖">' : '<p class="muted text-center py-10">沒有原圖</p>'}
        <button type="button" class="btn" data-act="face">改面額（判讀錯誤時）</button>`);
      if (hasImage) $('sheet').querySelector('.photo').src = card.cropImage;
      sheetButton('face', () => askFaceChange(id));
    }

    function askFaceChange(id) {
      const card = findCard(id);
      if (!card) return;
      if (isLocked(id)) return toast(LOCKED_HINT);
      openSheet(`<b>改面額</b><p class="muted">${escapeHTML(maskedNo(card.barcode))}・目前 $${escapeHTML(card.initialAmount)}。未使用的卡，餘額跟著改；用過的卡保留餘額（不超過新面額）。</p>
        <div class="face-grid">${FACE_VALUES.map(v => `<button type="button" data-value="${v}" aria-pressed="${v === Number(card.initialAmount)}">${miniCard(v, false)}<b>$${v}</b></button>`).join('')}</div>`, () => viewPhoto(id));
      $('sheet').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => changeFace(id, Number(btn.dataset.value)));
    }

    function changeFace(id, face) {
      updateCard(id, card => {
        // 紀錄裡曾經低於面額就視為用過，避免改面額把餘額加回來
        const unused = card.balance === card.initialAmount && (card.history || []).every(h => h.balance === h.face);
        applyChange(card, 'face', unused ? face : Math.min(card.balance, face), face);
      }).then(() => { closeSheet(); toast(`面額已改為 $${face}`); })
        .catch(() => toast('儲存失敗，請再試一次'));
    }

    function showHistory(id) {
      const card = findCard(id);
      if (!card) return;
      const history = Array.isArray(card.history) ? card.history : [];
      const rows = history.map((h, i) => {
        const faceChanged = i > 0 && h.face !== history[i - 1].face;
        const note = [h.type === 'create' ? '建檔' : '', faceChanged ? `面額改為 $${h.face}` : ''].filter(Boolean).join('，');
        return `<div class="histrow"><span class="muted">${h.at ? escapeHTML(new Date(h.at).toLocaleDateString('zh-TW')) : '改版前'}</span>
          <b>${escapeHTML(money(h.balance))}${note ? `<span class="muted">（${escapeHTML(note)}）</span>` : ''}</b></div>`;
      }).reverse().join('');
      openSheet(`<div class="row">${miniCard(card.initialAmount)}<div><div class="num">${escapeHTML(maskedNo(card.barcode))}</div><b>餘額紀錄</b></div></div>

      const season = QUOTES[seasonOf(m)];
      const pool = season.flatMap((line, i) => [QUOTES.common[i * 2], QUOTES.common[i * 2 + 1], line]);
      const day = Date.UTC(y, m - 1, d) / 86400000;
      return pool[(day + taps - (special ? 1 : 0)) % pool.length];
    }

    // 改以相機原始解析度裁出紅線附近的長條，再交給同一函式庫解碼。
    async function startCamera() {
      const request = ++cameraRequest;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }
        });
        if (request !== cameraRequest) return stream.getTracks().forEach(t => t.stop()); // 開啟途中已關閉
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.srcObject = stream;
        $('reader').replaceChildren(video);
        camera = { stream, video, timer: 0, lockTimer: 0, fxTimer: 0 };
        await video.play();
        decodeLoop(request);
        lockLoop(request);
      } catch (err) {
        if (request === cameraRequest) alert("無法啟動相機，請確認網址為 HTTPS 並允許相機權限：\n" + err);
      }
    }

    function stopCamera() {
      cameraRequest++;
      if (!camera) return;
      clearTimeout(camera.timer);
      clearTimeout(camera.lockTimer);
      clearTimeout(camera.fxTimer);
      clearLockView();
      camera.stream.getTracks().forEach(t => t.stop());
      camera = null;
      $('reader').replaceChildren();
    }
