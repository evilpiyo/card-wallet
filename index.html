<!DOCTYPE html>
<html lang="zh-TW" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>小七商品卡管家</title>
  <meta name="apple-mobile-web-app-title" content="小七卡管家">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <script src="vendor/tailwindcss-3.4.17.js"></script>
  <script src="vendor/html5-qrcode-2.3.8.min.js"></script>
  <script src="vendor/jsbarcode-3.11.6.min.js"></script>
  <script src="card-edge.js"></script>
  <script src="almanac.js"></script>
  <script src="quotes.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body class="font-sans select-none">

  <!-- 首頁 -->
  <main id="view-home" class="page">
    <div class="home-body">
      <header class="hero">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-bar">
          <h1 class="hero-title" data-key="cv-title" data-default="小七商品卡匣"></h1>
          <button class="bell" id="btn-add" onclick="openScanner()" aria-label="新增卡片">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M10.5 9v6M13.5 9v6M16 9v6"/></svg>
          </button>
          <button class="bell" id="btn-settings" onclick="showPage('view-settings')" aria-label="設定">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.85a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
        <p class="hero-label" data-key="cv-label" data-default="餘額"></p>
        <p class="hero-total" id="total-balance">$0</p>
        <div class="hero-date"><span id="date-solar"></span><span id="date-lunar"></span></div>
      </header>
      <div class="cards" id="denominations"></div>
      <button type="button" class="home-check" id="home-update" onclick="applyUpdate()" hidden>有新版本，點此更新</button>
      <button type="button" class="home-check" id="home-pending" onclick="openPay()" hidden>有一筆付款尚未完成</button>
      <button type="button" class="home-check" id="home-check" onclick="openCards()" hidden></button>
      <div class="home-empty" id="home-empty" hidden></div>
      <button type="button" class="quote" id="quote" onclick="nextQuote()" title="點一下換一句"></button>
      <section class="recent" id="recent"><h3>最近消費</h3><ul id="recent-list"></ul></section>
    </div>

    <p class="muted text-center" id="pay-hint" hidden>目前沒有可付款的卡片</p>
    <div class="page-bar">
      <button class="btn btn-primary pay" id="btn-pay" onclick="openPay()">付款</button>
    </div>
  </main>

  <!-- 設定 -->
  <section id="view-settings" class="page sub-page" hidden>
    <div class="page-body">
      <h2 class="page-title">設定</h2>
      <div class="group">
        <button type="button" onclick="openCards()"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>卡片管理</button>
      </div>
      <div class="group">
        <button type="button" onclick="showPage('view-text')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/></svg>首頁文字</button>
        <button type="button" id="install-row" onclick="showInstallGuide()"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8v7M8.5 11.5h7"/></svg>加入主畫面</button>
      </div>
      <div class="group">
        <button type="button" onclick="exportData()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="flex-1">備份<br><span class="muted" id="settings-backup"></span></span><span class="badge" id="settings-due" hidden>該備份了</span></button>
        <label><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 8H4c0-1 2-2 2-8M10 21h4"/></svg><span class="flex-1">備份提醒</span>
          <select id="remind-days" class="remind" onchange="setRemindDays(this.value)">
            <option value="0">不提醒</option><option value="7">每 7 天</option><option value="14">每 14 天</option><option value="30">每 30 天</option>
          </select>
        </label>
        <label><svg class="ic" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></svg>還原
          <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
      <p class="version" id="app-version"></p>
    </div>
    <div class="page-bar"><button class="btn w-full" onclick="showPage(null)">返回首頁</button></div>
  </section>

  <!-- 卡片管理 -->
  <section id="view-cards" class="page sub-page" hidden>
    <div class="cards-head">
      <button type="button" onclick="showPage(cardsFrom)">‹ 返回</button>
      <h2 class="font-bold">卡片管理</h2>
      <span class="w-11"></span>
    </div>
    <div class="tabs">
      <button type="button" id="tab-active" onclick="setCardTab('active')"></button>
      <button type="button" id="tab-used" onclick="setCardTab('used')"></button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list-note">
      <span id="list-summary"></span>
      <span>← 刪除</span>
    </div>
    <div class="card-list" id="card-list"></div>
  </section>

  <!-- 首頁文字 -->
  <section id="view-text" class="page sub-page" hidden>
    <div class="page-body">
      <h2 class="page-title">首頁文字</h2>
      <label>標題<input class="field" maxlength="14" data-text="cv-title"></label>
      <label>金額標籤<input class="field" maxlength="14" data-text="cv-label"></label>
      <p class="muted">清空後會恢復預設文字。</p>
    </div>
    <div class="page-bar"><button class="btn w-full" onclick="showPage('view-settings')">返回</button></div>
  </section>

  <!-- 掃描 -->
  <div id="view-scanner" class="hidden fixed inset-0 z-30 flex flex-col">
    <div class="scan-top">
      <button type="button" class="dark" onclick="closeScanner()">✕ 完成</button>
      <b id="scan-total"></b>
      <button type="button" class="dark scan-drop" id="scan-drop" onclick="askDropSession()">放棄本次</button>
    </div>

    <div class="cam">
      <div id="reader"></div>
      <canvas id="lock-overlay"></canvas>
      <div id="guide-box"><div id="lock-hint"></div></div>
      <div id="lock-fx" hidden>
        <div id="lock-flash"></div>
        <svg id="lock-shutter" viewBox="-50 -50 100 100" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" aria-hidden="true">
          <circle r="44" fill="rgba(0,0,0,.35)"/>
          <path d="M0-44 21-8M38-22 19 14M38 22H-3M0 44-21 8M-38 22-19-14M-38-22H3"/>
        </svg>
      </div>
    </div>

    <div class="zones" aria-hidden="true">
      <span class="z" id="zone-face"><b></b></span>
      <span class="z" id="zone-1"><b></b></span>
      <span class="z" id="zone-2"><b></b></span>
    </div>

    <div class="scanbar">
      <div class="scan-status">
        <span class="dot" id="scan-dot"></span><span class="flex-1" id="scan-status" role="status" aria-atomic="true"></span>
        <button type="button" class="dark" id="scan-reset" onclick="resetPending()" hidden>重掃這張</button>
      </div>
      <div class="latest" id="scan-latest"></div>
    </div>
    <div class="groups" id="scan-groups"></div>
  </div>

  <div class="shade" id="shade" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 解碼用離屏容器：函式庫依容器尺寸縮放圖片 -->
  <div id="decode-area" aria-hidden="true" style="position:fixed;left:-10000px;top:0;width:1600px;height:400px;overflow:hidden"></div>

  <!-- 付款：內容由 JS 產生 -->
  <div id="view-pay" class="payview" hidden></div>

  <script>
    const APP_VERSION = '2026.11.28・8e65406'; // 由 docs/tools/sw_version.py 寫入
    const DB_NAME = '711CardVaultDB';
    const STORE_NAME = 'cards';
    const PAY_STORE = 'payment'; // 未完成的付款，只有一筆 current
    const FACE_VALUES = [35, 50, 100, 200, 500, 1000];
    let db;
    let allCards = [];
    let payment = null;
    let waitingWorker = null; // 已下載、等待套用的新版本
    let cardTab = 'active';
    let cardFace = 0;      // 0＝全部

    const $ = id => document.getElementById(id);

    // 偏好設定存 localStorage；讀寫失敗就用預設值
    function readPref(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function writePref(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 2);
        // 版本 2 只新增 payment，不動既有卡片
        request.onupgradeneeded = (e) => {
          const next = e.target.result;
          for (const name of [STORE_NAME, PAY_STORE]) {
            if (!next.objectStoreNames.contains(name)) next.createObjectStore(name, { keyPath: 'id' });
          }
        };
        request.onblocked = () => alert('請關閉其他開著本 app 的分頁，才能完成更新。');
        request.onsuccess = (e) => {
          db = e.target.result;
          db.onversionchange = () => {
            db.close();
            db = null;
            alert('app 已更新，請重新整理此頁面。');
          };
          loadCards().then(resolve);
        };
        request.onerror = (e) => reject(e);
      });
    }

    function loadCards() {
      return new Promise((resolve) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readonly');
        const cards = tx.objectStore(STORE_NAME).getAll();
        const record = tx.objectStore(PAY_STORE).get('current');
        tx.oncomplete = () => {
          allCards = cards.result.sort((a, b) => b.createdAt - a.createdAt);
          payment = record.result || null;
          render();
          resolve();
        };
      });
    }

    // 改或刪既有卡片：同一個 transaction 內先讀付款紀錄，配到的卡一律不寫
    // （畫面上的 payment 可能已過期，例如另一個分頁剛開始付款）
    function writeCards(ids, action) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readwrite');
        let failure = null;
        const fail = error => { failure = error; tx.abort(); };
        const request = tx.objectStore(PAY_STORE).get('current');
        request.onsuccess = () => {
          if (ids.some(id => lockedBy(request.result, id))) return fail(Object.assign(new Error(LOCKED_HINT), { locked: true }));
          action(tx.objectStore(STORE_NAME), fail);
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => loadCards().then(() => reject(failure || tx.error));
      });
    }

    function removeCards(ids) {
      return writeCards(ids, store => ids.forEach(id => store.delete(id)));
    }

    function removeCard(id) {
      return removeCards([id]);
    }

    // 在同一個 transaction 內重新讀取再修改，避免用畫面上的舊物件覆蓋
    function updateCard(id, mutate) {
      return writeCards([id], (store, fail) => {
        const request = store.get(id);
        request.onsuccess = () => {
          const card = request.result;
          if (!card) return fail(new Error('找不到這張卡'));
          mutate(card);
          store.put(card);
        };
      });
    }

    // 新增前在同一個 transaction 內檢查重複（另一個分頁可能剛建過）
    function addCard(card) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const request = store.getAll();
        request.onsuccess = () => {
          const codes = [card.barcode, card.barcode2].filter(Boolean);
          if (request.result.some(c => codes.includes(c.barcode) || codes.includes(c.barcode2))) {
            failure = new Error('這張卡已經建檔過');
            return tx.abort();
          }
          store.add(card);
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 變更餘額或面額，並追加紀錄。舊卡第一次變動時先留下原值（時間不明）
    function applyChange(card, type, balance, face = card.initialAmount) {
      if (balance !== card.balance || face !== card.initialAmount) {
        const history = Array.isArray(card.history) ? card.history
          : [{ at: null, balance: card.balance, face: card.initialAmount, type: 'before' }];
        card.history = [...history, { at: Date.now(), balance, face, type }];
        card.balance = balance;
        card.initialAmount = face;
      }
      card.status = balance > 0 ? 'active' : 'used';
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && db) loadCards();
    });

    // ===== 頁面切換 =====
    function showPage(id) {
      document.querySelectorAll('.sub-page').forEach(page => page.hidden = page.id !== id);
      $('view-home').hidden = Boolean(id);
      closeSheet();
      if (id === 'view-text') {
        document.querySelectorAll('[data-text]').forEach(input => input.value = textOf(input.dataset.text));
      }
    }

    // ===== 兩段條碼 =====
    const SEGMENT_PATTERNS = { 1: /^\d{16}$/, 2: /^[0-9A-Z]{8}$/ };

    function segmentOf(value) {
      return SEGMENT_PATTERNS[1].test(value) ? 1 : SEGMENT_PATTERNS[2].test(value) ? 2 : 0;
    }

    function isComplete(card) {
      return SEGMENT_PATTERNS[2].test(card.barcode2 || '');
    }

    // ===== 首頁與清單 =====
    function activeCards() {
      return allCards.filter(c => c.status === 'active' && c.balance > 0);
    }

    // 兩段齊全且非待核對才能付款
    function payableCards() {
      return activeCards().filter(c => isComplete(c) && !c.needsCheck);
    }

    // ===== 首頁：季節風景與日期 =====
    const SCENE = {
      spring: { sky: ['#ffe3ec', '#fff6f1'], far: '#cfe3b4', near: '#a9cd8c', sun: '#ffd1a8' },
      summer: { sky: ['#bfe6ff', '#effaff'], far: '#7fcad0', near: '#4aa9bd', sun: '#ffd34d' },
      autumn: { sky: ['#ffdcae', '#fff3de'], far: '#e3a35c', near: '#c2703a', sun: '#f7934c' },
      winter: { sky: ['#cfdcf0', '#f1f6fc'], far: '#dbe5f3', near: '#ffffff', sun: '#fff4d6' }
    };

    function seasonArt(season) {
      const many = (list, draw) => list.map(draw).join('');
      const flower = (x, y, r) => `<g transform="translate(${x} ${y})">${many([0, 72, 144, 216, 288], a => `<ellipse cy="${-r}" rx="${r * .62}" ry="${r}" fill="#ff9fbc" transform="rotate(${a})"/>`)}<circle r="${r * .45}" fill="#ffe27a"/></g>`;
      const leaf = (x, y, s, a, c) => `<path transform="translate(${x} ${y}) rotate(${a}) scale(${s})" fill="${c}" d="M0-10 3-4 9-6 7 0 11 3 4 4 5 9 1 7 0 13-1 7-5 9-4 4-11 3-7 0-9-6-3-4Z"/>`;
      const pine = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path fill="#5d7f8e" d="M0-34 12-14H6L16 2H8L18 18H-18L-8 2H-16L-6-14H-12Z"/><path fill="#fff" d="M0-34 7-22 2-24-2-20-7-22Z"/><rect x="-2" y="18" width="4" height="7" fill="#6b5646"/></g>`;
      const decor = {
        spring: () => `<g class="decor-top"><path d="M368 18C320 30 296 56 262 62M318 40C310 58 296 74 292 92" stroke="#8a5a4a" stroke-width="4" fill="none" stroke-linecap="round"/>${many([[266, 62, 8], [296, 52, 10], [330, 34, 9], [292, 92, 8], [308, 72, 6], [348, 56, 7]], p => flower(...p))}
          <g class="fall" fill="#ffb3c9">${many([[220, 80], [250, 130], [320, 120], [190, 40], [338, 160]], ([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="2.6" transform="rotate(30 ${x} ${y})"/>`)}</g></g>`,
        summer: () => `<g fill="#fff"><path class="decor-sun" d="M226 112a14 14 0 0 1 22-14a18 18 0 0 1 34 2a13 13 0 0 1 14 12z"/><path opacity=".8" d="M150 74a9 9 0 0 1 14-8a12 12 0 0 1 22 2a8 8 0 0 1 8 6z"/></g>
          <path d="M270 190l26-34v34z" fill="#fff"/><path d="M299 190v-30l18 30z" fill="#ff8a6b"/><path d="M262 192h62l-10 10h-42z" fill="#7a5236"/>`,
        autumn: () => `<g class="fall">${many([[312, 100, 1.4, 20, '#d9542b'], [254, 108, 1, -35, '#e98a24'], [336, 126, 1.1, 60, '#c23c28'], [220, 52, .8, 10, '#e6a82a'], [316, 164, .7, -20, '#d9542b'], [266, 148, .6, 45, '#e98a24']], p => leaf(...p))}</g>`,
        winter: () => `${pine(300, 170, 1.2)}${pine(334, 182, .9)}${pine(268, 188, .7)}
          <g class="fall" fill="#fff">${many([[40, 70, 3], [96, 40, 2], [172, 96, 3], [214, 50, 2.4], [250, 112, 3], [288, 78, 2], [340, 104, 3], [140, 150, 2], [62, 168, 2.6], [228, 160, 2]], ([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" stroke="#b9cbe6" stroke-width=".6"/>`)}</g>`
      };
      const s = SCENE[season];
      return `<svg viewBox="-30 0 390 232" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
        <defs><linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${s.sky[0]}"/><stop offset="1" stop-color="${s.sky[1]}"/></linearGradient></defs>
        <rect x="-30" width="390" height="254" fill="url(#hero-sky)"/>
        <circle class="${season === 'autumn' ? '' : 'decor-sun'}" cx="256" cy="${season === 'autumn' ? 150 : 86}" r="22" fill="${s.sun}" opacity=".85"/>
        <path d="M-30 176Q-14 192 0 186Q60 156 130 180T260 172T360 166V232H-30Z" fill="${s.far}"/>
        <path d="M-30 206L0 204Q90 180 180 202T360 194V232H-30Z" fill="${s.near}"/>
        ${decor[season]()}</svg>`;
    }

    const seasonOf = month => month >= 3 && month <= 5 ? 'spring' : month >= 6 && month <= 8 ? 'summer' : month >= 9 && month <= 11 ? 'autumn' : 'winter';

    // 西曆、農曆；節氣與節日只在當天出現。季節依月份切換
    function renderToday() {
      const now = new Date();
      const info = Almanac.describe(now);
      const season = seasonOf(now.getMonth() + 1);
      if ($('view-home').dataset.season !== season) {
        $('view-home').dataset.season = season;
        $('hero-bg').innerHTML = seasonArt(season);
      }
      $('date-solar').textContent = info.solar;
      $('date-lunar').textContent = [info.lunar, ...info.today].filter(Boolean).join('・');
      showQuote(); // 跨日後回到 app 時一併換句
    }

    function render() {
      renderHome();
      renderCardList();
    }

    function renderHome() {
      const cards = payableCards();
      const sumOf = list => list.reduce((sum, c) => sum + Number(c.balance), 0);
      renderToday();
      $('total-balance').textContent = `$${sumOf(cards).toLocaleString()}`;
      $('btn-pay').disabled = cards.length === 0 && !payment;
      $('btn-pay').textContent = payment ? '繼續付款' : '付款';
      $('home-pending').hidden = !payment;
      $('home-update').hidden = !waitingWorker || Boolean(payment); // 付款中不提示換版
      const toCheck = activeCards().filter(c => c.needsCheck).length;
      $('home-check').hidden = toCheck === 0;
      $('home-check').textContent = `${toCheck} 張待核對，未計入`;
      renderHomeEmpty(cards.length);
      renderDenominations(cards);
      renderRecent();
      renderBackup();
    }

    // 兩則以上提示時少顯示一筆消費
    function renderHints() {
      const count = ['home-update', 'home-pending', 'home-check'].filter(id => !$(id).hidden).length;
      $('view-home').classList.toggle('hints2', count > 1);
    }

    // 沒有可付款的卡時，依原因給不同引導
    function renderHomeEmpty(payableCount) {
      const box = $('home-empty');
      box.hidden = payableCount > 0;
      // 第三種狀態本身已說明原因，不再重複提示
      $('pay-hint').hidden = Boolean(payment) || payableCount > 0 || (allCards.length > 0 && activeCards().length > 0);
      if (payableCount > 0) return box.replaceChildren();

      const title = document.createElement('p');
      const button = (text, className, onClick) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = className;
        btn.textContent = text;
        btn.onclick = onClick;
        return btn;
      };
      if (allCards.length === 0) {
        title.textContent = '尚未加入商品卡';
        box.replaceChildren(title, button('新增第一張卡', 'btn btn-primary', openScanner));
      } else if (activeCards().length === 0) {
        title.textContent = '卡片已用完';
        box.replaceChildren(title, button('新增卡片', 'btn btn-primary', openScanner),
          button('查看已用完卡片', 'link', () => openCards('used')));
      } else {
        title.textContent = '目前沒有可付款的卡片';
        box.replaceChildren(title, button('前往卡片管理', 'btn', () => openCards()));
      }
    }

    // 扇形手牌：固定五種面額，1000 只在有可付款的卡時出現。部分使用的卡仍算在原面額
    let fanData = [];

    function renderDenominations(payable) {
      const of = (list, value) => list.filter(c => Number(c.initialAmount) === value);
      fanData = FACE_VALUES.filter(value => value !== 1000 || of(payable, value).length > 0).map(value => {
        const usable = of(payable, value);
        return { value, count: usable.length,
          state: usable.length ? '' : of(allCards, value).length ? 'spent' : 'none' };
      });
      const box = $('denominations');
      const key = fanData.map(f => f.value).join();
      if (box.dataset.faces !== key) {
        box.dataset.faces = key;
        box.innerHTML = fanData.map(f => `<button type="button" data-value="${f.value}"><img src="cards/card-${f.value}.svg" alt="" draggable="false"><span class="outlined">${f.value}</span></button>`).join('');
        box.querySelectorAll('button').forEach(btn => btn.onclick = () => openFace(Number(btn.dataset.value)));
      }
      drawFan();
      renderHints();
    }

    // 間距依寬度與張數縮小，兩端旋轉後仍留在畫面內
    function drawFan() {
      const middle = (fanData.length - 1) / 2;
      const width = $('denominations').clientWidth || Math.min(window.innerWidth, 448); // 首頁隱藏時量不到
      const step = Math.min(56, (width - 132) / (fanData.length - 1));
      $('denominations').querySelectorAll('button').forEach((node, i) => {
        const f = fanData[i], o = i - middle;
        const label = f.count ? `${f.count} 張可用` : f.state === 'spent' ? '沒有可用的卡' : '沒有卡';
        node.className = `f${f.value} ${f.state}`;
        node.setAttribute('aria-label', `面額 ${f.value}，${label}`);
        node.style.zIndex = i + 1;
        node.style.transform = `translate(${o * step}px, ${o * o * 3}px) rotate(${o * 6}deg)`;
      });
    }
    window.addEventListener('resize', drawFan);

    // 開卡片管理並篩該面額：有未用完的卡進「未用完」，否則「已用完」；沒有卡不動作
    function openFace(value) {
      const list = allCards.filter(c => Number(c.initialAmount) === value);
      if (!list.length) return;
      openCards(list.some(c => !isUsed(c)) ? 'active' : 'used');
      setCardFace(value);
    }

    // 由各卡的付款紀錄推得；同一次付款寫入時間相近，合併成一筆。只含商品卡扣款
    function recentSpending() {
      const entries = [];
      for (const card of allCards) {
        const history = Array.isArray(card.history) ? card.history : [];
        history.forEach((h, i) => {
          if (h.type !== 'pay' || !i) return;
          const amount = history[i - 1].balance - h.balance;
          if (amount > 0) entries.push({ at: h.at, amount });
        });
      }
      const groups = [];
      for (const entry of entries.sort((a, b) => b.at - a.at)) {
        const last = groups[groups.length - 1];
        if (last && last.from - entry.at <= 2000) {
          last.amount += entry.amount;
          last.count++;
          last.from = entry.at;
        } else {
          groups.push({ at: entry.at, from: entry.at, amount: entry.amount, count: 1 });
        }
      }
      return groups.slice(0, 3);
    }

    function renderRecent() {
      $('recent').hidden = allCards.length === 0;
      const two = n => String(n).padStart(2, '0');
      $('recent-list').innerHTML = recentSpending().map(g => {
        const at = new Date(g.at);
        return `<li><time>${two(at.getMonth() + 1)}/${two(at.getDate())} ${two(at.getHours())}:${two(at.getMinutes())}</time><b>−${escapeHTML(money(g.amount))}</b><i>${g.count} 張</i></li>`;
      }).join('') || '<li class="empty">尚無消費</li>';
    }

    // 卡片欄位來自掃描或匯入檔，寫入 innerHTML 前一律跳脫
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    const money = value => `$${Number(value).toLocaleString()}`;
    const faceClass = value => FACE_VALUES.includes(Number(value)) ? `f${Number(value)}` : 'fx';
    const fullNo = no => String(no).replace(/(.{4})(?=.)/g, '$1 ');
    const maskedNo = no => {
      const text = String(no);
      return text.length === 16 ? `**** **** ${text.slice(8, 12)} ${text.slice(12)}` : `**** ${text.slice(-4)}`;
    };
    const findCard = id => allCards.find(c => c.id === id);
    const lockedBy = (record, id) => Boolean(record?.items.some(i => i.cardId === id));
    const isLocked = id => lockedBy(payment, id);
    const LOCKED_HINT = '這張卡在未完成的付款中，請先完成或放棄付款';
    // 寫入被付款鎖定擋下時關閉面板並說明原因
    function writeFailed(error, message) {
      if (!error?.locked) return toast(message);
      closeSheet();
      toast(LOCKED_HINT);
    }
    const isUsed = card => !(card.status === 'active' && card.balance > 0);

    function faceImage(value) {
      return FACE_VALUES.includes(Number(value)) ? `<img src="cards/card-${Number(value)}.svg" alt="">` : '';
    }

    // 清單與查看面板用的橫式小卡
    function wideThumb(face) {
      const art = FACE_VALUES.includes(Number(face)) ? `<img src="cards/card-${Number(face)}-wide.svg" alt="">` : '';
      return `<span class="wthumb ${faceClass(face)}">${art}<i class="outlined">${escapeHTML(face)}</i></span>`;
    }

    const moneyText = value => `<b class="money">${escapeHTML(money(value))}</b>`;
    // 清單、查看、編輯、刪除確認共用的卡片列；右側按鈕由呼叫端接在後面
    function cardLine(card, number, extra = '') {
      return `${wideThumb(card.initialAmount)}<div class="who"><div class="wmid"><div class="num">${escapeHTML(number)}</div>${extra}</div>
        <span class="money-col">${moneyText(card.balance)}</span></div>`;
    }

    function miniCard(value, label = true) {
      return `<span class="mini">${faceImage(value)}${label ? `<i>${escapeHTML(value)}</i>` : ''}</span>`;
    }

    // 進入卡片管理：回到遮蔽與全部面額
    let cardsFrom = null; // 返回鈕回到進來的那一頁（首頁或設定）
    function openCards(tab = 'active') {
      cardsFrom = $('view-settings').hidden ? null : 'view-settings';
      showPage('view-cards');
      cardTab = tab;
      cardFace = 0;
      renderCardList();
    }

    function setCardTab(tab) {
      cardTab = tab;
      renderCardList();
    }

    function setCardFace(value) {
      cardFace = value;
      renderCardList();
    }

    function renderCardList() {
      const inTab = tab => allCards.filter(c => isUsed(c) === (tab === 'used'));
      const pool = inTab(cardTab);
      for (const [tab, label] of [['active', '未用完'], ['used', '已用完']]) {
        $(`tab-${tab}`).textContent = `${label} ${inTab(tab).length}`;
        $(`tab-${tab}`).setAttribute('aria-pressed', tab === cardTab);
      }

      const shown = FACE_VALUES.filter(v => v !== 1000 || pool.some(c => Number(c.initialAmount) === v));
      if (cardFace && !shown.includes(cardFace)) cardFace = 0;
      $('filters').innerHTML = [0, ...shown].map(value => {
        const count = pool.filter(c => !value || Number(c.initialAmount) === value).length;
        return `<button type="button" class="filter ${value && !count ? 'none' : ''}" data-face="${value}" aria-pressed="${cardFace === value}" aria-label="${value ? `面額 ${value}` : '全部'}，${count} 張">
          <span class="${value ? `mini ${faceClass(value)}` : 'all'}">${value ? `${faceImage(value)}<i class="outlined">${value}</i>` : '全部'}<span class="band">×${count}</span></span></button>`;
      }).join('');
      $('filters').querySelectorAll('button').forEach(btn => btn.onclick = () => setCardFace(Number(btn.dataset.face)));

      const rows = pool.filter(c => !cardFace || Number(c.initialAmount) === cardFace)
        .sort((a, b) => a.initialAmount - b.initialAmount || a.createdAt - b.createdAt);
      const payableSum = rows.filter(c => isComplete(c) && !c.needsCheck && !isUsed(c)).reduce((sum, c) => sum + Number(c.balance), 0);
      $('list-summary').textContent = `${rows.length} 張・可付款 ${money(payableSum)}`;

      $('card-list').innerHTML = rows.map(card => `
        <div class="item ${faceClass(card.initialAmount)} ${isUsed(card) ? 'used' : ''}">
          <button type="button" class="del" data-del="${escapeHTML(card.id)}">刪除</button>
          <div class="face" data-id="${escapeHTML(card.id)}" role="button" tabindex="0" aria-label="查看卡片">
            ${cardLine(card, maskedNo(card.barcode),
              `${card.needsCheck ? '<span class="badge">待核對</span>' : ''}
               ${isLocked(card.id) ? '<span class="badge">付款中</span>' : ''}
               ${isComplete(card) ? '' : '<div class="text-xs" style="color:var(--danger)">缺第②段，請刪除後重掃</div>'}`)}
            <button type="button" class="pen" data-edit="${escapeHTML(card.id)}" aria-label="改餘額">✎</button>
          </div>
        </div>`).join('') || `<p class="muted text-center py-10">沒有符合的卡片</p>`;
      bindCardRows();
    }

    // 左滑：露出刪除；點一下：查看卡片
    function bindCardRows() {
      const list = $('card-list');
      let openRow = null;
      const move = (el, x) => el.style.transform = `translateX(${x}px)`;

      list.querySelectorAll('.face').forEach(el => {
        let start = null, dx = 0, axis = '', base = 0;
        el.onpointerdown = e => {
          if (e.target.closest('button')) return;
          if (e.clientX < 24 || window.innerWidth - e.clientX < 24) return; // 讓出邊緣返回手勢
          start = { x: e.clientX, y: e.clientY };
          dx = 0; axis = ''; base = openRow === el ? -80 : 0;
        };
        el.onpointermove = e => {
          if (!start) return;
          const mx = e.clientX - start.x, my = e.clientY - start.y;
          if (!axis && Math.hypot(mx, my) > 12) {
            axis = Math.abs(mx) > Math.abs(my) * 1.5 ? 'x' : 'y';
            if (axis === 'x') el.setPointerCapture(e.pointerId);
          }
          if (axis !== 'x') return;
          dx = Math.max(-80, Math.min(0, base + mx));
          el.style.transition = 'none';
          move(el, dx);
        };
        el.onpointerup = () => {
          if (!start) return;
          start = null;
          el.style.transition = '';
          if (axis === 'x') {
            if (openRow && openRow !== el) move(openRow, 0);
            openRow = dx < -40 ? el : null;
            move(el, openRow ? -80 : 0);
          } else if (!axis) {
            if (openRow) { move(openRow, 0); openRow = null; }
            else viewPhoto(el.dataset.id);
          }
        };
        el.onpointercancel = () => {
          start = null;
          el.style.transition = '';
          move(el, openRow === el ? -80 : 0);
        };
        el.onkeydown = e => { if (e.key === 'Enter' && e.target === el) viewPhoto(el.dataset.id); };
      });
      list.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => editBalance(btn.dataset.edit));
      list.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => askDelete(btn.dataset.del));
    }

    // ----- 底部面板 -----
    let sheetOpenedAt = 0;
    let toastTimer;

    let sheetDismiss = null;

    function openSheet(html, onDismiss = null) {
      sheetDismiss = onDismiss;
      // 右上角 ✕ 固定可見（底部按鈕可能被瀏覽器網址列擋住），作用同點背景
      $('sheet').innerHTML = '<button type="button" class="sheet-x" aria-label="關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' + html;
      $('sheet').querySelector('.sheet-x').onclick = () => (sheetDismiss || closeSheet)();
      $('sheet').scrollTop = 0;
      $('shade').hidden = false;
      sheetOpenedAt = Date.now();
    }

    function closeSheet() {
      $('shade').hidden = true;
      $('sheet').replaceChildren();
    }

    // 剛開啟的瞬間不接受點背景，避免同一次觸控把面板關掉
    $('shade').onclick = e => {
      if (e.target === $('shade') && Date.now() - sheetOpenedAt > 350) (sheetDismiss || closeSheet)();
    };

    function sheetButton(action, handler) {
      $('sheet').querySelector(`[data-act="${action}"]`).onclick = handler;
    }

    function toast(text) {
      $('toast').textContent = text;
      $('toast').hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').hidden = true, 2200);
    }

    // 純查看：完整卡號、卡背原圖、餘額紀錄
    function viewPhoto(id) {
      const card = findCard(id);
      if (!card) return;
      const hasImage = String(card.cropImage || '').startsWith('data:image/');
      const history = Array.isArray(card.history) ? card.history : [];
      const rows = history.map((h, i) => {
        const faceChanged = i > 0 && h.face !== history[i - 1].face;
        const note = [h.type === 'create' ? '建檔' : '', faceChanged ? `面額改為 $${h.face}` : ''].filter(Boolean).join('，');
        return `<div class="histrow"><span class="muted">${h.at ? escapeHTML(new Date(h.at).toLocaleDateString('zh-TW')) : '改版前'}</span>
          ${moneyText(h.balance)}<span class="muted">${escapeHTML(note)}</span></div>`;
      }).reverse().join('');
      openSheet(`<div class="view-head">${cardLine(card, fullNo(card.barcode))}</div>
        ${hasImage ? '<img class="photo" alt="卡背原圖">' : '<p class="muted text-center py-10">沒有原圖</p>'}
        <b>餘額紀錄</b>
        <div>${rows || `<p class="muted py-4">目前 ${escapeHTML(money(card.balance))}。尚無紀錄，之後的變動才會記下。</p>`}</div>`);
      if (hasImage) $('sheet').querySelector('.photo').src = card.cropImage;
    }

    // 紀錄裡曾經低於面額就視為用過，避免改面額把餘額加回來
    function balanceAfterFace(card, face) {
      const unused = card.balance === card.initialAmount && (card.history || []).every(h => h.balance === h.face);
      return unused ? face : Math.min(card.balance, face);
    }

    function changeFace(id, face) {
      updateCard(id, card => applyChange(card, 'face', balanceAfterFace(card, face), face))
        .then(() => { closeSheet(); toast(`面額已改為 $${face}`); })
        .catch(e => writeFailed(e, '儲存失敗，請再試一次'));
    }

    // 編輯面板：預設改餘額（app 內數字鍵盤），另一頁改面額
    function editBalance(id) {
      const card = findCard(id);
      if (!card) return;
      if (isLocked(id)) return toast(LOCKED_HINT);
      const face = Number(card.initialAmount);
      let tab = 'balance', value = String(card.balance), fresh = true, picked = face;
      openSheet(`<div class="view-head"></div>
        <div class="edit-tabs"><button type="button" data-tab="balance">改餘額</button><button type="button" data-tab="face">改面額</button></div>
        <div id="edit-body"></div>`);
      const sheet = $('sheet'), head = sheet.querySelector('.view-head'), body = sheet.querySelector('#edit-body');
      const valid = () => /^\d+$/.test(value) && Number(value) <= face;
      const draw = (error = '') => {
        // 選了別的面額時，頂部列預覽儲存後的樣子
        const preview = tab === 'face' && picked !== face;
        head.innerHTML = cardLine(preview ? { ...card, initialAmount: picked, balance: balanceAfterFace(card, picked) } : card, fullNo(card.barcode));
        head.classList.toggle('preview', preview);
        sheet.querySelectorAll('[data-tab]').forEach(btn => btn.setAttribute('aria-pressed', btn.dataset.tab === tab));
        if (tab === 'face') {
          body.innerHTML = `<div class="faces">${FACE_VALUES.map(v => `<button type="button" class="${faceClass(v)}" data-value="${v}" aria-pressed="${v === picked}" aria-label="面額 ${v}">${faceImage(v)}<i class="outlined">${v}</i></button>`).join('')}</div>
            <button type="button" class="btn btn-primary w-full" data-act="save" ${picked === face ? 'disabled' : ''}>儲存</button>`;
          body.querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => { picked = Number(btn.dataset.value); draw(); });
          return sheetButton('save', () => changeFace(id, picked));
        }
        body.innerHTML = `<div class="edit-value">$${escapeHTML(value)}</div>
          <p class="edit-note" role="alert">${escapeHTML(error)}</p>
          ${keypad()}
          <div class="row"><button type="button" class="btn flex-1" data-act="zero">用完</button><button type="button" class="btn btn-primary flex-1" data-act="save">儲存</button></div>`;
        const hint = `請輸入 0 到 ${face}`;
        body.querySelectorAll('[data-key]').forEach(btn => btn.onclick = () => {
          const key = btn.dataset.key;
          value = key === '清除' ? '' : key === '⌫' ? value.slice(0, -1) : ((fresh ? '' : value) + key).replace(/^0+(?=\d)/, '').slice(0, 4);
          fresh = false;
          draw(value !== '' && !valid() ? hint : '');
        });
        sheetButton('zero', () => { value = '0'; fresh = false; draw(); });
        sheetButton('save', () => {
          if (!valid()) return draw(hint);
          const next = Number(value);
          updateCard(id, c => {
            applyChange(c, 'edit', next);
            delete c.needsCheck; // 確認過實際餘額即解除待核對
          }).then(() => { closeSheet(); toast(next ? '已更新餘額' : '已移到「已用完」'); })
            .catch(e => writeFailed(e, '儲存失敗，請再試一次'));
        });
      };
      sheet.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = () => { tab = btn.dataset.tab; draw(); });
      draw();
      body.style.height = `${body.offsetHeight}px`; // 兩頁同高，切換不跳動
    }

    function askDelete(id) {
      const card = findCard(id);
      if (!card) return;
      if (isLocked(id)) { renderCardList(); return toast(LOCKED_HINT); }
      const cancel = () => { closeSheet(); renderCardList(); };
      openSheet(`<b>刪除這張卡？</b><div class="line">${cardLine(card, fullNo(card.barcode))}</div>
        <p class="muted">餘額紀錄會一起刪除，無法復原。</p>
        <button type="button" class="btn btn-fill-danger" data-act="delete">刪除</button>`, cancel);
      sheetButton('delete', () => {
        removeCard(id).then(() => { closeSheet(); toast('已刪除'); })
          .catch(e => writeFailed(e, '刪除失敗，請再試一次'));
      });
    }

    // ===== 首頁文字 =====
    function textOf(key) {
      const el = document.querySelector(`[data-key="${key}"]`);
      return readPref(key) || el.dataset.default;
    }

    function setText(key, value) {
      const text = value.trim().slice(0, 14);
      writePref(key, text);
      const el = document.querySelector(`[data-key="${key}"]`);
      el.textContent = text || el.dataset.default;
    }

    document.querySelectorAll('[data-key]').forEach(el => el.textContent = textOf(el.dataset.key));
    $('app-version').textContent = APP_VERSION ? `版本 ${APP_VERSION}` : '';
    document.querySelectorAll('[data-text]').forEach(input => {
      input.addEventListener('input', () => setText(input.dataset.text, input.value));
    });

    // ===== 心情小語 =====
    // 句子資料在 quotes.js
    let quoteDay = null, quoteTaps = 0;

    // 平日：通用兩句、當季一句穿插，每天換一句。節日（優先）或節氣當天先顯示專屬句，點一下回到平日句子
    function quoteFor(date, taps) {
      const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
      const special = FESTIVAL_QUOTES[Almanac.festivals(y, m, d)[0]] || TERM_QUOTES[Almanac.solarTerm(y, m, d)];
      if (special && taps === 0) return special;
      const season = QUOTES[seasonOf(m)];
      const pool = season.flatMap((line, i) => [QUOTES.common[i * 2], QUOTES.common[i * 2 + 1], line]);
      const day = Date.UTC(y, m - 1, d) / 86400000;
      return pool[(day + taps - (special ? 1 : 0)) % pool.length];
    }

    function showQuote() {
      const now = new Date(), today = now.toDateString();
      if (today !== quoteDay) [quoteDay, quoteTaps] = [today, 0];
      $('quote').textContent = quoteFor(now, quoteTaps);
    }

    function nextQuote() {
      showQuote(); // 跨日時先歸零
      quoteTaps++;
      showQuote();
    }

    // ===== 備份提醒（僅開啟 app 時檢查） =====
    function remindDays() {
      return Number(readPref('cv-remind') ?? 14);
    }

    // 備份提醒：該備份時齒輪顯示紅點，設定頁「備份」列註明
    function renderBackup() {
      const last = Number(readPref('cv-last-backup')) || 0;
      const days = Math.floor((Date.now() - last) / 86400000);
      const period = remindDays();
      const due = period > 0 && allCards.length > 0 && (!last || days >= period);
      $('btn-settings').classList.toggle('due', due);
      $('btn-settings').setAttribute('aria-label', due ? '設定（該備份了）' : '設定');
      $('settings-backup').textContent = `上次：${!last ? '尚未備份' : days === 0 ? '今天' : `${days} 天前`}`;
      $('settings-due').hidden = !due;
      $('remind-days').value = String(period);
    }

    function setRemindDays(value) {
      writePref('cv-remind', value);
      renderBackup();
    }

    function newCard(barcode, face, balance, cropImage) {
      const createdAt = Date.now();
      return {
        id: crypto.randomUUID(),
        barcode,
        initialAmount: face,
        balance,
        status: 'active',
        cropImage,
        createdAt,
        history: [{ at: createdAt, balance, face, type: 'create' }]
      };
    }

    // ===== 掃描：兩段齊全才儲存 =====
    const READS_REQUIRED = 3; // 同一段連續讀到相同內容才採用
    const SWAP_READS = 2;     // 已讀到的段落連續讀到不同內容幾次，視為換卡
    let camera = null;  // { stream, video, timer }
    let cameraRequest = 0;
    let decoder = null;
    let pending;       // 目前這張卡已讀到的段落
    let streaks;
    let justSaved = []; // 剛存檔或剛刪除的卡還在鏡頭前，不重複處理
    let holdLeft = 0;   // 剛存檔或剛刪除的卡：連續這麼久沒讀到才解除抑制
    let holdMs = 0;
    let statusLeft = 0; // 結果訊息剩餘顯示時間
    let fadeLeft = 0;
    let scanTicker = 0;
    const SCAN_HINT = '整張卡背放進框內';
    const RESULT_MS = 5000, FADE_MS = 1000, SAVED_HOLD_MS = 2000, DELETED_HOLD_MS = 4000, TICK_MS = 200;
    const DELETED_HINT = '已刪除，要重掃請先拿開卡片';
    let savingScan = false;
    let faceVotes = new Map(); // 目前這張卡各次判讀結果
    let session = [];  // 本次掃描建的卡 { id, face, barcode, codes }，最新在前
    const TRASH = '<svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>';
    const tail8 = barcode => `${String(barcode).slice(-8, -4)} ${String(barcode).slice(-4)}`;
    const SCAN_COLORS = { wait: '#60a5fa', ok: '#4ade80', warn: '#fbbf24' };

    function emptyPending() {
      // confirm：兩段都讀到後，要再讀到一次的那一段（確認同一張卡）
      return { 1: null, 2: null, image: null, fallback: null, confirm: 0 };
    }

    // buzz：需要使用者處理的警示才震動；result：事情已結束的訊息，停一段時間後淡出
    function setScanStatus(text, state = 'wait', buzz = false, result = false) {
      const el = $('scan-status');
      if (el.textContent !== text) {
        if (buzz && navigator.vibrate) navigator.vibrate([100, 50, 100]);
        el.textContent = text;
      }
      el.style.color = state === 'warn' ? SCAN_COLORS.warn : text === SCAN_HINT ? '#9ca3af' : '';
      $('scan-dot').style.background = SCAN_COLORS[state];
      el.parentElement.classList.remove('fading');
      statusLeft = result ? RESULT_MS : 0;
      fadeLeft = 0;
    }

    // 面板開著時暫停所有倒數
    function tickScan() {
      if (!$('shade').hidden) return;
      if (holdLeft > 0 && (holdLeft -= TICK_MS) <= 0) justSaved = [];
      if (statusLeft > 0) {
        statusLeft -= TICK_MS;
        if (statusLeft <= 0) {
          fadeLeft = matchMedia('(prefers-reduced-motion: reduce)').matches ? TICK_MS : FADE_MS;
          $('scan-status').parentElement.classList.add('fading');
          if (!pending[1] && !pending[2]) ['face', 1, 2].forEach(key => setZone(key));
        }
      } else if (fadeLeft > 0 && (fadeLeft -= TICK_MS) <= 0) {
        updateScanUI(); // 換回目前狀態的提示
      }
    }

    // key：face、1、2
    function setZone(key, state = '') {
      const el = $(`zone-${key}`);
      el.classList.remove('ok', 'warn');
      if (state) el.classList.add(state);
      const name = key === 'face' ? '面額' : key === 1 ? '①' : '②';
      el.firstElementChild.textContent = name + (state === 'ok' ? ' ✓' : state === 'warn' ? ' ！' : '');
    }

    function updateScanUI() {
      setZone(1, pending[1] ? 'ok' : '');
      setZone(2, pending[2] ? 'ok' : '');
      setZone('face', (pending[1] || pending[2]) && confirmedFaceValue() ? 'ok' : '');
      $('scan-reset').hidden = !pending[1] && !pending[2];
      if (pending[1] && !pending[2]) setScanStatus('尚缺 ②，請勿換卡', 'warn');
      else if (pending[2] && !pending[1]) setScanStatus('尚缺 ①，請勿換卡', 'warn');
      else setScanStatus(SCAN_HINT);
    }

    function resetPending() {
      pending = emptyPending();
      faceVotes = new Map();
      savingScan = false;
      lock = emptyLock();
      streaks = { 1: { value: '', count: 0 }, 2: { value: '', count: 0 } };
      updateScanUI();
    }

    function openScanner() {
      session = [];
      justSaved = [];
      holdLeft = 0;
      reads = [];
      clearInterval(scanTicker);
      scanTicker = setInterval(tickScan, TICK_MS);
      $('view-scanner').classList.remove('hidden');
      resetPending();
      renderSession();
      startCamera();
    }

    // 不用函式庫內建的相機迴圈：它以顯示尺寸解碼，解析度不足。
    // 改以相機原始解析度裁出紅線附近的長條，再交給同一函式庫解碼。
    async function startCamera() {
      const request = ++cameraRequest;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }
        });
        if (request !== cameraRequest) return stream.getTracks().forEach(t => t.stop()); // 開啟途中已關閉
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.srcObject = stream;
        $('reader').replaceChildren(video);
        camera = { stream, video, timer: 0, lockTimer: 0, fxTimer: 0 };
        await video.play();
        decodeLoop(request);
        lockLoop(request);
      } catch (err) {
        if (request === cameraRequest) alert("無法啟動相機，請確認網址為 HTTPS 並允許相機權限：\n" + err);
      }
    }

    function stopCamera() {
      cameraRequest++;
      if (!camera) return;
      clearTimeout(camera.timer);
      clearTimeout(camera.lockTimer);
      clearTimeout(camera.fxTimer);
      clearLockView();
      camera.stream.getTracks().forEach(t => t.stop());
      camera = null;
      $('reader').replaceChildren();
    }

    function closeScanner() {
      clearInterval(scanTicker);
      closeSheet();
      stopCamera();
      $('view-scanner').classList.add('hidden');
    }

    // 將畫面上的元素位置換算成影像座標（video 以 object-fit: cover 顯示）
    function toVideoRect(video, element) {
      const view = video.getBoundingClientRect();
      const box = element.getBoundingClientRect();
      const scale = Math.max(view.width / video.videoWidth, view.height / video.videoHeight);
      const offsetX = (view.width - video.videoWidth * scale) / 2;
      const offsetY = (view.height - video.videoHeight * scale) / 2;
      return {
        x: (box.left - view.left - offsetX) / scale,
        y: (box.top - view.top - offsetY) / scale,
        w: box.width / scale,
        h: box.height / scale
      };
    }

    // 依序嘗試的橫向範圍（相對取景框）：新版紙卡條碼靠左、右側有 QR Code；舊版置中。
    // average：沿條碼方向取平均，消除紙卡印刷網點（不依賴 canvas filter）。
    const SCAN_VARIANTS = [
      { from: 0.02, to: 0.64, average: true },
      { from: 0.02, to: 0.64, average: false },
      { from: 0.09, to: 0.91, average: false },
      { from: 0.13, to: 0.87, average: true },
      { from: 0.18, to: 0.82, average: true },  // 銀漆灰底：只取灰底內側
      { from: 0, to: 1, average: false },
      { from: 0.02, to: 0.64, average: true, height: 0.035 } // 手持歪斜時用較薄的長條
    ];

    function averageColumns(ctx, width, height, margin) {
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      const columns = new Array(width);
      for (let x = 0; x < width; x++) {
        let sum = 0;
        for (let y = 0; y < height; y++) {
          const i = (y * width + x) * 4;
          sum += data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
        }
        columns[x] = sum / height;
      }
      // 拉開明暗（灰底時提高對比），兩側補白邊不列入
      let min = 255;
      let max = 0;
      for (let x = margin; x < width - margin; x++) {
        min = Math.min(min, columns[x]);
        max = Math.max(max, columns[x]);
      }
      for (let x = 0; x < width; x++) {
        const gray = x < margin || x >= width - margin ? 255 : (columns[x] - min) * 255 / Math.max(1, max - min);
        for (let y = 0; y < height; y++) {
          const i = (y * width + x) * 4;
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    // at：長條中心在取景框內的高度比例
    async function decodeBand(video, at) {
      const box = toVideoRect(video, $('guide-box'));
      const margin = 30; // 左右補白邊，作為靜音區
      const canvas = document.createElement('canvas');
      for (const variant of SCAN_VARIANTS) {
        const bandHeight = box.h * (variant.height || 0.07);
        const width = box.w * (variant.to - variant.from);
        const outWidth = Math.max(800, Math.round(width));
        canvas.width = outWidth + margin * 2;
        canvas.height = Math.round(bandHeight * outWidth / width);
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, box.x + box.w * variant.from, box.y + box.h * at - bandHeight / 2, width, bandHeight, margin, 0, outWidth, canvas.height);
        if (variant.average) averageColumns(ctx, canvas.width, canvas.height, margin);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        try {
          const result = await decoder.scanFileV2(new File([blob], 'band.png', { type: 'image/png' }), false);
          return result.decodedText;
        } catch (e) {
        } finally {
          decoder.clear();
        }
      }
      return null;
    }

    const LINE_AT = { 1: 0.60, 2: 0.85 };
    const OFFSETS = [-0.05, 0.05, -0.1, 0.1];
    let offsetTurn = 0;

    // 尚未讀到的段落：先讀導引線本身，再輪流試上下偏移。
    // 已讀到的段落也持續讀，內容一變代表換了卡。
    function scanPositions() {
      const offset = OFFSETS[offsetTurn++ % OFFSETS.length];
      if (pending.confirm) return [LINE_AT[pending.confirm], LINE_AT[pending.confirm] + offset];
      const missing = [1, 2].filter(seg => !pending[seg]);
      const done = [1, 2].filter(seg => pending[seg]);
      return [...missing.map(seg => LINE_AT[seg]), ...done.map(seg => LINE_AT[seg]), ...missing.map(seg => LINE_AT[seg] + offset)];
    }

    async function decodeLoop(request) {
      // formatsToSupport 屬於建構子選項
      decoder = decoder || new Html5Qrcode('decode-area', { formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128], verbose: false });
      if (request !== cameraRequest || !camera) return;
      // 面板開著時暫停辨識與存檔
      if (camera.video.videoWidth && $('shade').hidden) {
        for (const at of scanPositions()) {
          if ((pending[1] || pending[2]) && !savingScan) sampleFaceValue();
          const text = await decodeBand(camera.video, at);
          if (request !== cameraRequest || !camera) return;
          if (text) onScanSuccess(text);
        }
      }
      camera.timer = setTimeout(() => decodeLoop(request), 80);
    }

    // 備援照片：取景框外放寬一成，讀到條碼的當下擷取（一定是同一張卡）
    function captureCroppedCardImage() {
      try {
        const video = document.querySelector('#reader video');
        if (!video || video.videoWidth === 0) return null;

        const box = toVideoRect(video, $('guide-box'));
        const [x, y, w, h] = [box.x - box.w * 0.1, box.y - box.h * 0.1, box.w * 1.2, box.h * 1.2];

        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = Math.round(640 / 1.586);

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.8);
      } catch (e) {
        return null;
      }
    }

    // ===== 四角鎖定：拍完整卡面 =====
    const LOCK_MS = 1000;        // 對準後穩定多久才拍
    const MOVE = 0.025;          // 倒數中角點偏離起點超過框寬的這個比例就重算
    const CORNER_FADE_MS = 200;  // 倒數開始後四角淡出
    const EDGE_MARGIN = 0.15;    // 取景框外搜尋範圍（相對框寬）
    const SMALL = 400;           // 偵測用影像寬
    const SHOT_MS = 500;         // 拍照動畫
    const PHOTO_WAIT_MS = 1500;  // 條碼與面額都好了之後，最多再等多久
    const FRESH_MS = 1500;       // 這段時間內讀到新卡條碼才倒數
    const READ_SLACK_MS = 400;
    const BLUE = 'rgba(59,130,246,.32)', GREEN = 'rgba(74,222,128,.34)';
    let lock = emptyLock();
    let reads = [];              // 最近讀到的條碼 { value, at }
    const grabCanvas = document.createElement('canvas');
    const smallCanvas = document.createElement('canvas');

    function emptyLock() {
      // photo：{ image, from, to, ok }；ok 代表倒數期間讀到的條碼和目前這張卡相符
      return { anchor: null, since: 0, misses: 0, best: null, photo: null };
    }

    function stopCountdown() {
      lock.anchor = lock.best = null;
      lock.misses = 0;
    }

    function noteRead(value) {
      if (!segmentOf(value)) return;
      const at = performance.now();
      reads = reads.filter(r => at - r.at < 8000);
      reads.push({ value, at });
    }

    // 鏡頭前有還沒建檔的卡（已存在或剛存的卡不再拍）
    function newCardInView(now) {
      return reads.some(r => now - r.at < FRESH_MS && !justSaved.includes(r.value) && !allCards.some(c => c.barcode === r.value || c.barcode2 === r.value));
    }

    // 防混卡：拍照前後要讀到這張卡的條碼，且倒數期間起沒有讀到別張的
    // （倒數前剛換掉的上一張不算：倒數時四角不能移動）
    function photoMatches(photo, codes) {
      const near = reads.filter(r => r.at >= photo.from - READ_SLACK_MS && r.at <= photo.to + READ_SLACK_MS);
      return near.some(r => codes[segmentOf(r.value)] === r.value)
        && !near.some(r => r.at >= photo.from && codes[segmentOf(r.value)] && codes[segmentOf(r.value)] !== r.value);
    }

    // 取景框（含外圍搜尋範圍）換算成影像座標，擷取一格並偵測
    function grabCard(video) {
      const box = toVideoRect(video, $('guide-box'));
      const margin = box.w * EDGE_MARGIN;
      const r = { x: box.x - margin, y: box.y - margin, w: box.w + 2 * margin, h: box.h + 2 * margin };
      const fit = Math.min(1, 1600 / r.w);
      grabCanvas.width = Math.round(r.w * fit);
      grabCanvas.height = Math.round(r.h * fit);
      grabCanvas.getContext('2d', { willReadFrequently: true }).drawImage(video, r.x, r.y, r.w, r.h, 0, 0, grabCanvas.width, grabCanvas.height);
      smallCanvas.width = SMALL;
      smallCanvas.height = Math.round(SMALL * r.h / r.w);
      const ctx = smallCanvas.getContext('2d', { willReadFrequently: true });
      ctx.clearRect(0, 0, smallCanvas.width, smallCanvas.height);
      ctx.drawImage(grabCanvas, 0, 0, smallCanvas.width, smallCanvas.height);
      const k = SMALL / r.w;
      const small = { x: margin * k, y: margin * k, w: box.w * k, h: box.h * k };
      const found = CardEdge.detect(ctx.getImageData(0, 0, smallCanvas.width, smallCanvas.height), small);
      return { ...found, box: small, region: r, toFull: grabCanvas.width / SMALL };
    }

    // 偵測座標換算成畫面（.cam）座標
    function toScreen(video, region, p) {
      const view = video.getBoundingClientRect();
      const scale = Math.max(view.width / video.videoWidth, view.height / video.videoHeight);
      return [(region.x + p.x / SMALL * region.w) * scale + (view.width - video.videoWidth * scale) / 2,
        (region.y + p.y / SMALL * region.w) * scale + (view.height - video.videoHeight * scale) / 2];
    }

    // 同一時間只畫一種圖形：四個角（抓到亮白），或實卡上的色塊
    function paintLock(video, frame, quad, corners, fill) {
      const canvas = $('lock-overlay'), view = video.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
      canvas.width = view.width * ratio;
      canvas.height = view.height * ratio;
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      if (fill && quad) {
        ctx.fillStyle = fill;
        ctx.beginPath();
        quad.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...toScreen(video, frame.region, p)));
        ctx.closePath();
        ctx.fill();
      }
      if (corners <= 0) return;
      const box = $('guide-box').getBoundingClientRect();
      const x = box.left - view.left, y = box.top - view.top, w = box.width, h = box.height, len = w * 0.1;
      ctx.globalAlpha = corners;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (const [cx, cy, sx, sy, a, b] of [[x, y, 1, 1, 'top', 'left'], [x + w, y, -1, 1, 'top', 'right'], [x + w, y + h, -1, -1, 'bottom', 'right'], [x, y + h, 1, -1, 'bottom', 'left']]) {
        ctx.strokeStyle = quad || (frame.sides[a] && frame.sides[b]) ? '#fff' : 'rgba(255,255,255,.45)';
        ctx.beginPath();
        ctx.moveTo(cx, cy + sy * len);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + sx * len, cy);
        ctx.stroke();
      }
    }

    function lockStep(video) {
      const now = performance.now();
      const held = lock.photo;
      if (held && !held.ok) {
        const known = pending[1] || pending[2];
        if (known && photoMatches(held, pending)) held.ok = true;
        else if (now - held.to > (known ? READ_SLACK_MS : FRESH_MS)) lock.photo = null; // 對不上，重拍
      }
      const frame = grabCard(video);
      const text = frame.quad && !lock.photo ? CardEdge.advice(frame) : '';
      const aligned = !text && frame.quad && !lock.photo && newCardInView(now);
      if (aligned) {
        if (lock.anchor && frame.quad.some((p, i) => CardEdge.dist(p, lock.anchor[i]) > frame.box.w * MOVE)) stopCountdown();
        if (!lock.anchor) { lock.anchor = frame.quad; lock.since = now; }
        lock.misses = 0;
        const score = CardEdge.sharpness(grabCanvas, frame);
        if (!lock.best || score > lock.best.score) {
          const source = lock.best ? lock.best.source : document.createElement('canvas');
          source.width = grabCanvas.width;
          source.height = grabCanvas.height;
          source.getContext('2d', { willReadFrequently: true }).drawImage(grabCanvas, 0, 0);
          lock.best = { frame, source, score };
        }
      } else if (lock.anchor && !frame.quad && lock.misses < 1) {
        lock.misses++; // 偶爾一格沒抓到不重算
      } else {
        stopCountdown();
      }
      const waited = lock.anchor ? now - lock.since : 0;
      paintLock(video, frame, frame.quad || lock.anchor, lock.anchor ? 1 - waited / CORNER_FADE_MS : 1, lock.anchor ? BLUE : null);
      $('lock-hint').textContent = lock.anchor ? '別動' : text;
      if (aligned && waited >= LOCK_MS) takePhoto(video, now);
    }

    function takePhoto(video, now) {
      const { frame, source } = lock.best;
      const out = document.createElement('canvas');
      out.width = 640;
      out.height = Math.round(640 / 1.586);
      CardEdge.warp(source, frame.quad.map(p => ({ x: p.x * frame.toFull, y: p.y * frame.toFull })), out);
      lock.photo = { image: out.toDataURL('image/jpeg', 0.8), from: lock.since, to: now, ok: false };
      if ((pending[1] || pending[2]) && photoMatches(lock.photo, pending)) lock.photo.ok = true;
      stopCountdown();

      paintLock(video, frame, frame.quad, 0, GREEN);
      $('lock-hint').textContent = '已拍好';
      const centre = frame.quad.map(p => toScreen(video, frame.region, p)).reduce((sum, p) => [sum[0] + p[0] / 4, sum[1] + p[1] / 4], [0, 0]);
      playShutter(...centre);
    }

    // 閃光＋快門圖示；(x, y) 為取景畫面座標
    function playShutter(x, y) {
      $('lock-shutter').style.left = `${x}px`;
      $('lock-shutter').style.top = `${y}px`;
      $('lock-fx').hidden = false;
      if (navigator.vibrate) navigator.vibrate(60);
      clearTimeout(camera.fxTimer);
      camera.fxTimer = setTimeout(() => $('lock-fx').hidden = true, SHOT_MS);
    }

    function lockLoop(request) {
      if (request !== cameraRequest || !camera) return;
      // 面板開著時暫停且倒數重算；拍照動畫期間保留畫面
      if (!$('shade').hidden) stopCountdown();
      else if (camera.video.videoWidth && $('lock-fx').hidden) lockStep(camera.video);
      camera.lockTimer = setTimeout(() => lockLoop(request), 80);
    }

    function clearLockView() {
      const canvas = $('lock-overlay');
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      $('lock-hint').textContent = '';
      $('lock-fx').hidden = true;
    }

    // 決定要存的照片：鎖定的照片優先，等不到就用讀到條碼時的放寬裁切。中途換卡或取消回傳 false
    async function awaitPhoto(current) {
      const use = image => { current.image = image; return true; };
      if (lock.photo?.ok) return use(lock.photo.image);
      setScanStatus('拿穩，拍卡面中', 'ok');
      const started = performance.now();
      for (;;) {
        await new Promise(resolve => setTimeout(resolve, 100));
        if (pending !== current || $('view-scanner').classList.contains('hidden')) return false;
        if (lock.photo?.ok) return use(lock.photo.image);
        const waited = performance.now() - started;
        if (waited >= PHOTO_WAIT_MS && !(lock.anchor && waited < PHOTO_WAIT_MS + LOCK_MS)) break; // 倒數中就讓它拍完
      }
      current.loose = true;
      if (camera) {
        // 沒鎖到四角：照樣給快門回饋（沒有綠色遮罩，另有文字提示）
        stopCountdown();
        clearLockView();
        const view = camera.video.getBoundingClientRect(), box = $('guide-box').getBoundingClientRect();
        playShutter(box.left - view.left + box.width / 2, box.top - view.top + box.height / 2);
      }
      return use(current.fallback);
    }

    function onScanSuccess(decodedText) {
      noteRead(decodedText); // 面額判定中也要記，供照片比對
      if (savingScan || !$('shade').hidden) return;
      if (justSaved.includes(decodedText)) {
        if (holdLeft > 0) holdLeft = holdMs; // 卡片還在鏡頭前，不重建
        // 剛刪除的卡一直擋著時，訊息淡掉後再說明一次，避免看似相機沒反應
        if (holdLeft > 0 && holdMs === DELETED_HOLD_MS && !pending[1] && !pending[2] && statusLeft <= 0 && fadeLeft <= 0) {
          setScanStatus(DELETED_HINT, 'wait', false, true);
        }
        return;
      }
      const segment = segmentOf(decodedText);
      if (!segment) return setScanStatus('這不是商品卡的條碼', 'warn', true, true);

      const streak = streaks[segment];
      streak.count = streak.value === decodedText ? streak.count + 1 : 1;
      streak.value = decodedText;

      if (pending[segment]) {
        if (pending[segment] === decodedText) {
          if (pending.confirm === segment) {
            pending.confirm = 0;
            finishCard();
          }
        } else if (streak.count >= SWAP_READS) {
          resetPending();
          setScanStatus('偵測到換卡，已清除，請重新對準', 'warn', true, true);
        }
        return;
      }
      if (streak.count >= READS_REQUIRED) acceptSegment(segment, decodedText);
    }

    function acceptSegment(segment, value) {
      if (savingScan || pending[segment]) return;

      const found = allCards.find(c => c.barcode === value || c.barcode2 === value);
      if (found) {
        setZone(segment, 'warn');
        return setScanStatus(`已存在，未新增・${tail8(found.barcode)}`, 'warn', true, true);
      }

      if (!pending[1] && !pending[2]) faceVotes = new Map(); // 丟掉上一張卡的殘留判讀
      pending[segment] = value;
      pending.fallback = captureCroppedCardImage();
      sampleFaceValue();
      if (navigator.vibrate) navigator.vibrate(60);

      updateScanUI();
      if (pending[1] && pending[2]) {
        pending.confirm = segment === 1 ? 2 : 1;
        setScanStatus('確認是否同一張卡，請保持對準', 'ok');
      }
    }

    const FACE_WAIT_MS = 2400; // 讀不到面額時，等這麼久才詢問

    // 面額一律採用卡面判讀值；讀不到才詢問
    async function finishCard() {
      savingScan = true; // 決定面額期間不再讀取條碼
      const current = pending;
      setScanStatus('兩段齊全，確認面額中', 'ok');
      const deadline = Date.now() + FACE_WAIT_MS;
      while (!confirmedFaceValue() && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 100));
        if (pending !== current || $('view-scanner').classList.contains('hidden')) return;
        sampleFaceValue();
      }

      const detected = confirmedFaceValue();
      if (detected) return await awaitPhoto(current) && savePending(detected);

      setZone('face', 'warn');
      setScanStatus('讀不到面額，請點選', 'warn', true);
      askScanFace(current);
    }

    function askScanFace(current) {
      const cancel = () => { closeSheet(); resetPending(); };
      openSheet(`<b>這張卡的面額是？</b><p class="muted">辨識已暫停</p>
        <div class="face-grid">${FACE_VALUES.map(v => `<button type="button" data-value="${v}">${miniCard(v, false)}<b>$${v}</b></button>`).join('')}</div>
        <button type="button" class="btn" data-act="retry">重掃這張</button>`, cancel);
      $('sheet').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => {
        closeSheet();
        if (pending !== current) return;
        awaitPhoto(current).then(ok => ok && savePending(Number(btn.dataset.value)));
      });
      sheetButton('retry', cancel);
    }

    function savePending(face) {
      savingScan = true;
      const current = pending;
      const codes = [current[1], current[2]];
      const card = { ...newCard(current[1], face, face, current.image), barcode2: current[2] };

      return addCard(card).then(() => {
        session.unshift({ id: card.id, face, barcode: card.barcode, codes });
        justSaved = codes;
        holdLeft = holdMs = SAVED_HOLD_MS; // 拿開後再掃，提示「已存在」
        resetPending();
        setZone('face', 'ok'); setZone(1, 'ok'); setZone(2, 'ok');
        setScanStatus(current.loose ? '已新增，卡面可能不完整' : '已新增，換下一張', current.loose ? 'warn' : 'ok', false, true);
        renderSession(face);
      }).catch(() => {
        resetPending();
        setScanStatus('儲存失敗，請重掃這張', 'warn', true);
      });
    }

    // 卡號＋圖片小圖示，點了看建檔時的原圖
    function shotLink(entry) {
      return `<button type="button" class="shot-link" data-shot="${escapeHTML(entry.id)}" aria-label="看原圖 ${escapeHTML(fullNo(entry.barcode))}"><span class="num">${escapeHTML(fullNo(entry.barcode))}</span>
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg></button>`;
    }

    // fromFace：由分組視窗開啟時，關閉後回到該組
    function viewScanPhoto(id, fromFace = 0) {
      if (savingScan) return;
      const entry = session.find(c => c.id === id);
      if (!entry) return;
      const back = () => fromFace ? viewScanGroup(fromFace) : closeSheet();
      const image = String(findCard(id)?.cropImage || '');
      const hasImage = image.startsWith('data:image/');
      openSheet(`<div class="row justify-between"><span class="num">${escapeHTML(fullNo(entry.barcode))}</span><b>面額 $${entry.face}</b></div>
        ${hasImage ? '<img class="photo" alt="卡背原圖">' : '<p class="muted text-center py-10">沒有原圖</p>'}
        <p class="muted">辨識已暫停</p>`, back);
      if (hasImage) $('sheet').querySelector('.photo').src = image;
    }

    // 放棄本次：刪除這次掃描新增的卡並離開掃描頁
    function askDropSession() {
      if (!session.length) return;
      resetPending(); // 讀到一半的卡一併丟掉，避免面板開著時在背後存檔
      const total = session.reduce((sum, c) => sum + c.face, 0);
      openSheet(`<b>放棄本次掃描？</b>
        <p>本次新增的 <b>${session.length} 張・${money(total)}</b> 會刪除。</p>
        <p class="muted">辨識已暫停。原本就有的卡不受影響。</p>
        <button type="button" class="btn btn-fill-danger" data-act="drop">放棄並刪除</button>`);
      sheetButton('drop', () => {
        const ids = session.map(c => c.id);
        // 同一個 transaction：全部刪除或全部保留
        removeCards(ids).then(() => {
          session = [];
          closeScanner();
          toast(`已放棄本次掃描，刪除 ${ids.length} 張`);
        }).catch(e => writeFailed(e, '刪除失敗，請再試一次'));
      });
    }

    // ----- 本次清單：最新一張＋依面額分組 -----
    function renderSession(bumpFace = 0) {
      const total = session.reduce((sum, c) => sum + c.face, 0);
      $('scan-total').textContent = `本次 ${session.length} 張・${money(total)}`;
      $('scan-drop').classList.toggle('off', !session.length); // 保留位置，張數文字不跳動

      const last = session[0];
      $('scan-latest').innerHTML = last ? `<span style="color:#9ca3af">最新</span>
        <b class="text-lg ${faceClass(last.face)}" style="color:var(--tone)">$${last.face}</b>
        ${shotLink(last)}
        <button type="button" class="trash" aria-label="刪除最新一張">${TRASH}</button>` : '';
      if (last) {
        $('scan-latest').querySelector('.trash').onclick = () => askRemoveScanned(last.id);
        $('scan-latest').querySelector('[data-shot]').onclick = () => viewScanPhoto(last.id);
      }

      $('scan-groups').innerHTML = FACE_VALUES.filter(v => session.some(c => c.face === v)).map(value => {
        const list = session.filter(c => c.face === value);
        return `<button type="button" class="grp ${value === bumpFace ? 'bump' : ''}" data-value="${value}">${miniCard(value)}
          <b class="text-lg w-12">× ${list.length}</b><span class="num flex-1">${escapeHTML(fullNo(list[0].barcode))}</span>
          <span class="text-xs" style="color:#9ca3af">檢視 ›</span></button>`;
      }).join('') || '<p class="text-sm text-center pt-5" style="color:#9ca3af">掃描成功的卡會依面額出現在這裡</p>';
      $('scan-groups').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => viewScanGroup(Number(btn.dataset.value)));
    }

    function viewScanGroup(value) {
      if (savingScan) return;
      const list = session.filter(c => c.face === value);
      if (!list.length) return closeSheet();
      openSheet(`<b>$${value}・本次 ${list.length} 張</b>
        <p class="muted">辨識已暫停</p>
        ${list.map(c => `<div class="sheet-row">${miniCard(value)}${shotLink(c)}${c === session[0] ? '<span class="muted">最新</span>' : ''}
          <button type="button" class="trash" data-del="${escapeHTML(c.id)}" aria-label="刪除卡號 ${escapeHTML(fullNo(c.barcode))}">${TRASH}</button></div>`).join('')}`);
      $('sheet').querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => askRemoveScanned(btn.dataset.del, value));
      $('sheet').querySelectorAll('[data-shot]').forEach(btn => btn.onclick = () => viewScanPhoto(btn.dataset.shot, value));
    }

    // fromFace：由分組視窗開啟時，結束後回到該組
    function askRemoveScanned(id, fromFace = 0) {
      if (savingScan) return;
      const entry = session.find(c => c.id === id);
      if (!entry) return;
      const cancel = () => fromFace ? viewScanGroup(fromFace) : closeSheet();
      openSheet(`<b>刪除這張卡？</b><div class="row">${miniCard(entry.face)}<div><div class="num">${escapeHTML(fullNo(entry.barcode))}</div>面額 $${entry.face}</div></div>
        <p class="muted">辨識已暫停。要重掃請先拿開卡片。</p>
        <button type="button" class="btn btn-fill-danger" data-act="delete">刪除</button>`, cancel);
      sheetButton('delete', () => {
        removeCard(id).then(() => {
          session = session.filter(c => c.id !== id);
          justSaved = entry.codes;
          holdLeft = holdMs = DELETED_HOLD_MS; // 拿開卡片後才可重掃
          closeSheet();
          resetPending();
          setScanStatus(DELETED_HINT, 'wait', false, true);
          renderSession();
          if (fromFace) viewScanGroup(fromFace);
        }).catch(e => writeFailed(e, '刪除失敗，請再試一次'));
      });
    }

    // ===== 左上紅字面額判讀 =====
    // 只在固定面額中判斷；任何不確定都回傳 null，不猜
    function detectFaceValue(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const { width, height } = canvas;
      const data = ctx.getImageData(0, 0, width, height).data;
      const red = new Uint8Array(width * height);
      for (let p = 0, i = 0; p < red.length; p++, i += 4) {
        if (data[i] > 80 && data[i] - data[i + 1] > 45 && data[i] - data[i + 2] > 25) red[p] = 1;
      }

      const runs = (size, filled) => {
        const out = [];
        let start = -1;
        for (let i = 0; i <= size; i++) {
          const on = i < size && filled(i);
          if (on && start < 0) start = i;
          if (!on && start >= 0) { out.push([start, i]); start = -1; }
        }
        return out;
      };

      // 標題是紅字中最高的一行
      const lines = runs(height, y => { let n = 0; for (let x = 0; x < width; x++) n += red[y * width + x]; return n > 1; });
      if (!lines.length) return null;
      const [top, bottom] = lines.reduce((a, b) => (b[1] - b[0] > a[1] - a[0] ? b : a));
      if (bottom - top < 14) return null; // 太小無法判讀

      const glyphs = runs(width, x => { for (let y = top; y < bottom; y++) if (red[y * width + x]) return true; return false; })
        .map(([x0, x1]) => {
          let y0 = bottom;
          let y1 = top;
          for (let y = top; y < bottom; y++) {
            for (let x = x0; x < x1; x++) {
              if (red[y * width + x]) { y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1); break; }
            }
          }
          return { x0, y0, w: x1 - x0, h: y1 - y0 };
        })
        .filter(g => g.w > 1 && g.h > (bottom - top) * 0.3);
      if (glyphs.length < 5) return null;

      // 結尾是較矮的「元」，往前連續的高窄字元即數字
      const tall = Math.max(...glyphs.map(g => g.h));
      if (glyphs[glyphs.length - 1].h > tall * 0.8) return null;
      const digits = [];
      for (let i = glyphs.length - 2; i >= 0; i--) {
        const g = glyphs[i];
        if (g.h < tall * 0.8 || g.w / g.h > 0.75) break;
        digits.unshift(g);
      }
      if (digits.length < 2 || digits.length > 4) return null;

      const value = Number(digits.map(g => classifyDigit(red, width, g)).join(''));
      return FACE_VALUES.includes(value) ? value : null;
    }

    // 面額只會出現 0、1、2、3、5
    function classifyDigit(red, stride, { x0, y0, w, h }) {
      const ink = (x, y) => red[(y0 + y) * stride + x0 + x] === 1;
      if (w / h < 0.4) return '1';

      // 封閉空洞：外圍淹水後仍未到達的背景
      const W = w + 2;
      const seen = new Uint8Array(W * (h + 2));
      const blank = (x, y) => x < 1 || y < 1 || x > w || y > h || !ink(x - 1, y - 1);
      const stack = [[0, 0]];
      seen[0] = 1;
      while (stack.length) {
        const [x, y] = stack.pop();
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= W || ny >= h + 2 || seen[ny * W + nx] || !blank(nx, ny)) continue;
          seen[ny * W + nx] = 1;
          stack.push([nx, ny]);
        }
      }
      let enclosed = 0;
      for (let y = 1; y <= h; y++) for (let x = 1; x <= w; x++) if (blank(x, y) && !seen[y * W + x]) enclosed++;
      if (enclosed > w * h * 0.08) return '0';

      // 筆畫重心偏左或偏右：2＝右左、5＝左右、3＝右右
      const side = (from, to) => {
        let sum = 0;
        let n = 0;
        for (let y = Math.floor(h * from); y < Math.ceil(h * to); y++) {
          for (let x = 0; x < w; x++) if (ink(x, y)) { sum += (x + 0.5) / w; n++; }
        }
        return !n ? '?' : sum / n > 0.54 ? 'R' : sum / n < 0.46 ? 'L' : '?';
      };
      const shape = side(0.22, 0.38) + side(0.62, 0.76);
      return { RL: '2', LR: '5', RR: '3' }[shape] || 'x';
    }

    // 以影像原始解析度裁出取景框左上角
    function sampleFaceValue() {
      if (!camera || !camera.video.videoWidth) return;
      const box = toVideoRect(camera.video, $('guide-box'));
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = Math.round(640 * (box.h * 0.2) / (box.w * 0.42));
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(camera.video, box.x, box.y - box.h * 0.03, box.w * 0.42, box.h * 0.2, 0, 0, canvas.width, canvas.height);
      const value = detectFaceValue(canvas);
      if (value) faceVotes.set(value, (faceVotes.get(value) || 0) + 1);
    }

    // 至少兩次且沒有其他答案才算有把握
    function confirmedFaceValue() {
      if (faceVotes.size !== 1) return null;
      const [value, count] = [...faceVotes][0];
      return count >= 2 ? value : null;
    }

    // ===== 付款：資料 =====
    // payment store 只有一筆 current，只存卡片 id 與金額。所有寫入都在 transaction 內重讀後再改。
    const gone = () => Object.assign(new Error('這筆付款已在別處結束'), { gone: true });
    const doneItems = record => record.items.filter(i => i.done).sort((a, b) => a.order - b.order);
    const paidByCards = record => record.items.reduce((sum, i) => sum + (i.done ? i.use : 0), 0);
    const remaining = record => record.bill - record.other - paidByCards(record);

    // 有餘額剛好等於應扣金額的卡就只用那張；否則依餘額由少到多（同額舊的先）配到足額
    function allocate(list, need, exclude = []) {
      const items = [];
      const pool = list.filter(c => c.status === 'active' && c.balance > 0 && isComplete(c) && !c.needsCheck && !exclude.includes(c.id))
        .sort((a, b) => a.balance - b.balance || a.createdAt - b.createdAt);
      const exact = need > 0 && pool.find(c => c.balance === need);
      for (const card of exact ? [exact] : pool) {
        if (need <= 0) break;
        const use = Math.min(card.balance, need);
        items.push({ cardId: card.id, use, before: card.balance, done: false, order: 0 });
        need -= use;
      }
      return { items, short: Math.max(0, need) };
    }

    // cards 與 payment 同一個 transaction；action 丟例外就整筆不寫
    function payTx(action) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readwrite');
        const cards = tx.objectStore(STORE_NAME), store = tx.objectStore(PAY_STORE);
        let failure = null;
        const all = cards.getAll(), current = store.get('current');
        current.onsuccess = () => {
          try {
            action({ record: current.result || null, list: all.result, cards, store });
          } catch (e) {
            failure = e;
            tx.abort();
          }
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 只改本次付款紀錄
    function updatePayment(sessionId, mutate) {
      return payTx(({ record, list, store }) => {
        if (!record || record.sessionId !== sessionId) throw gone();
        mutate(record, list);
        record.updatedAt = Date.now();
        store.put(record);
      });
    }

    // 確認頁每按一個鍵就存，只讀寫 payment（不必重讀含照片的卡片）
    function saveEdit(sessionId, cardId, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PAY_STORE, 'readwrite');
        const store = tx.objectStore(PAY_STORE);
        const request = store.get('current');
        request.onsuccess = () => {
          const record = request.result;
          if (!record || record.sessionId !== sessionId) return;
          record.edits[cardId] = value;
          record.updatedAt = Date.now();
          store.put(record);
          payment = record;
        };
        tx.oncomplete = resolve;
        tx.onabort = () => reject(tx.error);
      });
    }

    function createPayment(bill, other) {
      const sessionId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      return payTx(({ record, list, store }) => {
        if (record) throw Object.assign(new Error('有一筆付款尚未完成'), { exists: true });
        const plan = allocate(list, bill - other);
        if (plan.short || !plan.items.length) throw new Error('可付款的餘額已改變，請重新確認');
        store.add({ id: 'current', sessionId, stage: 'swipe', bill, other, items: plan.items, edits: {}, updatedAt: Date.now() });
      }).then(() => sessionId);
    }

    function markDone(sessionId, cardId) {
      return updatePayment(sessionId, record => {
        const item = record.items.find(i => i.cardId === cardId);
        if (!item) throw new Error('這張卡不在本次付款中');
        if (!item.done) {
          item.done = true;
          item.order = Math.max(0, ...record.items.map(i => i.order)) + 1;
        }
        if (remaining(record) <= 0) record.stage = 'confirm';
      });
    }

    // 撤銷：保留其他已刷結果，只重配未刷的卡
    function undoDone(sessionId, cardId) {
      return updatePayment(sessionId, (record, list) => {
        const done = doneItems(record).filter(i => i.cardId !== cardId);
        const need = record.bill - record.other - done.reduce((sum, i) => sum + i.use, 0);
