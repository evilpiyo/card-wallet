    // 將畫面上的元素位置換算成影像座標（video 以 object-fit: cover 顯示）
    function toVideoRect(video, element) {
      const view = video.getBoundingClientRect();
      const box = element.getBoundingClientRect();
      const scale = Math.max(view.width / video.videoWidth, view.height / video.videoHeight);
      const offsetX = (view.width - video.videoWidth * scale) / 2;
      const offsetY = (view.height - video.videoHeight * scale) / 2;
      return {
        x: (box.left - view.left - offsetX) / scale,
        y: (box.top - view.top - offsetY) / scale,
        w: box.width / scale,
        h: box.height / scale
      };
    }

    // 依序嘗試的橫向範圍（相對取景框）：新版紙卡條碼靠左、右側有 QR Code；舊版置中。
    // average：沿條碼方向取平均，消除紙卡印刷網點（不依賴 canvas filter）。
    const SCAN_VARIANTS = [
      { from: 0.02, to: 0.64, average: true },
      { from: 0.02, to: 0.64, average: false },
      { from: 0.09, to: 0.91, average: false },
      { from: 0.13, to: 0.87, average: true },
      { from: 0.18, to: 0.82, average: true },  // 銀漆灰底：只取灰底內側
      { from: 0, to: 1, average: false },
      { from: 0.02, to: 0.64, average: true, height: 0.035 } // 手持歪斜時用較薄的長條
    ];

    function averageColumns(ctx, width, height, margin) {
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      const columns = new Array(width);
      for (let x = 0; x < width; x++) {
        let sum = 0;
        for (let y = 0; y < height; y++) {
          const i = (y * width + x) * 4;
          sum += data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
        }
        columns[x] = sum / height;
      }
      // 拉開明暗（灰底時提高對比），兩側補白邊不列入
      let min = 255;
      let max = 0;
      for (let x = margin; x < width - margin; x++) {
        min = Math.min(min, columns[x]);
        max = Math.max(max, columns[x]);
      }
      for (let x = 0; x < width; x++) {
        const gray = x < margin || x >= width - margin ? 255 : (columns[x] - min) * 255 / Math.max(1, max - min);
        for (let y = 0; y < height; y++) {
          const i = (y * width + x) * 4;
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    // at：長條中心在取景框內的高度比例
    async function decodeBand(video, at) {
      const box = toVideoRect(video, $('guide-box'));
      const margin = 30; // 左右補白邊，作為靜音區
      const canvas = document.createElement('canvas');
      for (const variant of SCAN_VARIANTS) {
        const bandHeight = box.h * (variant.height || 0.07);
        const width = box.w * (variant.to - variant.from);
        const outWidth = Math.max(800, Math.round(width));
        canvas.width = outWidth + margin * 2;
        canvas.height = Math.round(bandHeight * outWidth / width);
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, box.x + box.w * variant.from, box.y + box.h * at - bandHeight / 2, width, bandHeight, margin, 0, outWidth, canvas.height);
        if (variant.average) averageColumns(ctx, canvas.width, canvas.height, margin);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        try {
          const result = await decoder.scanFileV2(new File([blob], 'band.png', { type: 'image/png' }), false);
          return result.decodedText;
        } catch (e) {
        } finally {
          decoder.clear();
        }
      }
      return null;
    }

    const LINE_AT = { 1: 0.60, 2: 0.85 };
    const OFFSETS = [-0.05, 0.05, -0.1, 0.1];
    let offsetTurn = 0;

    // 尚未讀到的段落：先讀導引線本身，再輪流試上下偏移。
    // 已讀到的段落也持續讀，內容一變代表換了卡。
    function scanPositions() {
      const offset = OFFSETS[offsetTurn++ % OFFSETS.length];
      if (pending.confirm) return [LINE_AT[pending.confirm], LINE_AT[pending.confirm] + offset];
      const missing = [1, 2].filter(seg => !pending[seg]);
      const done = [1, 2].filter(seg => pending[seg]);
      return [...missing.map(seg => LINE_AT[seg]), ...done.map(seg => LINE_AT[seg]), ...missing.map(seg => LINE_AT[seg] + offset)];
    }

    async function decodeLoop(request) {
      // formatsToSupport 屬於建構子選項
      decoder = decoder || new Html5Qrcode('decode-area', { formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128], verbose: false });
      if (request !== cameraRequest || !camera) return;
      // 面板開著時暫停辨識與存檔
      if (camera.video.videoWidth && $('shade').hidden) {
        for (const at of scanPositions()) {
          if ((pending[1] || pending[2]) && !savingScan) sampleFaceValue();
          const text = await decodeBand(camera.video, at);
          if (request !== cameraRequest || !camera) return;
          if (text) onScanSuccess(text);
        }
      }
      camera.timer = setTimeout(() => decodeLoop(request), 80);
    }

    // 備援照片：取景框外放寬一成，讀到條碼的當下擷取（一定是同一張卡）
    function captureCroppedCardImage() {
      try {
        const video = document.querySelector('#reader video');
        if (!video || video.videoWidth === 0) return null;

        const box = toVideoRect(video, $('guide-box'));
        const [x, y, w, h] = [box.x - box.w * 0.1, box.y - box.h * 0.1, box.w * 1.2, box.h * 1.2];

        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = Math.round(640 / 1.586);

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.8);
      } catch (e) {
        return null;
      }
    }

    // ===== 四角鎖定：拍完整卡面 =====
    const LOCK_MS = 1000;        // 對準後穩定多久才拍
    const MOVE = 0.025;          // 倒數中角點偏離起點超過框寬的這個比例就重算
    const CORNER_FADE_MS = 200;  // 倒數開始後四角淡出
    const EDGE_MARGIN = 0.15;    // 取景框外搜尋範圍（相對框寬）
    const SMALL = 400;           // 偵測用影像寬
    const SHOT_MS = 500;         // 拍照動畫
    const PHOTO_WAIT_MS = 1500;  // 條碼與面額都好了之後，最多再等多久
    const FRESH_MS = 1500;       // 這段時間內讀到新卡條碼才倒數
    const READ_SLACK_MS = 400;
    const BLUE = 'rgba(59,130,246,.32)', GREEN = 'rgba(74,222,128,.34)';
    let lock = emptyLock();
    let reads = [];              // 最近讀到的條碼 { value, at }
    const grabCanvas = document.createElement('canvas');
    const smallCanvas = document.createElement('canvas');

    function emptyLock() {
      // photo：{ image, from, to, ok }；ok 代表倒數期間讀到的條碼和目前這張卡相符
      return { anchor: null, since: 0, misses: 0, best: null, photo: null };
    }

    function stopCountdown() {
      lock.anchor = lock.best = null;
      lock.misses = 0;
    }

    function noteRead(value) {
      if (!segmentOf(value)) return;
      const at = performance.now();
      reads = reads.filter(r => at - r.at < 8000);
      reads.push({ value, at });
    }

    // 鏡頭前有還沒建檔的卡（已存在或剛存的卡不再拍）
    function newCardInView(now) {
      return reads.some(r => now - r.at < FRESH_MS && !justSaved.includes(r.value) && !allCards.some(c => c.barcode === r.value || c.barcode2 === r.value));
    }

    // 防混卡：拍照前後要讀到這張卡的條碼，且倒數期間起沒有讀到別張的
    // （倒數前剛換掉的上一張不算：倒數時四角不能移動）
    function photoMatches(photo, codes) {
      const near = reads.filter(r => r.at >= photo.from - READ_SLACK_MS && r.at <= photo.to + READ_SLACK_MS);
      return near.some(r => codes[segmentOf(r.value)] === r.value)
        && !near.some(r => r.at >= photo.from && codes[segmentOf(r.value)] && codes[segmentOf(r.value)] !== r.value);
    }

    // 取景框（含外圍搜尋範圍）換算成影像座標，擷取一格並偵測
    function grabCard(video) {
      const box = toVideoRect(video, $('guide-box'));
      const margin = box.w * EDGE_MARGIN;
      const r = { x: box.x - margin, y: box.y - margin, w: box.w + 2 * margin, h: box.h + 2 * margin };
      const fit = Math.min(1, 1600 / r.w);
      grabCanvas.width = Math.round(r.w * fit);
      grabCanvas.height = Math.round(r.h * fit);
      grabCanvas.getContext('2d', { willReadFrequently: true }).drawImage(video, r.x, r.y, r.w, r.h, 0, 0, grabCanvas.width, grabCanvas.height);
      smallCanvas.width = SMALL;
      smallCanvas.height = Math.round(SMALL * r.h / r.w);
      const ctx = smallCanvas.getContext('2d', { willReadFrequently: true });
      ctx.clearRect(0, 0, smallCanvas.width, smallCanvas.height);
      ctx.drawImage(grabCanvas, 0, 0, smallCanvas.width, smallCanvas.height);
      const k = SMALL / r.w;
      const small = { x: margin * k, y: margin * k, w: box.w * k, h: box.h * k };
      const found = CardEdge.detect(ctx.getImageData(0, 0, smallCanvas.width, smallCanvas.height), small);
      return { ...found, box: small, region: r, toFull: grabCanvas.width / SMALL };
    }

    // 偵測座標換算成畫面（.cam）座標
    function toScreen(video, region, p) {
      const view = video.getBoundingClientRect();
      const scale = Math.max(view.width / video.videoWidth, view.height / video.videoHeight);
      return [(region.x + p.x / SMALL * region.w) * scale + (view.width - video.videoWidth * scale) / 2,
        (region.y + p.y / SMALL * region.w) * scale + (view.height - video.videoHeight * scale) / 2];
    }

    // 同一時間只畫一種圖形：四個角（抓到亮白），或實卡上的色塊
    function paintLock(video, frame, quad, corners, fill) {
      const canvas = $('lock-overlay'), view = video.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
      canvas.width = view.width * ratio;
      canvas.height = view.height * ratio;
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      if (fill && quad) {
        ctx.fillStyle = fill;
        ctx.beginPath();
        quad.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...toScreen(video, frame.region, p)));
        ctx.closePath();
        ctx.fill();
      }
      if (corners <= 0) return;
      const box = $('guide-box').getBoundingClientRect();
      const x = box.left - view.left, y = box.top - view.top, w = box.width, h = box.height, len = w * 0.1;
      ctx.globalAlpha = corners;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (const [cx, cy, sx, sy, a, b] of [[x, y, 1, 1, 'top', 'left'], [x + w, y, -1, 1, 'top', 'right'], [x + w, y + h, -1, -1, 'bottom', 'right'], [x, y + h, 1, -1, 'bottom', 'left']]) {
        ctx.strokeStyle = quad || (frame.sides[a] && frame.sides[b]) ? '#fff' : 'rgba(255,255,255,.45)';
        ctx.beginPath();
        ctx.moveTo(cx, cy + sy * len);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + sx * len, cy);
        ctx.stroke();
      }
    }

    function lockStep(video) {
      const now = performance.now();
      const held = lock.photo;
      if (held && !held.ok) {
        const known = pending[1] || pending[2];
        if (known && photoMatches(held, pending)) held.ok = true;
        else if (now - held.to > (known ? READ_SLACK_MS : FRESH_MS)) lock.photo = null; // 對不上，重拍
      }
      const frame = grabCard(video);
      const text = frame.quad && !lock.photo ? CardEdge.advice(frame) : '';
      const aligned = !text && frame.quad && !lock.photo && newCardInView(now);
      if (aligned) {
        if (lock.anchor && frame.quad.some((p, i) => CardEdge.dist(p, lock.anchor[i]) > frame.box.w * MOVE)) stopCountdown();
        if (!lock.anchor) { lock.anchor = frame.quad; lock.since = now; }
        lock.misses = 0;
        const score = CardEdge.sharpness(grabCanvas, frame);
        if (!lock.best || score > lock.best.score) {
          const source = lock.best ? lock.best.source : document.createElement('canvas');
          source.width = grabCanvas.width;
          source.height = grabCanvas.height;
          source.getContext('2d', { willReadFrequently: true }).drawImage(grabCanvas, 0, 0);
          lock.best = { frame, source, score };
        }
      } else if (lock.anchor && !frame.quad && lock.misses < 1) {
        lock.misses++; // 偶爾一格沒抓到不重算
      } else {
        stopCountdown();
      }
      const waited = lock.anchor ? now - lock.since : 0;
      paintLock(video, frame, frame.quad || lock.anchor, lock.anchor ? 1 - waited / CORNER_FADE_MS : 1, lock.anchor ? BLUE : null);
      $('lock-hint').textContent = lock.anchor ? '別動' : text;
      if (aligned && waited >= LOCK_MS) takePhoto(video, now);
    }

    function takePhoto(video, now) {
      const { frame, source } = lock.best;
      const out = document.createElement('canvas');
      out.width = 640;
      out.height = Math.round(640 / 1.586);
      CardEdge.warp(source, frame.quad.map(p => ({ x: p.x * frame.toFull, y: p.y * frame.toFull })), out);
      lock.photo = { image: out.toDataURL('image/jpeg', 0.8), from: lock.since, to: now, ok: false };
      if ((pending[1] || pending[2]) && photoMatches(lock.photo, pending)) lock.photo.ok = true;
      stopCountdown();

      paintLock(video, frame, frame.quad, 0, GREEN);
      $('lock-hint').textContent = '已拍好';
      const centre = frame.quad.map(p => toScreen(video, frame.region, p)).reduce((sum, p) => [sum[0] + p[0] / 4, sum[1] + p[1] / 4], [0, 0]);
      playShutter(...centre);
    }

    // 閃光＋快門圖示；(x, y) 為取景畫面座標
    function playShutter(x, y) {
      $('lock-shutter').style.left = `${x}px`;
      $('lock-shutter').style.top = `${y}px`;
      $('lock-fx').hidden = false;
      if (navigator.vibrate) navigator.vibrate(60);
      clearTimeout(camera.fxTimer);
      camera.fxTimer = setTimeout(() => $('lock-fx').hidden = true, SHOT_MS);
    }

    function lockLoop(request) {
      if (request !== cameraRequest || !camera) return;
      // 面板開著時暫停且倒數重算；拍照動畫期間保留畫面
      if (!$('shade').hidden) stopCountdown();
      else if (camera.video.videoWidth && $('lock-fx').hidden) lockStep(camera.video);
      camera.lockTimer = setTimeout(() => lockLoop(request), 80);
    }

    function clearLockView() {
      const canvas = $('lock-overlay');
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      $('lock-hint').textContent = '';
      $('lock-fx').hidden = true;
    }

    // 決定要存的照片：鎖定的照片優先，等不到就用讀到條碼時的放寬裁切。中途換卡或取消回傳 false
    async function awaitPhoto(current) {
      const use = image => { current.image = image; return true; };
      if (lock.photo?.ok) return use(lock.photo.image);
      setScanStatus('拿穩，拍卡面中', 'ok');
      const started = performance.now();
      for (;;) {
        await new Promise(resolve => setTimeout(resolve, 100));
        if (pending !== current || $('view-scanner').classList.contains('hidden')) return false;
        if (lock.photo?.ok) return use(lock.photo.image);
        const waited = performance.now() - started;
        if (waited >= PHOTO_WAIT_MS && !(lock.anchor && waited < PHOTO_WAIT_MS + LOCK_MS)) break; // 倒數中就讓它拍完
      }
      current.loose = true;
      if (camera) {
        // 沒鎖到四角：照樣給快門回饋（沒有綠色遮罩，另有文字提示）
        stopCountdown();
        clearLockView();
        const view = camera.video.getBoundingClientRect(), box = $('guide-box').getBoundingClientRect();
        playShutter(box.left - view.left + box.width / 2, box.top - view.top + box.height / 2);
      }
      return use(current.fallback);
    }

    function onScanSuccess(decodedText) {
      noteRead(decodedText); // 面額判定中也要記，供照片比對
      if (savingScan || !$('shade').hidden) return;
      if (justSaved.includes(decodedText)) {
        if (holdLeft > 0) holdLeft = holdMs; // 卡片還在鏡頭前，不重建
        // 剛刪除的卡一直擋著時，訊息淡掉後再說明一次，避免看似相機沒反應
        if (holdLeft > 0 && holdMs === DELETED_HOLD_MS && !pending[1] && !pending[2] && statusLeft <= 0 && fadeLeft <= 0) {
          setScanStatus(DELETED_HINT, 'wait', false, true);
        }
        return;
      }
      const segment = segmentOf(decodedText);
      if (!segment) return setScanStatus('這不是商品卡的條碼', 'warn', true, true);

      const streak = streaks[segment];
      streak.count = streak.value === decodedText ? streak.count + 1 : 1;
      streak.value = decodedText;

      if (pending[segment]) {
        if (pending[segment] === decodedText) {
          if (pending.confirm === segment) {
            pending.confirm = 0;
            finishCard();
          }
        } else if (streak.count >= SWAP_READS) {
          resetPending();
          setScanStatus('偵測到換卡，已清除，請重新對準', 'warn', true, true);
        }
        return;
      }
      if (streak.count >= READS_REQUIRED) acceptSegment(segment, decodedText);
    }

    function acceptSegment(segment, value) {
      if (savingScan || pending[segment]) return;

      const found = allCards.find(c => c.barcode === value || c.barcode2 === value);
      if (found) {
        setZone(segment, 'warn');
        return setScanStatus(`已存在，未新增・${tail8(found.barcode)}`, 'warn', true, true);
      }

      if (!pending[1] && !pending[2]) faceVotes = new Map(); // 丟掉上一張卡的殘留判讀
      pending[segment] = value;
      pending.fallback = captureCroppedCardImage();
      sampleFaceValue();
      if (navigator.vibrate) navigator.vibrate(60);

      updateScanUI();
      if (pending[1] && pending[2]) {
        pending.confirm = segment === 1 ? 2 : 1;
        setScanStatus('確認是否同一張卡，請保持對準', 'ok');
      }
    }

    const FACE_WAIT_MS = 2400; // 讀不到面額時，等這麼久才詢問

    // 面額一律採用卡面判讀值；讀不到才詢問
    async function finishCard() {
      savingScan = true; // 決定面額期間不再讀取條碼
      const current = pending;
      setScanStatus('兩段齊全，確認面額中', 'ok');
      const deadline = Date.now() + FACE_WAIT_MS;
      while (!confirmedFaceValue() && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 100));
        if (pending !== current || $('view-scanner').classList.contains('hidden')) return;
        sampleFaceValue();
      }

      const detected = confirmedFaceValue();
      if (detected) return await awaitPhoto(current) && savePending(detected);

      setZone('face', 'warn');
      setScanStatus('讀不到面額，請點選', 'warn', true);
      askScanFace(current);
    }

    function askScanFace(current) {
      const cancel = () => { closeSheet(); resetPending(); };
      openSheet(`<b>這張卡的面額是？</b><p class="muted">辨識已暫停</p>
        <div class="face-grid">${FACE_VALUES.map(v => `<button type="button" data-value="${v}">${miniCard(v, false)}<b>$${v}</b></button>`).join('')}</div>
        <button type="button" class="btn" data-act="retry">重掃這張</button>`, cancel);
      $('sheet').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => {
        closeSheet();
        if (pending !== current) return;
        awaitPhoto(current).then(ok => ok && savePending(Number(btn.dataset.value)));
      });
      sheetButton('retry', cancel);
    }

    function savePending(face) {
      savingScan = true;
      const current = pending;
      const codes = [current[1], current[2]];
      const card = { ...newCard(current[1], face, face, current.image), barcode2: current[2] };

      return addCard(card).then(() => {
        session.unshift({ id: card.id, face, barcode: card.barcode, codes });
        justSaved = codes;
        holdLeft = holdMs = SAVED_HOLD_MS; // 拿開後再掃，提示「已存在」
        resetPending();
        setZone('face', 'ok'); setZone(1, 'ok'); setZone(2, 'ok');
        setScanStatus(current.loose ? '已新增，卡面可能不完整' : '已新增，換下一張', current.loose ? 'warn' : 'ok', false, true);
        renderSession(face);
      }).catch(() => {
        resetPending();
        setScanStatus('儲存失敗，請重掃這張', 'warn', true);
      });
    }

    // 卡號＋圖片小圖示，點了看建檔時的原圖
    function shotLink(entry) {
      return `<button type="button" class="shot-link" data-shot="${escapeHTML(entry.id)}" aria-label="看原圖 ${escapeHTML(fullNo(entry.barcode))}"><span class="num">${escapeHTML(fullNo(entry.barcode))}</span>
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg></button>`;
    }

    // fromFace：由分組視窗開啟時，關閉後回到該組
    function viewScanPhoto(id, fromFace = 0) {
      if (savingScan) return;
      const entry = session.find(c => c.id === id);
      if (!entry) return;
      const back = () => fromFace ? viewScanGroup(fromFace) : closeSheet();
      const image = String(findCard(id)?.cropImage || '');
      const hasImage = image.startsWith('data:image/');
      openSheet(`<div class="row justify-between"><span class="num">${escapeHTML(fullNo(entry.barcode))}</span><b>面額 $${entry.face}</b></div>
        ${hasImage ? '<img class="photo" alt="卡背原圖">' : '<p class="muted text-center py-10">沒有原圖</p>'}
        <p class="muted">辨識已暫停</p>`, back);
      if (hasImage) $('sheet').querySelector('.photo').src = image;
    }

    // 放棄本次：刪除這次掃描新增的卡並離開掃描頁
    function askDropSession() {
      if (!session.length) return;
      resetPending(); // 讀到一半的卡一併丟掉，避免面板開著時在背後存檔
      const total = session.reduce((sum, c) => sum + c.face, 0);
      openSheet(`<b>放棄本次掃描？</b>
        <p>本次新增的 <b>${session.length} 張・${money(total)}</b> 會刪除。</p>
        <p class="muted">辨識已暫停。原本就有的卡不受影響。</p>
        <button type="button" class="btn btn-fill-danger" data-act="drop">放棄並刪除</button>`);
      sheetButton('drop', () => {
        const ids = session.map(c => c.id);
        // 同一個 transaction：全部刪除或全部保留
        writeStore(store => ids.forEach(id => store.delete(id))).then(() => {
          session = [];
          closeScanner();
          toast(`已放棄本次掃描，刪除 ${ids.length} 張`);
        }).catch(() => toast('刪除失敗，請再試一次'));
      });
    }

    // ----- 本次清單：最新一張＋依面額分組 -----
    function renderSession(bumpFace = 0) {
      const total = session.reduce((sum, c) => sum + c.face, 0);
      $('scan-total').textContent = `本次 ${session.length} 張・${money(total)}`;
      $('scan-drop').classList.toggle('off', !session.length); // 保留位置，張數文字不跳動

      const last = session[0];
      $('scan-latest').innerHTML = last ? `<span style="color:#9ca3af">最新</span>
        <b class="text-lg ${faceClass(last.face)}" style="color:var(--tone)">$${last.face}</b>
        ${shotLink(last)}
        <button type="button" class="trash" aria-label="刪除最新一張">${TRASH}</button>` : '';
      if (last) {
        $('scan-latest').querySelector('.trash').onclick = () => askRemoveScanned(last.id);
        $('scan-latest').querySelector('[data-shot]').onclick = () => viewScanPhoto(last.id);
      }

      $('scan-groups').innerHTML = FACE_VALUES.filter(v => session.some(c => c.face === v)).map(value => {
        const list = session.filter(c => c.face === value);
        return `<button type="button" class="grp ${value === bumpFace ? 'bump' : ''}" data-value="${value}">${miniCard(value)}
          <b class="text-lg w-12">× ${list.length}</b><span class="num flex-1">${escapeHTML(fullNo(list[0].barcode))}</span>
          <span class="text-xs" style="color:#9ca3af">檢視 ›</span></button>`;
      }).join('') || '<p class="text-sm text-center pt-5" style="color:#9ca3af">掃描成功的卡會依面額出現在這裡</p>';
      $('scan-groups').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => viewScanGroup(Number(btn.dataset.value)));
    }

    function viewScanGroup(value) {
      if (savingScan) return;
      const list = session.filter(c => c.face === value);
      if (!list.length) return closeSheet();
      openSheet(`<b>$${value}・本次 ${list.length} 張</b>
        <p class="muted">辨識已暫停</p>
        ${list.map(c => `<div class="sheet-row">${miniCard(value)}${shotLink(c)}${c === session[0] ? '<span class="muted">最新</span>' : ''}
          <button type="button" class="trash" data-del="${escapeHTML(c.id)}" aria-label="刪除卡號 ${escapeHTML(fullNo(c.barcode))}">${TRASH}</button></div>`).join('')}`);
      $('sheet').querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => askRemoveScanned(btn.dataset.del, value));
      $('sheet').querySelectorAll('[data-shot]').forEach(btn => btn.onclick = () => viewScanPhoto(btn.dataset.shot, value));
    }

    // fromFace：由分組視窗開啟時，結束後回到該組
    function askRemoveScanned(id, fromFace = 0) {
      if (savingScan) return;
      const entry = session.find(c => c.id === id);
      if (!entry) return;
      const cancel = () => fromFace ? viewScanGroup(fromFace) : closeSheet();
      openSheet(`<b>刪除這張卡？</b><div class="row">${miniCard(entry.face)}<div><div class="num">${escapeHTML(fullNo(entry.barcode))}</div>面額 $${entry.face}</div></div>
        <p class="muted">辨識已暫停。要重掃請先拿開卡片。</p>
        <button type="button" class="btn btn-fill-danger" data-act="delete">刪除</button>`, cancel);
      sheetButton('delete', () => {
        removeCard(id).then(() => {
          session = session.filter(c => c.id !== id);
          justSaved = entry.codes;
          holdLeft = holdMs = DELETED_HOLD_MS; // 拿開卡片後才可重掃
          closeSheet();
          resetPending();
          setScanStatus(DELETED_HINT, 'wait', false, true);
          renderSession();
          if (fromFace) viewScanGroup(fromFace);
        }).catch(() => toast('刪除失敗，請再試一次'));
      });
    }

    // ===== 左上紅字面額判讀 =====
    // 只在固定面額中判斷；任何不確定都回傳 null，不猜
    function detectFaceValue(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const { width, height } = canvas;
      const data = ctx.getImageData(0, 0, width, height).data;
      const red = new Uint8Array(width * height);
      for (let p = 0, i = 0; p < red.length; p++, i += 4) {
        if (data[i] > 80 && data[i] - data[i + 1] > 45 && data[i] - data[i + 2] > 25) red[p] = 1;
      }

      const runs = (size, filled) => {
        const out = [];
        let start = -1;
        for (let i = 0; i <= size; i++) {
          const on = i < size && filled(i);
          if (on && start < 0) start = i;
          if (!on && start >= 0) { out.push([start, i]); start = -1; }
        }
        return out;
      };

      // 標題是紅字中最高的一行
      const lines = runs(height, y => { let n = 0; for (let x = 0; x < width; x++) n += red[y * width + x]; return n > 1; });
      if (!lines.length) return null;
      const [top, bottom] = lines.reduce((a, b) => (b[1] - b[0] > a[1] - a[0] ? b : a));
      if (bottom - top < 14) return null; // 太小無法判讀

      const glyphs = runs(width, x => { for (let y = top; y < bottom; y++) if (red[y * width + x]) return true; return false; })
        .map(([x0, x1]) => {
          let y0 = bottom;
          let y1 = top;
          for (let y = top; y < bottom; y++) {
            for (let x = x0; x < x1; x++) {
              if (red[y * width + x]) { y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1); break; }
            }
          }
          return { x0, y0, w: x1 - x0, h: y1 - y0 };
        })
        .filter(g => g.w > 1 && g.h > (bottom - top) * 0.3);
      if (glyphs.length < 5) return null;

      // 結尾是較矮的「元」，往前連續的高窄字元即數字
      const tall = Math.max(...glyphs.map(g => g.h));
      if (glyphs[glyphs.length - 1].h > tall * 0.8) return null;
      const digits = [];
      for (let i = glyphs.length - 2; i >= 0; i--) {
        const g = glyphs[i];
        if (g.h < tall * 0.8 || g.w / g.h > 0.75) break;
        digits.unshift(g);
      }
      if (digits.length < 2 || digits.length > 4) return null;

      const value = Number(digits.map(g => classifyDigit(red, width, g)).join(''));
      return FACE_VALUES.includes(value) ? value : null;
    }

    // 面額只會出現 0、1、2、3、5
    function classifyDigit(red, stride, { x0, y0, w, h }) {
      const ink = (x, y) => red[(y0 + y) * stride + x0 + x] === 1;
      if (w / h < 0.4) return '1';

      // 封閉空洞：外圍淹水後仍未到達的背景
      const W = w + 2;
      const seen = new Uint8Array(W * (h + 2));
      const blank = (x, y) => x < 1 || y < 1 || x > w || y > h || !ink(x - 1, y - 1);
      const stack = [[0, 0]];
      seen[0] = 1;
      while (stack.length) {
        const [x, y] = stack.pop();
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= W || ny >= h + 2 || seen[ny * W + nx] || !blank(nx, ny)) continue;
          seen[ny * W + nx] = 1;
          stack.push([nx, ny]);
        }
      }
      let enclosed = 0;
      for (let y = 1; y <= h; y++) for (let x = 1; x <= w; x++) if (blank(x, y) && !seen[y * W + x]) enclosed++;
      if (enclosed > w * h * 0.08) return '0';

      // 筆畫重心偏左或偏右：2＝右左、5＝左右、3＝右右
      const side = (from, to) => {
        let sum = 0;
        let n = 0;
        for (let y = Math.floor(h * from); y < Math.ceil(h * to); y++) {
          for (let x = 0; x < w; x++) if (ink(x, y)) { sum += (x + 0.5) / w; n++; }
        }
        return !n ? '?' : sum / n > 0.54 ? 'R' : sum / n < 0.46 ? 'L' : '?';
      };
      const shape = side(0.22, 0.38) + side(0.62, 0.76);
      return { RL: '2', LR: '5', RR: '3' }[shape] || 'x';
    }

    // 以影像原始解析度裁出取景框左上角
    function sampleFaceValue() {
      if (!camera || !camera.video.videoWidth) return;
      const box = toVideoRect(camera.video, $('guide-box'));
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = Math.round(640 * (box.h * 0.2) / (box.w * 0.42));
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(camera.video, box.x, box.y - box.h * 0.03, box.w * 0.42, box.h * 0.2, 0, 0, canvas.width, canvas.height);
      const value = detectFaceValue(canvas);
      if (value) faceVotes.set(value, (faceVotes.get(value) || 0) + 1);
    }

    // 至少兩次且沒有其他答案才算有把握
    function confirmedFaceValue() {
      if (faceVotes.size !== 1) return null;
      const [value, count] = [...faceVotes][0];
      return count >= 2 ? value : null;
    }

    // ===== 付款：資料 =====
    // payment store 只有一筆 current，只存卡片 id 與金額。所有寫入都在 transaction 內重讀後再改。
    const gone = () => Object.assign(new Error('這筆付款已在別處結束'), { gone: true });
    const doneItems = record => record.items.filter(i => i.done).sort((a, b) => a.order - b.order);
    const paidByCards = record => record.items.reduce((sum, i) => sum + (i.done ? i.use : 0), 0);
    const remaining = record => record.bill - record.other - paidByCards(record);

    // 有餘額剛好等於應扣金額的卡就只用那張；否則依餘額由少到多（同額舊的先）配到足額
    function allocate(list, need, exclude = []) {
      const items = [];
      const pool = list.filter(c => c.status === 'active' && c.balance > 0 && isComplete(c) && !c.needsCheck && !exclude.includes(c.id))
        .sort((a, b) => a.balance - b.balance || a.createdAt - b.createdAt);
      const exact = need > 0 && pool.find(c => c.balance === need);
      for (const card of exact ? [exact] : pool) {
        if (need <= 0) break;
        const use = Math.min(card.balance, need);
        items.push({ cardId: card.id, use, before: card.balance, done: false, order: 0 });
        need -= use;
      }
      return { items, short: Math.max(0, need) };
    }

    // cards 與 payment 同一個 transaction；action 丟例外就整筆不寫
    function payTx(action) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readwrite');
        const cards = tx.objectStore(STORE_NAME), store = tx.objectStore(PAY_STORE);
        let failure = null;
        const all = cards.getAll(), current = store.get('current');
        current.onsuccess = () => {
          try {
            action({ record: current.result || null, list: all.result, cards, store });
          } catch (e) {
            failure = e;
            tx.abort();
          }
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 只改本次付款紀錄
    function updatePayment(sessionId, mutate) {
      return payTx(({ record, list, store }) => {
        if (!record || record.sessionId !== sessionId) throw gone();
        mutate(record, list);
        record.updatedAt = Date.now();
        store.put(record);
      });
    }

    // 確認頁每按一個鍵就存，只讀寫 payment（不必重讀含照片的卡片）
    function saveEdit(sessionId, cardId, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PAY_STORE, 'readwrite');
        const store = tx.objectStore(PAY_STORE);
        const request = store.get('current');
        request.onsuccess = () => {
          const record = request.result;
          if (!record || record.sessionId !== sessionId) return;
          record.edits[cardId] = value;
          record.updatedAt = Date.now();
          store.put(record);
          payment = record;
        };
        tx.oncomplete = resolve;
        tx.onabort = () => reject(tx.error);
      });
    }

    function createPayment(bill, other) {
      const sessionId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      return payTx(({ record, list, store }) => {
        if (record) throw Object.assign(new Error('有一筆付款尚未完成'), { exists: true });
        const plan = allocate(list, bill - other);
        if (plan.short || !plan.items.length) throw new Error('可付款的餘額已改變，請重新確認');
        store.add({ id: 'current', sessionId, stage: 'swipe', bill, other, items: plan.items, edits: {}, updatedAt: Date.now() });
      }).then(() => sessionId);
    }

    function markDone(sessionId, cardId) {
      return updatePayment(sessionId, record => {
        const item = record.items.find(i => i.cardId === cardId);
        if (!item) throw new Error('這張卡不在本次付款中');
        if (!item.done) {
          item.done = true;
          item.order = Math.max(0, ...record.items.map(i => i.order)) + 1;
        }
        if (remaining(record) <= 0) record.stage = 'confirm';
      });
    }

    // 撤銷：保留其他已刷結果，只重配未刷的卡
    function undoDone(sessionId, cardId) {
      return updatePayment(sessionId, (record, list) => {
        const done = doneItems(record).filter(i => i.cardId !== cardId);
        const need = record.bill - record.other - done.reduce((sum, i) => sum + i.use, 0);
        record.items = [...done, ...allocate(list, need, done.map(i => i.cardId)).items];
        record.stage = 'swipe';
        delete record.edits[cardId];
      });
    }

    function setStage(sessionId, stage) {
      return updatePayment(sessionId, record => { record.stage = stage; });
    }

    // 放棄：已刷的卡門市可能已扣款，標為待核對
    function abandonPayment(sessionId) {
      return payTx(({ record, list, cards, store }) => {
        if (!record || record.sessionId !== sessionId) throw gone();
        for (const item of doneItems(record)) {
          const card = list.find(c => c.id === item.cardId);
          if (card) cards.put({ ...card, needsCheck: true });
        }
        store.delete('current');
      });
    }

    // 確認：寫入各卡餘額並刪除紀錄，全部成功或全部不寫
    function finalizePayment(sessionId, values) {
      return payTx(({ record, list, cards, store }) => {
        if (!record || record.sessionId !== sessionId) throw gone();
        for (const item of doneItems(record)) {
          const card = list.find(c => c.id === item.cardId);
          if (!card || card.balance !== item.before) throw new Error('卡片餘額和付款開始時不同，沒有寫入。請返回後放棄紀錄，再逐張核對。');
          const value = values[item.cardId];
          if (!Number.isInteger(value) || value < 0 || value > card.initialAmount) throw new Error('剩餘金額需為 0 到面額之間');
          applyChange(card, 'pay', value);
          cards.put(card);
        }
        store.delete('current');
      });
    }

    // ===== 付款：畫面 =====
    const STAMP_MS = 900;
    const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '清除', '0', '⌫'];
    let pay = null; // { screen: 'amount'|'swipe'|'confirm', sessionId, bill, other, typing, at, raw, whole, busy, row, fresh, values }
    let wakeLock = null;

    const keypad = () => `<div class="keys">${KEYS.map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>`;
    const bindKeys = handler => $('view-pay').querySelectorAll('[data-key]').forEach(btn => btn.onclick = () => handler(btn.dataset.key));
    const payCard = item => findCard(item.cardId) || { barcode: '', barcode2: '', initialAmount: 0, balance: item.before, cropImage: null };

    async function keepAwake() {
      try {
        if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    async function openPay() {
      await loadCards();
      if (!payment && !payableCards().length) return toast('目前沒有可付款的卡片');
      $('view-pay').hidden = false;
      keepAwake();
      if (payment) return resumePay();
      pay = { screen: 'amount', bill: '', other: '0', typing: 'bill' };
      renderAmount();
    }

    function resumePay() {
      const at = Math.max(0, payment.items.findIndex(i => !i.done));
      pay = { screen: payment.stage, sessionId: payment.sessionId, at, raw: false, whole: false, busy: false };
      if (payment.stage === 'confirm') startConfirm();
      else renderPay();
    }

    function closePay() {
      closeSheet();
      $('view-pay').hidden = true;
      $('view-pay').replaceChildren();
      pay = null;
      wakeLock?.release().catch(() => {});
      wakeLock = null;
    }

    // 寫入失敗：停在原畫面；紀錄已不存在就離開付款
    function payFailed(error) {
      if (pay) pay.busy = false;
      if (error?.gone) { closePay(); return toast(error.message); }
      toast('儲存失敗，請再試一次');
    }

    // 回到前景或另一個分頁改過紀錄後，重畫目前步驟
    function syncPay() {
      if (!pay || pay.busy || pay.screen === 'amount') return;
      if (!payment || payment.sessionId !== pay.sessionId) { closePay(); return toast('這筆付款已在別處結束'); }
      if (!$('shade').hidden) return;
      if (payment.stage !== pay.screen) return resumePay();
      // 同一步驟：保留正在看的卡（或列），避免在櫃台解鎖後跳到別張
      if (pay.screen === 'swipe') return renderPay();
      const { row, fresh } = pay;
      startConfirm();
      pay.row = Math.min(row, pay.row);
      pay.fresh = fresh;
      renderConfirm();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden || !pay) return;
      keepAwake();
      if (db) loadCards().then(syncPay);
    });

    // ----- 卡面 -----
    // 各面額同色系的深色（描邊與小卡字色）與淡色（小卡底色）
    const DEEP = { 35: '#8a2f0c', 50: '#07557f', 100: '#11602f', 200: '#7a5200', 500: '#4d5f06', 1000: '#8a1319' };
    const PALE = { 35: '#ffe1d3', 50: '#d6f0ff', 100: '#dbf5e2', 200: '#fff0bd', 500: '#eef9c4', 1000: '#ffdcdd' };
    const toneStyle = face => `--stroke:${DEEP[Number(face)] || '#3f4650'};--pale:${PALE[Number(face)] || '#e7e9ec'}`;

    function wideCard(face) {
      const art = FACE_VALUES.includes(Number(face)) ? `<img src="cards/card-${Number(face)}-wide.svg" alt="">` : '';
      return `<span class="wide" style="${toneStyle(face)}">${art}<i>${escapeHTML(face)}</i></span>`;
    }

    const payTop = (left, title, right, extra = '') => `<div class="pay-top"><div class="pay-head">${left}<b>${title}</b>${right}</div>${extra}</div>`;
    const PAY_GAP = '<span class="gap"></span>';
    const payClose = (act, label) => `<button type="button" data-act="${act}" aria-label="${label}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

    // ----- 輸入金額 -----
    function renderAmount() {
      const bill = Number(pay.bill), other = Number(pay.other), need = bill - other;
      const plan = need > 0 ? allocate(allCards, need) : null;
      const ready = Boolean(plan && !plan.short);
      const hint = !bill ? '輸入這次應付金額' : need < 0 ? '其他付款超過應付金額' : need === 0 ? '不需要使用商品卡'
        : plan.short ? `商品卡還差 <b class="amt">${money(plan.short)}</b>，請增加其他付款`
        : `商品卡支付 <br><b class="amt">${money(need)}</b>・<span class="nobreak">用 <b class="amt">${plan.items.length}</b> 張</span>`;
      const box = (key, label, value, size) => `<button type="button" class="amount-box" data-box="${key}" aria-pressed="${pay.typing === key}">
        <span>${label}</span><b style="font-size:${size}px">${Number(value) ? money(value) : `<i>${key === 'bill' || pay.typing === key ? '$' : '無'}</i>`}</b></button>`;
      // 疊卡最多畫 5 張，張數另有文字
      const hand = ready ? plan.items.slice(0, 5).map(i => wideCard(payCard(i).initialAmount)).join('') : '';
      $('view-pay').innerHTML = `${payTop(payClose('exit', '返回首頁'), '付款', PAY_GAP)}
        <div class="pay-slip"><div class="tear edge"></div>
          ${box('bill', '應付金額', pay.bill, 46)}${box('other', '其他付款（現金等）', pay.other, 22)}
          <div class="tear"></div>
          <div class="pay-plan"><p class="pay-hintline ${plan?.short || need < 0 ? 'short' : ''}" id="amount-hint">${hint}</p><div class="hand">${hand}</div></div>
          <div style="margin-top:auto">${keypad()}</div>
        </div>
        <div class="pay-foot"><button type="button" class="btn btn-primary w-full" data-act="start" ${ready ? '' : 'disabled'}>開始付款</button></div>`;
      const view = $('view-pay');
      view.querySelector('[data-act="exit"]').onclick = closePay;
      view.querySelectorAll('[data-box]').forEach(btn => btn.onclick = () => { pay.typing = btn.dataset.box; renderAmount(); });
      view.querySelector('[data-act="start"]').onclick = beginPay;
      bindKeys(key => {
        const old = pay[pay.typing];
        const next = key === '⌫' ? old.slice(0, -1) : key === '清除' ? '' : (old + key).replace(/^0+(?=\d)/, '').slice(0, 5);
        pay[pay.typing] = pay.typing === 'other' && !next ? '0' : next;
        renderAmount();
      });
    }

    function beginPay() {
      if (pay.busy) return;
      pay.busy = true;
      createPayment(Number(pay.bill), Number(pay.other)).then(resumePay).catch(error => {
        if (error.exists) return resumePay();
        pay.busy = false;
        toast(error.message || '儲存失敗，請再試一次');
        renderAmount();
      });
    }

    // ----- 逐張刷卡 -----
    // 已刷過的卡預設收起條碼，避免重複掃描
    function codesMarkup(item, card) {
      if (pay.raw) return rawMarkup(card);
      if (item.done && !pay.reveal) {
        return `<div class="gone"><span class="used-mark">已刷過・勿重刷</span><p>條碼已收起，避免重複掃描</p>
          <button type="button" class="btn" data-act="show">沒刷到？再顯示條碼</button>
          <button type="button" class="link" data-act="undo">按錯了？撤銷已刷</button>
          <small>撤銷只改本機紀錄，不會取消門市扣款</small></div>`;
      }
      return `<span class="seg"><em>1</em>第一段</span><svg id="bc1"></svg><span class="seg second"><em>2</em>第二段</span><svg id="bc2"></svg>
        ${item.done ? '<span class="used-mark">已刷過・勿重刷</span>' : ''}`;
    }

    function renderPay() {
      pay.screen = 'swipe';
      pay.at = Math.min(pay.at, payment.items.length - 1);
      const item = payment.items[pay.at], card = payCard(item);
      const paid = payment.other + paidByCards(payment), left = remaining(payment);
      const finished = left <= 0;
      const swiped = payment.items.filter(i => i.done).length;
      const last = !item.done && swiped === payment.items.length - 1; // 沒有下一張了（含只配到一張）
      const label = finished ? '前往確認餘額' : item.done ? '這張已刷過' : last ? '已刷，確認餘額' : '已刷，下一張';
      const hidden = item.done && !pay.reveal && !pay.raw;
      const figures = `<div class="sum"><div>應付<b>${money(payment.bill)}</b></div><div>已付<b>${money(paid)}</b></div>
          <div class="left">尚需<b>${money(Math.max(0, payment.bill - paid))}</b></div></div>
        ${payment.other ? `<p class="other-note">已付含其他付款 ${money(payment.other)}</p>` : ''}`;

      $('view-pay').innerHTML = `${payTop(payClose('abort', '結束付款'), '掃描支付', PAY_GAP, figures)}
        <div class="tear edge"></div>
        <div class="pay-item">${wideCard(card.initialAmount)}<div class="use">${item.done ? '已扣' : '本張扣'}<b>${money(item.use)}</b></div></div>
        <div class="pay-mid" id="pay-swipe">
          <div class="codes">${codesMarkup(item, card)}</div>
          ${hidden ? '' : `<button type="button" class="link" data-act="raw">${pay.raw ? '返回條碼' : '刷不過？看原圖'}</button>`}
        </div>
        <div class="tray">${payment.items.map((it, i) => `<button type="button" class="chipcard ${it.done ? 'done' : ''} ${i === pay.at ? 'current' : ''}" data-chip="${i}" aria-current="${i === pay.at}"
          aria-label="第 ${i + 1} 張，${it.done ? '已刷' : '未刷'}，扣 ${it.use}" style="${toneStyle(payCard(it).initialAmount)}">
          <span class="chip-face">−${money(it.use)}</span><span class="chip-bar"></span>${it.done ? '<span class="chip-ok">✓</span>' : ''}</button>`).join('')}</div>
        <p class="pay-count">已刷 <b>${swiped}</b> ／ ${payment.items.length} 張</p>
        <div class="pay-foot"><button type="button" class="paybtn" id="pay-btn" ${item.done && !finished ? 'disabled' : ''}><span>${label}</span></button></div>`;

      const view = $('view-pay');
      const on = (act, handler) => { const btn = view.querySelector(`[data-act="${act}"]`); if (btn) btn.onclick = handler; };
      on('abort', abortPay);
      on('raw', () => { pay.raw = !pay.raw; pay.whole = false; renderPay(); });
      on('show', () => { pay.reveal = true; renderPay(); });
      on('undo', undoPaid);
      view.querySelectorAll('[data-chip]').forEach(btn => btn.onclick = () => showItem(Number(btn.dataset.chip)));
      $('pay-btn').onclick = () => finished ? goConfirm() : markPaid();
      if (pay.raw) showRaw(card);
      else if (!hidden) drawBarcodes(card);

      // 明確的水平滑動才換卡，斜向或垂直移動不算
      let start = null;
      const area = $('pay-swipe');
      area.onpointerdown = e => start = { x: e.clientX, y: e.clientY };
      area.onpointercancel = () => start = null;
      area.onpointerup = e => {
        if (!start) return;
        const dx = e.clientX - start.x, dy = (e.clientY - start.y) || 0;
        start = null;
        if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showItem(pay.at + (dx < 0 ? 1 : -1));
      };
      view.querySelector('.chipcard.current')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    // 切換卡片不等於核銷
    function showItem(index) {
      if (pay.busy || index < 0 || index >= payment.items.length) return;
      pay.at = index;
      pay.raw = false;
      pay.reveal = false;
      renderPay();
    }

    function drawBarcodes(card) {
      const options = { format: 'CODE128', lineColor: '#000000', background: '#ffffff', width: 2, height: window.innerHeight <= 660 ? 40 : 56, margin: 12, marginTop: 2, marginBottom: 2, fontSize: 13 };
      try {
        // ① 下方數字四碼一組（只改顯示文字）；② 只顯示條碼
        JsBarcode('#bc1', card.barcode, { ...options, text: String(card.barcode).replace(/(.{4})(?=.)/g, '$1  '),
          font: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fontOptions: 'bold', fontSize: 18, textMargin: 4 });
        JsBarcode('#bc2', card.barcode2, { ...options, displayValue: false });
      } catch (e) {
        $('view-pay').querySelector('.codes').innerHTML = '<p class="muted">無法產生條碼，請看原圖或改用其他付款</p>';
      }
    }

    const hasPhoto = card => String(card.cropImage || '').startsWith('data:image/');
    function rawMarkup(card) {
      if (!hasPhoto(card)) return '<p class="muted">沒有原圖</p>';
      return `<img id="raw-img" alt="卡背照片"><span class="muted">${pay.whole ? '整張卡背・點圖放大條碼' : '已放大條碼・點圖看整張'}</span>`;
    }

    // 預設放大兩段條碼區域（卡背左側下半），點一下看整張
    function showRaw(card) {
      const img = $('raw-img');
      if (!img) return;
      img.onclick = () => { pay.whole = !pay.whole; renderPay(); };
      if (pay.whole) return img.src = card.cropImage;
      const source = new Image();
      source.onload = () => {
        const sw = source.width * 0.68, sh = source.height * 0.5;
        const canvas = document.createElement('canvas');
        canvas.width = sw;
        canvas.height = sh;
        canvas.getContext('2d').drawImage(source, 0, source.height * 0.48, sw, sh, 0, 0, sw, sh);
        img.src = canvas.toDataURL('image/jpeg', 0.92);
      };
      source.src = card.cropImage;
    }

    function markPaid() {
      if (pay.busy) return;
      const session = pay, item = payment.items[pay.at];
      if (item.done) return;
      pay.busy = true;
      pay.raw = false;
      // 寫入與蓋章期間整頁擋住點按與滑動，避免連點跳卡
      const cover = document.createElement('div');
      cover.className = 'pay-cover';
      $('view-pay').append(cover);
      markDone(session.sessionId, item.cardId).then(() => {
        if (pay !== session) return;
        const button = $('pay-btn');
        button.classList.add('filling');
        button.firstElementChild.textContent = `✓ ${money(item.use)} 記錄在案`;
        cover.innerHTML = `<div class="stamp" role="status"><b>已刷</b><small>${money(item.use)} 在案</small></div>`;
        navigator.vibrate?.(60);
        setTimeout(() => {
          if (pay !== session) return;
          pay.busy = false;
          pay.reveal = false;
          if (!payment || payment.sessionId !== pay.sessionId) return syncPay();
          if (payment.stage === 'confirm') return startConfirm();
          const next = payment.items.findIndex((i, n) => n > pay.at && !i.done);
          pay.at = next >= 0 ? next : payment.items.findIndex(i => !i.done);
          renderPay();
        }, STAMP_MS);
      }).catch(error => { cover.remove(); payFailed(error); });
    }

    // 撤銷目前這張的「已刷」，只重配未刷的卡
    function undoPaid() {
      if (pay.busy) return;
      const item = payment.items[pay.at];
      if (!item?.done) return;
      pay.busy = true;
      undoDone(pay.sessionId, item.cardId).then(() => {
        pay.busy = false;
        pay.at = Math.max(0, payment.items.findIndex(i => i.cardId === item.cardId && !i.done));
        pay.raw = false;
        pay.reveal = false;
        renderPay();
        toast('已撤銷，請重新確認');
      }).catch(payFailed);
    }

    function goConfirm() {
      if (pay.busy) return;
      pay.busy = true;
      setStage(pay.sessionId, 'confirm').then(() => { pay.busy = false; startConfirm(); }).catch(payFailed);
    }

    function abortPay() {
      if (pay.busy) return;
      // 還沒刷任何一張：刪掉紀錄，回到金額輸入
      if (!paidByCards(payment)) {
        const { bill, other } = payment;
        pay.busy = true;
        return abandonPayment(pay.sessionId).then(() => {
          pay = { screen: 'amount', bill: String(bill), other: String(other), typing: 'bill' };
          renderAmount();
        }).catch(payFailed);
      }
      openSheet(`<b>結束這次付款？</b><p class="muted">已刷 ${money(paidByCards(payment))}。放棄紀錄<b>不會撤銷門市實際扣款</b>，已刷的卡會標為「待核對」。</p>
        <button type="button" class="btn btn-primary" data-act="stay">繼續付款</button>
        <button type="button" class="btn" data-act="partial">只記錄已刷的部分</button>
        <button type="button" class="btn" style="color:var(--danger)" data-act="abandon">放棄紀錄</button>`);
      sheetButton('stay', closeSheet);
      sheetButton('partial', () => { closeSheet(); goConfirm(); });
      sheetButton('abandon', () => {
        closeSheet();
        pay.busy = true;
        abandonPayment(pay.sessionId).then(() => { closePay(); toast('已放棄紀錄，請核對已刷的卡'); }).catch(payFailed);
      });
    }

    // ----- 確認餘額 -----
    const presetOf = item => String(item.before - item.use);

    // 依刷卡順序列出，預設選最後刷的卡
    function startConfirm() {
      const done = doneItems(payment);
      pay.screen = 'confirm';
      pay.values = Object.fromEntries(done.map(i => [i.cardId, payment.edits[i.cardId] ?? presetOf(i)]));
      pay.row = done.length - 1;
      pay.fresh = true;
      renderConfirm();
    }

    function renderConfirm(error = '') {
      const done = doneItems(payment);
      $('view-pay').innerHTML = `${payTop('<button type="button" data-act="back">‹ 返回付款</button>', '確認餘額', '<span style="width:6em"></span>')}
        <div class="tear edge"></div>
        <p class="muted text-center" style="flex:none">依收據核對，點金額可改。按確認才會寫入。</p>
        <div class="pay-mid" style="padding:6px 12px">${done.map((item, i) => {
          const card = payCard(item), value = pay.values[item.cardId];
          const color = value !== presetOf(item) ? 'var(--danger)' : '#1d4ed8';
          return `<div class="confirm-row">${wideCard(card.initialAmount)}
            <div class="flex-1 min-w-0"><div class="num" style="font-size:13px">${escapeHTML(fullNo(card.barcode))}</div><span class="muted">扣 ${money(item.use)}</span></div>
            <span class="muted">剩餘</span>
            <button type="button" class="after" data-row="${i}" aria-pressed="${i === pay.row}" style="color:${color};${i === pay.row ? `border:3px solid ${color}` : ''}">${escapeHTML(value) || '&nbsp;'}</button></div>`;
        }).join('')}</div>
        <p role="alert" style="flex:none;color:var(--danger);text-align:center;font-size:13px;min-height:18px">${escapeHTML(error)}</p>
        <div class="compact" style="flex:none">${keypad()}</div>
        <div class="pay-foot"><button type="button" class="btn btn-primary w-full" data-act="confirm">確認</button></div>`;
      const view = $('view-pay');
      view.querySelector('[data-act="back"]').onclick = () => {
        if (pay.busy) return;
        pay.busy = true;
        setStage(pay.sessionId, 'swipe').then(() => {
          pay.busy = false;
          pay.at = Math.max(0, payment.items.findIndex(i => !i.done));
          pay.raw = false;
          renderPay();
        }).catch(payFailed);
      };
      view.querySelectorAll('[data-row]').forEach(btn => btn.onclick = () => { pay.row = Number(btn.dataset.row); pay.fresh = true; renderConfirm(); });
      view.querySelector('[data-act="confirm"]').onclick = finishPay;
      bindKeys(key => {
        const id = done[pay.row].cardId, old = pay.values[id];
        const next = key === '清除' ? '' : key === '⌫' ? old.slice(0, -1) : ((pay.fresh ? '' : old) + key).replace(/^0+(?=\d)/, '').slice(0, 4);
        pay.values[id] = next;
        pay.fresh = false;
        saveEdit(pay.sessionId, id, next).catch(() => toast('暫存失敗，請完成確認後再離開'));
        renderConfirm();
      });
      view.querySelector('.after[aria-pressed="true"]')?.scrollIntoView({ block: 'nearest' });
    }

    function finishPay() {
      if (pay.busy) return;
      const done = doneItems(payment);
      const bad = done.findIndex(item => {
        const value = pay.values[item.cardId];
        return value === '' || Number(value) > payCard(item).initialAmount;
      });
      if (bad >= 0) {
        pay.row = bad;
        pay.fresh = true;
        return renderConfirm('剩餘金額需為 0 到面額之間');
      }
      pay.busy = true;
      const values = Object.fromEntries(done.map(i => [i.cardId, Number(pay.values[i.cardId])]));
      finalizePayment(pay.sessionId, values)
        .then(() => { closePay(); toast('已記錄這次付款'); })
        .catch(error => {
          if (error.gone) return payFailed(error);
          pay.busy = false;
          renderConfirm(error.message || '儲存失敗，請再試一次');
        });
    }

    // ===== 備份與還原 =====
    function exportData() {
      const dataStr = JSON.stringify(allCards);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `711_cards_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      writePref('cv-last-backup', Date.now()); // 只能確認已觸發下載
      renderBackup();
    }

    const MAX_IMAGE_CHARS = 2800000; // 約 2 MB 圖片的 base64 長度
    const HISTORY_TYPES = ['create', 'edit', 'face', 'pay', 'before'];
    const isAmount = v => typeof v === 'number' && Number.isFinite(v) && v >= 0;
    const isCode = v => typeof v === 'string' && v.length > 0 && v.length <= 64;

    // 嚴重錯誤丟例外（整檔不匯入）；小問題就地修正並計數
    function parseBackup(text) {
      let data;
      try { data = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (e) { throw new Error('不是有效的備份檔'); }
      if (!Array.isArray(data)) throw new Error('不是有效的備份檔');

      const ids = new Set(), codes = new Set();
      let fixed = 0;
      const cards = data.map((item, index) => {
        const fail = reason => { throw new Error(`第 ${index + 1} 筆${reason}`); };
        if (!item || typeof item !== 'object' || Array.isArray(item)) fail('格式錯誤');
        if (typeof item.id !== 'string' || !item.id) fail('缺少識別碼');
        if (!isCode(item.barcode)) fail('缺少卡號');
        if (item.barcode2 != null && item.barcode2 !== '' && !isCode(item.barcode2)) fail('第②段格式錯誤');
        if (!isAmount(item.initialAmount) || !isAmount(item.balance)) fail('金額錯誤');
        if (ids.has(item.id)) fail('與其他筆重複');
        ids.add(item.id);
        for (const code of [item.barcode, item.barcode2].filter(Boolean)) {
          if (codes.has(code)) fail('的卡號與其他筆重複');
          codes.add(code);
        }

        // 只保留已知欄位
        const card = {
          id: item.id,
          barcode: item.barcode,
          initialAmount: item.initialAmount,
          balance: item.balance,
          status: item.balance > 0 ? 'active' : 'used',
          cropImage: null,
          createdAt: isAmount(item.createdAt) ? item.createdAt : Date.now() + index
        };
        if (item.barcode2) card.barcode2 = item.barcode2;
        if (item.cropImage) {
          // 只接受內嵌圖片，避免顯示時向外部網址發出請求
          if (typeof item.cropImage === 'string' && item.cropImage.startsWith('data:image/') && item.cropImage.length <= MAX_IMAGE_CHARS) card.cropImage = item.cropImage;
          else fixed++;
        }
        if (item.history != null) {
          const ok = Array.isArray(item.history) && item.history.every(h => h && typeof h === 'object'
            && (h.at === null || isAmount(h.at)) && isAmount(h.balance) && isAmount(h.face) && HISTORY_TYPES.includes(h.type));
          if (ok) card.history = item.history.map(({ at, balance, face, type }) => ({ at, balance, face, type }));
          else fixed++;
        }
        if (item.needsCheck === true || item.balance > item.initialAmount) card.needsCheck = true;
        return card;
      });
      return { cards, fixed };
    }

    // 依 id、①、② 比對現有卡片
    function planImport(imported, existing) {
      const used = new Set();
      return imported.map(card => {
        const codes = [card.barcode, card.barcode2].filter(Boolean);
        const matches = existing.filter(c => c.id === card.id || codes.includes(c.barcode) || codes.includes(c.barcode2));
        if (matches.length > 1 || (matches[0] && used.has(matches[0].id))) throw new Error('備份與現有卡片的對應不明確（卡號互相重疊）');
        const current = matches[0] || null;
        if (current) used.add(current.id);
        const same = current && current.barcode === card.barcode && current.balance === card.balance
          && current.initialAmount === card.initialAmount && (!card.barcode2 || !current.barcode2 || card.barcode2 === current.barcode2);
        return { card, current, kind: !current ? 'new' : same ? 'same' : 'diff' };
      });
    }

    // 整批在單一 transaction 寫入；任何一筆失敗就全部不寫
    function applyImport(imported, overwrite) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const pending = tx.objectStore(PAY_STORE).count();
        const request = store.getAll();
        request.onsuccess = () => {
          try {
            if (pending.result) throw new Error('有一筆付款尚未完成');
            for (const { card, current, kind } of planImport(imported, request.result)) {
              if (kind === 'new') { store.put(card); continue; }
              if (kind === 'diff' && overwrite) {
                const merged = {
                  ...card,
                  id: current.id,
                  createdAt: current.createdAt,
                  barcode2: card.barcode2 || current.barcode2,
                  cropImage: card.cropImage || current.cropImage
                };
                if (!card.history) {
                  // 備份沒有紀錄時保留現有紀錄，並記下這次覆蓋
                  const base = { ...current };
                  applyChange(base, 'edit', card.balance, card.initialAmount);
                  if (base.history) merged.history = base.history;
                }
                store.put(merged);
                continue;
              }
              // 保留現有：只補上現有缺少的②與照片
              const addCode = !current.barcode2 && card.barcode2;
              const addImage = !current.cropImage && card.cropImage;
              if (addCode || addImage) {
                store.put({ ...current, ...(addCode ? { barcode2: card.barcode2 } : {}), ...(addImage ? { cropImage: card.cropImage } : {}) });
              }
            }
          } catch (e) {
            failure = e;
            tx.abort();
          }
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    function runImport(cards, overwrite) {
      applyImport(cards, overwrite)
        .then(() => { closeSheet(); toast('匯入完成'); })
        .catch(() => { closeSheet(); alert('匯入失敗，沒有寫入任何資料。'); });
    }

    function importData(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async e => {
        input.value = ''; // 讓同一個檔案可以再選一次
        try {
          const { cards, fixed } = parseBackup(e.target.result);
          await loadCards();
          if (payment) throw new Error('有一筆付款尚未完成，完成或放棄後才能匯入');
          const plan = planImport(cards, allCards);
          const count = kind => plan.filter(p => p.kind === kind).length;
          const overCount = cards.filter(c => c.needsCheck).length;
          openSheet(`<b>匯入備份</b>
            <p>新增 ${count('new')} 張・相同 ${count('same')} 張・內容不同 ${count('diff')} 張</p>
            ${fixed ? `<p class="muted">${fixed} 處圖片或紀錄格式不符，不匯入該部分。</p>` : ''}
            ${overCount ? `<p class="muted">備份中有 ${overCount} 張需要核對餘額。</p>` : ''}
            ${count('diff') ? '<p class="muted">內容不同的卡預設保留手機裡現有的。</p>' : ''}
            <button type="button" class="btn btn-primary" data-act="keep">${count('diff') ? '匯入（保留現有）' : '匯入'}</button>
            ${count('diff') ? `<button type="button" class="btn btn-fill-danger" data-act="over">用備份覆蓋 ${count('diff')} 張</button>` : ''}`);
          sheetButton('keep', () => runImport(cards, false));
          if (count('diff')) sheetButton('over', () => runImport(cards, true));
        } catch (err) {
          alert(`匯入失敗：${err.message}。沒有寫入任何資料。`);
        }
      };
      reader.readAsText(file);
    }

    // ===== 離線與更新 =====
    let updating = false;

    function watchWorker(registration) {
      const check = () => {
        // 沒有 controller 代表第一次安裝，不算更新
        if (!registration.waiting || !navigator.serviceWorker.controller) return;
        waitingWorker = registration.waiting;
        if (db) renderHome();
      };
      check();
      registration.addEventListener('updatefound', () => registration.installing?.addEventListener('statechange', check));
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) registration.update().catch(() => {});
      });
    }

    async function applyUpdate() {
      await loadCards();
      if (payment || !waitingWorker) return;
      if (waitingWorker.state !== 'installed') return location.reload(); // 已由另一個分頁套用
      updating = true;
      waitingWorker.postMessage('skip');
    }

    function startOffline() {
      // 請瀏覽器保留資料（不保證同意，仍須備份）
      navigator.storage?.persist?.().catch(() => {});
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating) location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(watchWorker).catch(() => {});
    }

    // ===== 加入主畫面說明 =====
    const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

    function showInstallGuide() {
      openSheet(`<b>加入主畫面</b>
        <p class="muted">主畫面版和瀏覽器各存一份資料，圖示第一次打開是空的。</p>
        <ol class="list-decimal pl-5 space-y-2 text-sm">
          <li>先按下面的「備份」，確認檔案存好。</li>
          <li>iPhone：Safari 的分享鈕 →「加入主畫面」（有「以網頁 App 開啟」就打開）。Android：Chrome 選單 →「加到主畫面」。</li>
          <li>從主畫面圖示打開 → 設定 → 還原，核對張數與餘額。</li>
          <li><b>之後只用圖示開啟</b>。兩邊餘額不會同步，兩邊都用會重複扣款或算錯。</li>
        </ol>
        <button type="button" class="btn btn-primary" data-act="backup">備份</button>`);
      sheetButton('backup', exportData);
    }

    $('install-row').hidden = isStandalone();
    showQuote();
    initDB();
    startOffline();
  </script>
</body>
</html>
