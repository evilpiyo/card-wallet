<!DOCTYPE html>
<html lang="zh-TW" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>7-11 商品卡管家</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    /* ===== Theme token：新增主題時，加一組 [data-theme="名稱"] 覆寫即可 ===== */
    :root {
      --bg: #f6f4ef; --surface: #ffffff; --text: #1d1d1b; --muted: #6f6c65; --line: #e6e2d9;
      --action: #1f6f54; --on-action: #ffffff; --danger: #c0271c; --warn: #9a5b00;
    }

    /* ===== 元件（顏色只用 token；Tailwind 僅管排版） ===== */
    [hidden] { display: none !important; }
    body { background: var(--bg); color: var(--text); }

    .page { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); max-width: 28rem; margin: 0 auto; }
    .page-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 14px; }
    .page-bar { display: flex; gap: 12px; padding: 10px 20px calc(16px + env(safe-area-inset-bottom)); }
    #view-home { z-index: 10; }
    .sub-page { z-index: 20; }

    .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 14px; padding: 12px 16px; cursor: pointer; }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-primary { background: var(--action); border-color: var(--action); color: var(--on-action); font-weight: 700; }
    .btn-danger { color: var(--danger); }
    .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 99px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); font-weight: 700; }
    .field { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; padding: 12px; font-size: 16px; }
    .muted { color: var(--muted); font-size: 14px; }
    .page-title { font-size: 20px; font-weight: 700; }

    /* 首頁 */
    .editable { user-select: text; -webkit-user-select: text; border: 1px dashed transparent; border-radius: 6px; outline: 0; width: fit-content; max-width: 100%; min-width: 2em; white-space: nowrap; overflow: hidden; cursor: text; }
    .editable:focus { border-color: var(--muted); }
    .total { font-size: 60px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; }
    .bell { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
    .bell.due::after { content: ""; position: absolute; top: 6px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid var(--surface); }
    .popover { position: absolute; top: 66px; right: 16px; width: 230px; z-index: 5; display: flex; flex-direction: column; gap: 10px; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
    .quote { margin-top: auto; text-align: center; font-size: 15px; color: var(--muted); line-height: 1.5; padding: 0 8px; }
    .pay { flex: 1; height: 58px; font-size: 20px; border-radius: 16px; }
    .set { width: 84px; height: 58px; border-radius: 16px; }

    /* 迷你卡面：顏色代表面額，不隨主題改變。彩色＝可用、淡化＝已用完、灰階＝沒有 */
    .cards { display: flex; flex: none; gap: 6px; overflow-x: auto; justify-content: safe center; padding: 2px 0 6px; }
    .cards figure { position: relative; flex: none; width: calc((100% - 30px) / 6); min-width: 44px; max-width: 56px; aspect-ratio: 54 / 85.6; border-radius: 10px; overflow: hidden; background: #fff; color: #222; box-shadow: 0 4px 12px rgba(60,50,30,.14); }
    .cards img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cards span, .cards b { position: absolute; right: 6px; line-height: 1; text-shadow: 0 0 3px rgba(255,255,255,.85); }
    .cards span { top: 8px; font-size: 13px; font-weight: 700; }
    .cards b { bottom: 7px; font-size: 12px; font-weight: 700; }
    .cards .d35 { color: #5c1d05; } .cards .d50 { color: #06364f; } .cards .d100 { color: #06381a; }
    .cards .d200 { color: #4a3200; } .cards .d500 { color: #2c3a02; } .cards .d1000 { color: #610a0f; }
    .cards .spent { box-shadow: none; border: 1px solid var(--line); }
    .cards .spent img { opacity: .35; }
    .cards .none { box-shadow: none; color: #666; }
    .cards .none img { filter: grayscale(1); opacity: .6; }
    .home-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-weight: 700; }
    .link { background: none; border: 0; padding: 6px; color: var(--muted); font-size: 14px; font-weight: 400; text-decoration: underline; cursor: pointer; }

    /* 面額代表色 */
    .f35 { --tone: #e4602f; } .f50 { --tone: #1e9fd0; } .f100 { --tone: #17a455; } .f200 { --tone: #eeb008; }
    .f500 { --tone: #93bc1f; } .f1000 { --tone: #e0343a; } .fx { --tone: #9ca3af; }
    .mini { position: relative; display: block; flex: none; width: 36px; aspect-ratio: 54 / 85.6; border-radius: 7px; overflow: hidden; background: linear-gradient(#e4e4e4, #bdbdbd); color: #222; }
    .mini img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .mini i { position: absolute; right: 3px; top: 3px; font-style: normal; font-size: 11px; font-weight: 700; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
    .num { font-family: ui-monospace, Consolas, monospace; font-size: 14px; white-space: nowrap; }
    .row { display: flex; align-items: center; gap: 10px; }

    /* 卡片管理 */
    .cards-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; padding: 10px; background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 700; color: var(--muted); }
    .tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--action); }
    .filters { display: flex; flex: none; justify-content: space-between; gap: 2px; padding: 10px 12px 2px; overflow-x: auto; }
    .filter { position: relative; flex: none; width: 42px; min-height: 80px; padding: 0; background: none; border: 0; font-size: 12px; color: var(--text); }
    .filter .mini, .filter .all { width: 38px; margin: 0 auto 3px; border: 2px solid transparent; }
    .filter .all { display: grid; place-items: center; aspect-ratio: 54 / 85.6; border-radius: 7px; background: var(--surface); border-color: var(--line); font-weight: 700; }
    .filter[aria-pressed="true"] { transform: translateY(-3px); font-weight: 700; }
    .filter[aria-pressed="true"] .mini, .filter[aria-pressed="true"] .all { border-color: #111; }
    .filter[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -6px; right: 0; width: 16px; height: 16px; border-radius: 50%; background: #111; color: #fff; font-size: 10px; display: grid; place-items: center; }
    .filter.none .mini img { filter: grayscale(1); opacity: .6; }
    .list-note { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 12px 2px 16px; font-size: 13px; color: var(--muted); }
    .eye { width: 40px; height: 32px; display: grid; place-items: center; flex: none; background: none; border: 0; color: var(--muted); }
    .card-list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 12px; }
    .item { position: relative; margin: 8px 12px; border-radius: 14px; overflow: hidden; }
    .item > .hist, .item > .del { position: absolute; top: 2px; bottom: 2px; width: 78px; border: 0; color: #fff; font-weight: 700; }
    .item > .hist { left: 2px; border-radius: 12px 0 0 12px; background: #2563eb; }
    .item > .del { right: 2px; border-radius: 0 12px 12px 0; background: var(--danger); }
    .item .face { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; background: color-mix(in srgb, var(--tone) 11%, #fff); border-left: 6px solid var(--tone); color: #1d1d1b; touch-action: pan-y; user-select: none; transition: transform .2s; cursor: pointer; }
    .item.used .face { background: color-mix(in srgb, var(--tone) 4%, #fff); border-left-color: color-mix(in srgb, var(--tone) 35%, #fff); }
    .item.used .mini img { opacity: .35; }
    .editbtn { flex: none; min-height: 40px; padding: 0 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 14px; font-weight: 700; color: #1d1d1b; }
    .badge { display: inline-block; font-size: 12px; border: 1px solid var(--warn); color: var(--warn); border-radius: 99px; padding: 0 8px; }

    /* 底部面板與提示 */
    .shade { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
    .sheet { width: 100%; max-width: 28rem; max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; background: var(--bg); color: var(--text); }
    .toast { position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 60; max-width: 26rem; margin: 0 auto; padding: 10px 14px; border-radius: 12px; background: #222; color: #fff; font-size: 14px; text-align: center; }
    .btn-fill-danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
    .face-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-items: center; }
    .face-grid button { background: none; border: 2px solid transparent; border-radius: 10px; padding: 4px 8px; color: var(--text); }
    .face-grid button[aria-pressed="true"] { border-color: var(--text); }
    .face-grid .mini { margin: 0 auto 4px; }
    .fillcard { position: relative; width: 110px; aspect-ratio: 54 / 85.6; margin: 0 auto; flex: none; border-radius: 14px; overflow: hidden; background: linear-gradient(#e4e4e4, #bdbdbd); box-shadow: 0 8px 20px rgba(0,0,0,.18); color: #222; }
    .fillcard img { width: 100%; height: 100%; object-fit: cover; }
    .fillcard .empty { position: absolute; left: 0; right: 0; top: 0; background: rgba(235,233,228,.93); border-bottom: 3px solid var(--tone); transition: height .25s; }
    .fillcard b { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 26px; text-shadow: 0 0 6px #fff, 0 0 6px #fff; }
    .histrow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .photo { width: 100%; border-radius: 10px; border: 1px solid var(--line); }

    /* 設定 */
    .group { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .group > * { display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); cursor: pointer; }
    .group > *:last-child { border-bottom: 0; }
    .group > .primary { background: var(--action); color: var(--on-action); font-weight: 700; }
    .ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .home-check { background: none; border: 0; color: var(--warn); font-size: 14px; text-decoration: underline; text-align: left; padding: 0; cursor: pointer; }

    /* 掃描畫面：取景框靠上、清單在下 */
    #view-scanner { background: #111418; color: #fff; }
    .scan-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; }
    .dark { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 10px; padding: 7px 12px; font-size: 14px; }
    .cam { position: relative; flex: none; display: flex; justify-content: center; padding: 8px 16px; overflow: hidden; background: #000; }
    #reader { position: absolute; inset: 0; }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
    /* 取景框固定不動，兩條導引線對應卡背上兩段條碼的高度，整張卡對準一次即可 */
    #guide-box { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1.586 / 1; border: 1px solid rgba(255,255,255,.55); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,.6); pointer-events: none; transition: border-color .2s; }
    #guide-box.saved { border: 2px solid #4ade80; }
    .guide-title { position: absolute; left: 3%; top: 3%; width: 40%; height: 15%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.8); }
    .guide-bars { position: absolute; left: 5%; right: 40%; height: 13%; opacity: .22; background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 4px, #fff 4px 5px, transparent 5px 9px); }
    .guide-qr { position: absolute; right: 4%; top: 57%; width: 12%; aspect-ratio: 1; border: 1px dashed rgba(255,255,255,.5); border-radius: 4px; color: rgba(255,255,255,.7); font-size: 10px; display: grid; place-items: center; }
    /* 三個讀取區：藍＝等待、綠＝已讀到、黃＝需注意 */
    .z { --c: 96,165,250; box-shadow: 0 0 6px rgba(var(--c),.35), 0 0 14px 1px rgba(var(--c),.2); animation: breathe 2.4s ease-in-out infinite; }
    .z.ok { --c: 74,222,128; animation: none; }
    .z.warn { --c: 251,191,36; animation: none; }
    .g-face { position: absolute; left: 3%; top: 3%; width: 40%; height: 15%; border: 1px solid rgba(var(--c),.9); border-radius: 8px; }
    .g-line { position: absolute; left: 3%; right: 34%; height: 2px; border-radius: 2px; background: rgba(var(--c),.9); }
    .z b { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); white-space: nowrap; border-radius: 99px; padding: 1px 7px; font-size: 11px; background: rgb(var(--c)); color: #111; }
    @keyframes breathe { 50% { box-shadow: 0 0 3px rgba(var(--c),.12), 0 0 8px rgba(var(--c),.06); } }
    @media (prefers-reduced-motion: reduce) { .z { animation: none; } }
    .scanbar { flex: none; padding: 8px 16px 6px; border-bottom: 1px solid #374151; min-height: 74px; }
    .scan-status { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 700; }
    #scan-status, #scan-dot { transition: opacity 1s; }
    .scan-status.fading #scan-status, .scan-status.fading #scan-dot { opacity: 0; transition-duration: 1s; }
    @media (prefers-reduced-motion: reduce) { #scan-status, #scan-dot { transition: none !important; } }
    .scan-status .dot { width: 10px; height: 10px; border-radius: 50%; background: #60a5fa; flex: none; }
    .latest { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
    .trash { width: 44px; height: 36px; display: grid; place-items: center; flex: none; margin-left: auto; background: none; border: 0; color: inherit; }
    .groups { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px env(safe-area-inset-bottom); }
    .grp { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 52px; padding: 5px 0; background: none; border: 0; border-bottom: 1px solid #252b33; color: inherit; text-align: left; }
    .grp .mini { width: 28px; border-radius: 5px; }
    .grp .mini i { font-size: 9px; right: 2px; top: 2px; }
    .grp.bump { animation: bump .9s ease-out; }
    @keyframes bump { from { background: rgba(74,222,128,.25); } }
    .sheet-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }

    /* 結帳條碼 */
    .co-barcode { width: 100%; height: auto; display: block; }
  </style>
</head>
<body class="font-sans select-none">

  <!-- 首頁 -->
  <main id="view-home" class="page">
    <div class="page-body">
      <div class="flex justify-between items-center gap-3">
        <h1 class="editable page-title" contenteditable="plaintext-only" data-key="cv-title" data-default="7-11商品卡匣" aria-label="首頁標題"></h1>
        <button class="bell" id="bell" onclick="toggleBackupPopover()" aria-label="備份提醒" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 8H4c0-1 2-2 2-8"/><path d="M10 21h4"/></svg>
        </button>
      </div>
      <div>
        <p class="editable muted" contenteditable="plaintext-only" data-key="cv-label" data-default="餘額" aria-label="金額標籤"></p>
        <p class="total" id="total-balance">$0</p>
      </div>
      <div class="cards" id="denominations"></div>
      <button type="button" class="home-check" id="home-check" onclick="openCards()" hidden></button>
      <div class="home-empty" id="home-empty" hidden></div>
      <button class="quote" id="quote" onclick="nextQuote()" title="點一下換一句"></button>
    </div>

    <div class="popover" id="backup-popover" hidden>
      <span>上次備份：<b id="backup-last">尚未備份</b></span>
      <label>提醒週期
        <select id="remind-days" class="field" onchange="setRemindDays(this.value)">
          <option value="0">不提醒</option><option value="7">每 7 天</option><option value="14">每 14 天</option><option value="30">每 30 天</option>
        </select>
      </label>
      <button class="btn btn-primary" onclick="exportData()">立即備份</button>
    </div>

    <p class="muted text-center" id="pay-hint" hidden>目前沒有可付款的卡片</p>
    <div class="page-bar">
      <button class="btn btn-primary pay" id="btn-pay" onclick="openCheckout()">付款</button>
      <button class="btn set" onclick="showPage('view-settings')">設定</button>
    </div>
  </main>

  <!-- 設定 -->
  <section id="view-settings" class="page sub-page" hidden>
    <div class="page-body">
      <h2 class="page-title">設定</h2>
      <div class="group">
        <button type="button" class="primary" onclick="openScanner()"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>新增卡片</button>
        <button type="button" onclick="openCards()"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>卡片管理</button>
      </div>
      <div class="group">
        <button type="button" onclick="showPage('view-text')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/></svg>首頁文字</button>
      </div>
      <div class="group">
        <button type="button" onclick="exportData()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="flex-1">備份<br><span class="muted" id="settings-backup"></span></span><span class="badge" id="settings-due" hidden>該備份了</span></button>
        <label><svg class="ic" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></svg>還原
          <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
    </div>
    <div class="page-bar"><button class="btn w-full" onclick="showPage(null)">返回首頁</button></div>
  </section>

  <!-- 卡片管理 -->
  <section id="view-cards" class="page sub-page" hidden>
    <div class="cards-head">
      <button type="button" onclick="showPage('view-settings')">‹ 返回</button>
      <h2 class="font-bold">卡片管理</h2>
      <span class="w-11"></span>
    </div>
    <div class="tabs">
      <button type="button" id="tab-active" onclick="setCardTab('active')"></button>
      <button type="button" id="tab-used" onclick="setCardTab('used')"></button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list-note">
      <span id="list-summary"></span>
      <span class="flex items-center gap-1">← 刪除　紀錄 →<button type="button" class="eye" id="eye-all" onclick="toggleNumbers()"></button></span>
    </div>
    <div class="card-list" id="card-list"></div>
  </section>

  <!-- 首頁文字 -->
  <section id="view-text" class="page sub-page" hidden>
    <div class="page-body">
      <h2 class="page-title">首頁文字</h2>
      <label>標題<input class="field" maxlength="14" data-text="cv-title"></label>
      <label>金額標籤<input class="field" maxlength="14" data-text="cv-label"></label>
      <p class="muted">清空後會恢復預設文字。也可以在首頁直接點文字修改。</p>
    </div>
    <div class="page-bar"><button class="btn w-full" onclick="showPage('view-settings')">返回</button></div>
  </section>

  <!-- 掃描 -->
  <div id="view-scanner" class="hidden fixed inset-0 z-30 flex flex-col">
    <div class="scan-top">
      <button type="button" class="dark" onclick="closeScanner()">✕ 完成</button>
      <b id="scan-total"></b>
    </div>

    <div class="cam">
      <div id="reader"></div>
      <div id="guide-box">
        <div class="guide-title">商品卡 N 元</div>
        <div class="guide-bars" style="top:53.5%"></div>
        <div class="guide-bars" style="top:78.5%"></div>
        <div class="guide-qr">QR</div>
        <span class="g-face z" id="zone-face"><b></b></span>
        <span class="g-line z" id="zone-1" style="top:60%"><b></b></span>
        <span class="g-line z" id="zone-2" style="top:85%"><b></b></span>
      </div>
    </div>

    <div class="scanbar">
      <div class="scan-status">
        <span class="dot" id="scan-dot"></span><span class="flex-1" id="scan-status" role="status" aria-atomic="true"></span>
        <button type="button" class="dark" id="scan-reset" onclick="resetPending()" hidden>重掃這張</button>
      </div>
      <div class="latest" id="scan-latest"></div>
    </div>
    <div class="groups" id="scan-groups"></div>
  </div>

  <div class="shade" id="shade" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 解碼用離屏容器：函式庫依容器尺寸縮放圖片 -->
  <div id="decode-area" aria-hidden="true" style="position:fixed;left:-10000px;top:0;width:1600px;height:400px;overflow:hidden"></div>

  <!-- 結帳：固定白底黑條碼，不套用 Theme -->
  <div id="view-checkout" class="hidden fixed inset-0 bg-white text-black z-40 flex flex-col justify-between">
    <div>
      <div class="bg-red-600 text-white text-center py-2 px-4 text-xs font-bold tracking-wider">
        ⚠️ 結帳前請手動將手機螢幕亮度調至 100%
      </div>
      <div class="p-4 flex justify-between items-center border-b">
        <button onclick="closeCheckout()" class="text-gray-600 font-bold px-2 py-1">✕ 結束結帳</button>
        <div class="text-center">
          <span class="text-xs text-gray-500 block">本輪已核銷</span>
          <span class="font-bold text-emerald-700" id="checkout-session-total">$0 (0張)</span>
        </div>
        <span class="text-sm font-bold bg-gray-100 px-3 py-1 rounded-full" id="checkout-progress">1 / 1</span>
      </div>
    </div>

    <div id="checkout-card-area" class="flex-1 min-h-0 overflow-y-auto">
      <div class="min-h-full flex flex-col items-center justify-center px-4 py-2 text-center">
        <div>
          <span class="text-sm text-gray-500">本張餘額</span>
          <h2 class="text-3xl font-black text-black" id="co-balance">$100</h2>
        </div>

        <div class="my-2 w-full max-w-sm bg-white py-2 px-1 flex flex-col items-center justify-center min-h-[180px]">
          <!-- 兩段同時顯示，順序同實體卡；間距拉大，降低掃描槍讀錯段 -->
          <div id="co-barcodes" class="w-full">
            <p class="text-left text-sm font-bold">① 第一段</p>
            <svg id="co-barcode-svg" class="co-barcode"></svg>
            <p class="text-left text-sm font-bold mt-6 border-t border-dashed pt-3">② 第二段</p>
            <svg id="co-barcode2-svg" class="co-barcode"></svg>
          </div>
          <img id="co-crop-img" class="hidden max-h-[240px] w-full object-contain rounded" alt="卡片原圖">
        </div>

        <button onclick="toggleBarcodeImage()" id="btn-toggle-img" class="text-xs text-blue-600 underline">
          刷不過？切換顯示實體卡片裁切原圖
        </button>
      </div>
    </div>

    <div class="p-4 bg-gray-50 border-t grid grid-cols-3 gap-3">
      <button onclick="prevCheckoutCard()" class="py-3.5 rounded-xl bg-gray-200 font-bold text-gray-700 active:bg-gray-300">
        ← 上一張
      </button>
      <button onclick="markUsedAndNext()" id="btn-mark-used" class="col-span-2 py-3.5 rounded-xl bg-emerald-600 text-white font-bold text-lg shadow-lg active:bg-emerald-700 disabled:opacity-50">
        ✓ 已刷完 (歸零並下一張)
      </button>
    </div>
  </div>

  <script>
    const DB_NAME = '711CardVaultDB';
    const STORE_NAME = 'cards';
    const FACE_VALUES = [35, 50, 100, 200, 500, 1000];
    let db;
    let allCards = [];
    let cardTab = 'active';
    let cardFace = 0;      // 0＝全部
    let showNumbers = false;

    const $ = id => document.getElementById(id);

    // 偏好設定存 localStorage；讀寫失敗就用預設值
    function readPref(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function writePref(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          loadCards().then(resolve);
        };
        request.onerror = (e) => reject(e);
      });
    }

    function loadCards() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          allCards = req.result.sort((a, b) => b.createdAt - a.createdAt);
          render();
          resolve();
        };
      });
    }

    function writeStore(action) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        action(tx.objectStore(STORE_NAME));
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => reject(tx.error);
      });
    }

    function removeCard(id) {
      return writeStore(store => store.delete(id));
    }

    // 在同一個 transaction 內重新讀取再修改，避免用畫面上的舊物件覆蓋
    function updateCard(id, mutate) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const request = store.get(id);
        request.onsuccess = () => {
          const card = request.result;
          if (!card) { failure = new Error('找不到這張卡'); return tx.abort(); }
          mutate(card);
          store.put(card);
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 新增前在同一個 transaction 內檢查重複（另一個分頁可能剛建過）
    function addCard(card) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const request = store.getAll();
        request.onsuccess = () => {
          const codes = [card.barcode, card.barcode2].filter(Boolean);
          if (request.result.some(c => codes.includes(c.barcode) || codes.includes(c.barcode2))) {
            failure = new Error('這張卡已經建檔過');
            return tx.abort();
          }
          store.add(card);
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    // 變更餘額或面額，並追加紀錄。舊卡第一次變動時先留下原值（時間不明）
    function applyChange(card, type, balance, face = card.initialAmount) {
      if (balance !== card.balance || face !== card.initialAmount) {
        const history = Array.isArray(card.history) ? card.history
          : [{ at: null, balance: card.balance, face: card.initialAmount, type: 'before' }];
        card.history = [...history, { at: Date.now(), balance, face, type }];
        card.balance = balance;
        card.initialAmount = face;
      }
      card.status = balance > 0 ? 'active' : 'used';
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && db) loadCards();
    });

    // ===== 頁面切換 =====
    function showPage(id) {
      document.querySelectorAll('.sub-page').forEach(page => page.hidden = page.id !== id);
      $('view-home').hidden = Boolean(id);
      $('backup-popover').hidden = true;
      $('bell').setAttribute('aria-expanded', 'false');
      closeSheet();
      if (id === 'view-text') {
        document.querySelectorAll('[data-text]').forEach(input => input.value = textOf(input.dataset.text));
      }
    }

    // ===== 兩段條碼 =====
    const SEGMENT_PATTERNS = { 1: /^\d{16}$/, 2: /^[0-9A-Z]{8}$/ };

    function segmentOf(value) {
      return SEGMENT_PATTERNS[1].test(value) ? 1 : SEGMENT_PATTERNS[2].test(value) ? 2 : 0;
    }

    function isComplete(card) {
      return SEGMENT_PATTERNS[2].test(card.barcode2 || '');
    }

    // ===== 首頁與清單 =====
    function activeCards() {
      return allCards.filter(c => c.status === 'active' && c.balance > 0);
    }

    // 兩段齊全且非待核對才能付款
    function payableCards() {
      return activeCards().filter(c => isComplete(c) && !c.needsCheck);
    }

    function render() {
      renderHome();
      renderCardList();
    }

    function renderHome() {
      const cards = payableCards();
      const sumOf = list => list.reduce((sum, c) => sum + Number(c.balance), 0);
      $('total-balance').textContent = `$${sumOf(cards).toLocaleString()}`;
      $('btn-pay').disabled = cards.length === 0;
      const toCheck = activeCards().filter(c => c.needsCheck).length;
      $('home-check').hidden = toCheck === 0;
      $('home-check').textContent = `${toCheck} 張待核對，未計入`;
      renderHomeEmpty(cards.length);
      renderDenominations(cards);
      renderBell();
    }

    // 沒有可付款的卡時，依原因給不同引導
    function renderHomeEmpty(payableCount) {
      const box = $('home-empty');
      box.hidden = payableCount > 0;
      // 第三種狀態本身已說明原因，不再重複提示
      $('pay-hint').hidden = payableCount > 0 || (allCards.length > 0 && activeCards().length > 0);
      if (payableCount > 0) return box.replaceChildren();

      const title = document.createElement('p');
      const button = (text, className, onClick) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = className;
        btn.textContent = text;
        btn.onclick = onClick;
        return btn;
      };
      if (allCards.length === 0) {
        title.textContent = '尚未加入商品卡';
        box.replaceChildren(title, button('新增第一張卡', 'btn btn-primary', openScanner));
      } else if (activeCards().length === 0) {
        title.textContent = '卡片已用完';
        box.replaceChildren(title, button('新增卡片', 'btn btn-primary', openScanner),
          button('查看已用完卡片', 'link', () => openCards('used')));
      } else {
        title.textContent = '目前沒有可付款的卡片';
        box.replaceChildren(title, button('前往卡片管理', 'btn', () => openCards()));
      }
    }

    // 固定五種面額；1000 只在有可付款的卡時出現。部分使用的卡仍算在原面額
    function renderDenominations(payable) {
      const countOf = (list, value) => list.filter(c => Number(c.initialAmount) === value).length;
      const shown = FACE_VALUES.filter(value => value !== 1000 || countOf(payable, value) > 0);
      $('denominations').replaceChildren(...shown.map(value => {
        const count = countOf(payable, value);
        const state = count ? '' : countOf(allCards, value) ? 'spent' : 'none';
        const figure = document.createElement('figure');
        figure.className = `d${value} ${state}`;
        figure.setAttribute('aria-label', `面額 ${value}，${count ? `${count} 張可用` : state === 'spent' ? '沒有可用的卡' : '沒有卡'}`);
        const img = document.createElement('img');
        img.src = `cards/card-${value}.svg`;
        img.alt = '';
        const face = document.createElement('span');
        face.textContent = value;
        figure.append(img, face);
        if (state !== 'none') {
          const num = document.createElement('b');
          num.textContent = `×${count}`;
          figure.append(num);
        }
        return figure;
      }));
    }

    // 卡片欄位來自掃描或匯入檔，寫入 innerHTML 前一律跳脫
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    const EYE = '<svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = EYE.replace('</svg>', '<path d="M4 4l16 16"/></svg>');
    const money = value => `$${Number(value).toLocaleString()}`;
    const faceClass = value => FACE_VALUES.includes(Number(value)) ? `f${Number(value)}` : 'fx';
    const fullNo = no => String(no).replace(/(.{4})(?=.)/g, '$1 ');
    const maskedNo = no => {
      const text = String(no);
      return text.length === 16 ? `**** **** ${text.slice(8, 12)} ${text.slice(12)}` : `**** ${text.slice(-4)}`;
    };
    const findCard = id => allCards.find(c => c.id === id);
    const isUsed = card => !(card.status === 'active' && card.balance > 0);

    function faceImage(value) {
      return FACE_VALUES.includes(Number(value)) ? `<img src="cards/card-${Number(value)}.svg" alt="">` : '';
    }

    function miniCard(value, label = true) {
      return `<span class="mini">${faceImage(value)}${label ? `<i>${escapeHTML(value)}</i>` : ''}</span>`;
    }

    // 進入卡片管理：回到遮蔽與全部面額
    function openCards(tab = 'active') {
      showPage('view-cards');
      cardTab = tab;
      cardFace = 0;
      showNumbers = false;
      renderCardList();
    }

    function setCardTab(tab) {
      cardTab = tab;
      renderCardList();
    }

    function setCardFace(value) {
      cardFace = value;
      renderCardList();
    }

    function toggleNumbers() {
      showNumbers = !showNumbers;
      renderCardList();
    }

    function renderCardList() {
      const inTab = tab => allCards.filter(c => isUsed(c) === (tab === 'used'));
      const pool = inTab(cardTab);
      for (const [tab, label] of [['active', '未用完'], ['used', '已用完']]) {
        $(`tab-${tab}`).textContent = `${label} ${inTab(tab).length}`;
        $(`tab-${tab}`).setAttribute('aria-pressed', tab === cardTab);
      }

      const shown = FACE_VALUES.filter(v => v !== 1000 || pool.some(c => Number(c.initialAmount) === v));
      if (cardFace && !shown.includes(cardFace)) cardFace = 0;
      $('filters').innerHTML = [0, ...shown].map(value => {
        const count = pool.filter(c => !value || Number(c.initialAmount) === value).length;
        return `<button type="button" class="filter ${value && !count ? 'none' : ''}" data-face="${value}" aria-pressed="${cardFace === value}" aria-label="${value ? `面額 ${value}` : '全部'}，${count} 張">
          ${value ? miniCard(value) : '<span class="all">全部</span>'}${value && !count ? '' : count}</button>`;
      }).join('');
      $('filters').querySelectorAll('button').forEach(btn => btn.onclick = () => setCardFace(Number(btn.dataset.face)));

      const rows = pool.filter(c => !cardFace || Number(c.initialAmount) === cardFace)
        .sort((a, b) => a.initialAmount - b.initialAmount || a.createdAt - b.createdAt);
      const payableSum = rows.filter(c => isComplete(c) && !c.needsCheck && !isUsed(c)).reduce((sum, c) => sum + Number(c.balance), 0);
      $('list-summary').textContent = `${rows.length} 張・可付款 ${money(payableSum)}`;
      $('eye-all').innerHTML = showNumbers ? EYE_OFF : EYE;
      $('eye-all').setAttribute('aria-pressed', showNumbers);
      $('eye-all').setAttribute('aria-label', showNumbers ? '遮蔽全部卡號' : '顯示全部完整卡號');

      $('card-list').innerHTML = rows.map(card => `
        <div class="item ${faceClass(card.initialAmount)} ${isUsed(card) ? 'used' : ''}">
          <button type="button" class="hist" tabindex="-1">紀錄</button>
          <button type="button" class="del" data-del="${escapeHTML(card.id)}">刪除</button>
          <div class="face" data-id="${escapeHTML(card.id)}" role="button" tabindex="0" aria-label="看原圖">
            ${miniCard(card.initialAmount)}
            <div class="flex-1 min-w-0">
              <div class="num">${escapeHTML(showNumbers ? fullNo(card.barcode) : maskedNo(card.barcode))}</div>
              <b class="text-xl">${escapeHTML(money(card.balance))}</b>
              ${card.needsCheck ? '<span class="badge">待核對</span>' : ''}
              ${isComplete(card) ? '' : '<div class="text-xs" style="color:var(--danger)">缺第②段，請刪除後重掃</div>'}
            </div>
            <button type="button" class="editbtn" data-edit="${escapeHTML(card.id)}">改餘額</button>
          </div>
        </div>`).join('') || `<p class="muted text-center py-10">沒有符合的卡片</p>`;
      bindCardRows();
    }

    // 左滑：露出刪除；右滑：開餘額紀錄；點一下：看原圖
    function bindCardRows() {
      const list = $('card-list');
      let openRow = null;
      const move = (el, x) => el.style.transform = `translateX(${x}px)`;

      list.querySelectorAll('.face').forEach(el => {
        let start = null, dx = 0, axis = '', base = 0;
        el.onpointerdown = e => {
          if (e.target.closest('button')) return;
          if (e.clientX < 24 || window.innerWidth - e.clientX < 24) return; // 讓出邊緣返回手勢
          start = { x: e.clientX, y: e.clientY };
          dx = 0; axis = ''; base = openRow === el ? -80 : 0;
        };
        el.onpointermove = e => {
          if (!start) return;
          const mx = e.clientX - start.x, my = e.clientY - start.y;
          if (!axis && Math.hypot(mx, my) > 12) {
            axis = Math.abs(mx) > Math.abs(my) * 1.5 ? 'x' : 'y';
            if (axis === 'x') el.setPointerCapture(e.pointerId);
          }
          if (axis !== 'x') return;
          dx = Math.max(-80, Math.min(base ? 0 : 80, base + mx));
          el.style.transition = 'none';
          move(el, dx);
        };
        el.onpointerup = () => {
          if (!start) return;
          start = null;
          el.style.transition = '';
          if (axis === 'x') {
            if (openRow && openRow !== el) move(openRow, 0);
            openRow = dx < -40 ? el : null;
            move(el, openRow ? -80 : 0);
            if (dx > 40) showHistory(el.dataset.id);
          } else if (!axis) {
            if (openRow) { move(openRow, 0); openRow = null; }
            else viewPhoto(el.dataset.id);
          }
        };
        el.onpointercancel = () => {
          start = null;
          el.style.transition = '';
          move(el, openRow === el ? -80 : 0);
        };
        el.onkeydown = e => { if (e.key === 'Enter' && e.target === el) viewPhoto(el.dataset.id); };
      });
      list.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => editBalance(btn.dataset.edit));
      list.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => askDelete(btn.dataset.del));
    }

    // ----- 底部面板 -----
    let sheetOpenedAt = 0;
    let toastTimer;

    let sheetDismiss = null;

    function openSheet(html, onDismiss = null) {
      sheetDismiss = onDismiss;
      $('sheet').innerHTML = html;
      $('shade').hidden = false;
      sheetOpenedAt = Date.now();
    }

    function closeSheet() {
      $('shade').hidden = true;
      $('sheet').replaceChildren();
    }

    // 剛開啟的瞬間不接受點背景，避免同一次觸控把面板關掉
    $('shade').onclick = e => {
      if (e.target === $('shade') && Date.now() - sheetOpenedAt > 350) (sheetDismiss || closeSheet)();
    };

    function sheetButton(action, handler) {
      $('sheet').querySelector(`[data-act="${action}"]`).onclick = handler;
    }

    function toast(text) {
      $('toast').textContent = text;
      $('toast').hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').hidden = true, 2200);
    }

    function viewPhoto(id) {
      const card = findCard(id);
      if (!card) return;
      const hasImage = String(card.cropImage || '').startsWith('data:image/');
      openSheet(`<div class="row justify-between"><span class="num">${escapeHTML(maskedNo(card.barcode))}</span><b>面額 $${escapeHTML(card.initialAmount)}</b></div>
        ${hasImage ? '<img class="photo" alt="卡背原圖">' : '<p class="muted text-center py-10">沒有原圖</p>'}
        <button type="button" class="btn" data-act="face">改面額（判讀錯誤時）</button>
        <button type="button" class="btn" data-act="close">關閉</button>`);
      if (hasImage) $('sheet').querySelector('.photo').src = card.cropImage;
      sheetButton('face', () => askFaceChange(id));
      sheetButton('close', closeSheet);
    }

    function askFaceChange(id) {
      const card = findCard(id);
      if (!card) return;
      openSheet(`<b>改面額</b><p class="muted">${escapeHTML(maskedNo(card.barcode))}・目前 $${escapeHTML(card.initialAmount)}。未使用的卡，餘額跟著改；用過的卡保留餘額（不超過新面額）。</p>
        <div class="face-grid">${FACE_VALUES.map(v => `<button type="button" data-value="${v}" aria-pressed="${v === Number(card.initialAmount)}">${miniCard(v, false)}<b>$${v}</b></button>`).join('')}</div>
        <button type="button" class="btn" data-act="cancel">取消</button>`);
      $('sheet').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => changeFace(id, Number(btn.dataset.value)));
      sheetButton('cancel', () => viewPhoto(id));
    }

    function changeFace(id, face) {
      updateCard(id, card => {
        // 紀錄裡曾經低於面額就視為用過，避免改面額把餘額加回來
        const unused = card.balance === card.initialAmount && (card.history || []).every(h => h.balance === h.face);
        applyChange(card, 'face', unused ? face : Math.min(card.balance, face), face);
      }).then(() => { closeSheet(); toast(`面額已改為 $${face}`); })
        .catch(() => toast('儲存失敗，請再試一次'));
    }

    function showHistory(id) {
      const card = findCard(id);
      if (!card) return;
      const history = Array.isArray(card.history) ? card.history : [];
      const rows = history.map((h, i) => {
        const faceChanged = i > 0 && h.face !== history[i - 1].face;
        const note = [h.type === 'create' ? '建檔' : '', faceChanged ? `面額改為 $${h.face}` : ''].filter(Boolean).join('，');
        return `<div class="histrow"><span class="muted">${h.at ? escapeHTML(new Date(h.at).toLocaleDateString('zh-TW')) : '改版前'}</span>
          <b>${escapeHTML(money(h.balance))}${note ? `<span class="muted">（${escapeHTML(note)}）</span>` : ''}</b></div>`;
      }).reverse().join('');
      openSheet(`<div class="row">${miniCard(card.initialAmount)}<div><div class="num">${escapeHTML(maskedNo(card.barcode))}</div><b>餘額紀錄</b></div></div>
        <div>${rows || `<p class="muted py-4">目前 ${escapeHTML(money(card.balance))}。尚無紀錄，之後的變動才會記下。</p>`}</div>
        <button type="button" class="btn" data-act="close">關閉</button>`);
      sheetButton('close', closeSheet);
    }

    function editBalance(id) {
      const card = findCard(id);
      if (!card) return;
      const face = Number(card.initialAmount);
      const fill = value => `${Math.max(0, Math.min(100, face ? 100 - value / face * 100 : 100))}%`;
      openSheet(`<div class="row justify-between"><b>改餘額</b><span class="num">${escapeHTML(maskedNo(card.barcode))}</span></div>
        <div class="fillcard ${faceClass(face)}">${faceImage(face)}<div class="empty"></div><b></b></div>
        <label class="muted text-center">實際剩餘（面額 ${escapeHTML(face)}）
          <input class="field text-center text-xl" inputmode="numeric" autocomplete="off"></label>
        <p class="text-center text-sm" role="alert" style="color:var(--danger)"></p>
        <div class="row">
          <button type="button" class="btn flex-1" data-act="zero">用完</button>
          <button type="button" class="btn flex-1" data-act="close">取消</button>
          <button type="button" class="btn btn-primary flex-1" data-act="save">儲存</button>
        </div>`);
      const sheet = $('sheet');
      const input = sheet.querySelector('input');
      const error = sheet.querySelector('[role="alert"]');
      const valid = () => /^\d+$/.test(input.value) && Number(input.value) <= face;
      const preview = value => {
        sheet.querySelector('.empty').style.height = fill(value);
        sheet.querySelector('.fillcard b').textContent = money(value);
      };
      input.value = card.balance;
      preview(card.balance);
      input.oninput = () => {
        error.textContent = valid() ? '' : `請輸入 0 到 ${face} 的整數`;
        if (valid()) preview(Number(input.value));
      };
      sheetButton('zero', () => { input.value = 0; input.oninput(); });
      sheetButton('close', closeSheet);
      sheetButton('save', () => {
        if (!valid()) return input.oninput();
        const value = Number(input.value);
        updateCard(id, c => {
          applyChange(c, 'edit', value);
          delete c.needsCheck; // 確認過實際餘額即解除待核對
        }).then(() => { closeSheet(); toast(value ? '已更新餘額' : '已移到「已用完」'); })
          .catch(() => toast('儲存失敗，請再試一次'));
      });
    }

    function askDelete(id) {
      const card = findCard(id);
      if (!card) return;
      openSheet(`<b>刪除這張卡？</b><div class="row">${miniCard(card.initialAmount)}<div><div class="num">${escapeHTML(maskedNo(card.barcode))}</div>餘額 ${escapeHTML(money(card.balance))}</div></div>
        <p class="muted">餘額紀錄會一起刪除，無法復原。</p>
        <button type="button" class="btn" data-act="cancel">取消</button>
        <button type="button" class="btn btn-fill-danger" data-act="delete">刪除</button>`);
      sheetButton('cancel', () => { closeSheet(); renderCardList(); });
      sheetButton('delete', () => {
        removeCard(id).then(() => { closeSheet(); toast('已刪除'); })
          .catch(() => toast('刪除失敗，請再試一次'));
      });
    }

    // ===== 首頁文字 =====
    function textOf(key) {
      const el = document.querySelector(`[data-key="${key}"]`);
      return readPref(key) || el.dataset.default;
    }

    function setText(key, value) {
      const text = value.trim().slice(0, 14);
      writePref(key, text);
      const el = document.querySelector(`[data-key="${key}"]`);
      el.textContent = text || el.dataset.default;
    }

    document.querySelectorAll('[data-key]').forEach(el => {
      el.textContent = textOf(el.dataset.key);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
      el.addEventListener('blur', () => setText(el.dataset.key, el.textContent));
    });
    document.querySelectorAll('[data-text]').forEach(input => {
      input.addEventListener('input', () => setText(input.dataset.text, input.value));
    });

    // ===== 心情小語 =====
    const QUOTES = ['小錢花得開心，也是一種富足。', '今天也辛苦了，買點喜歡的吧。', '零頭湊一湊，就是一杯咖啡。', '慢慢花，每一張都算數。', '照顧自己，從一份熱食開始。'];
    let quoteIndex = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000) % QUOTES.length; // 每天換一句

    function showQuote() {
      $('quote').textContent = QUOTES[quoteIndex];
    }

    function nextQuote() {
      quoteIndex = (quoteIndex + 1) % QUOTES.length;
      showQuote();
    }

    // ===== 備份提醒（僅開啟 app 時檢查） =====
    function remindDays() {
      return Number(readPref('cv-remind') ?? 14);
    }

    function renderBell() {
      const last = Number(readPref('cv-last-backup')) || 0;
      const days = Math.floor((Date.now() - last) / 86400000);
      const period = remindDays();
      $('bell').classList.toggle('due', period > 0 && allCards.length > 0 && (!last || days >= period));
      $('backup-last').textContent = !last ? '尚未備份' : days === 0 ? '今天' : `${days} 天前`;
      $('settings-backup').textContent = `上次：${$('backup-last').textContent}`;
      $('settings-due').hidden = !$('bell').classList.contains('due');
      $('remind-days').value = String(period);
    }

    function setRemindDays(value) {
      writePref('cv-remind', value);
      renderBell();
    }

    function toggleBackupPopover() {
      const pop = $('backup-popover');
      pop.hidden = !pop.hidden;
      $('bell').setAttribute('aria-expanded', !pop.hidden);
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#backup-popover, #bell')) {
        $('backup-popover').hidden = true;
        $('bell').setAttribute('aria-expanded', 'false');
      }
    });

    function newCard(barcode, face, balance, cropImage) {
      const createdAt = Date.now();
      return {
        id: crypto.randomUUID(),
        barcode,
        initialAmount: face,
        balance,
        status: 'active',
        cropImage,
        createdAt,
        history: [{ at: createdAt, balance, face, type: 'create' }]
      };
    }

    // ===== 掃描：兩段齊全才儲存 =====
    const READS_REQUIRED = 3; // 同一段連續讀到相同內容才採用
    const SWAP_READS = 2;     // 已讀到的段落連續讀到不同內容幾次，視為換卡
    let camera = null;  // { stream, video, timer }
    let cameraRequest = 0;
    let decoder = null;
    let pending;       // 目前這張卡已讀到的段落
    let streaks;
    let justSaved = []; // 剛存檔或剛刪除的卡還在鏡頭前，不重複處理
    let holdLeft = 0;   // 剛刪除的卡：連續這麼久沒讀到才解除抑制
    let statusLeft = 0; // 結果訊息剩餘顯示時間
    let fadeLeft = 0;
    let scanTicker = 0;
    const SCAN_HINT = '整張卡背放進框內';
    const RESULT_MS = 5000, FADE_MS = 1000, HOLD_MS = 4000, TICK_MS = 200;
    let savingScan = false;
    let faceVotes = new Map(); // 目前這張卡各次判讀結果
    let session = [];  // 本次掃描建的卡 { id, face, barcode, codes }，最新在前
    const TRASH = '<svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>';
    const tail8 = barcode => `${String(barcode).slice(-8, -4)} ${String(barcode).slice(-4)}`;
    const SCAN_COLORS = { wait: '#60a5fa', ok: '#4ade80', warn: '#fbbf24' };

    function emptyPending() {
      // confirm：兩段都讀到後，要再讀到一次的那一段（確認同一張卡）
      return { 1: null, 2: null, image: null, confirm: 0 };
    }

    // buzz：需要使用者處理的警示才震動；result：事情已結束的訊息，停一段時間後淡出
    function setScanStatus(text, state = 'wait', buzz = false, result = false) {
      const el = $('scan-status');
      if (el.textContent !== text) {
        if (buzz && navigator.vibrate) navigator.vibrate([100, 50, 100]);
        el.textContent = text;
      }
      el.style.color = state === 'warn' ? SCAN_COLORS.warn : text === SCAN_HINT ? '#9ca3af' : '';
      $('scan-dot').style.background = SCAN_COLORS[state];
      el.parentElement.classList.remove('fading');
      statusLeft = result ? RESULT_MS : 0;
      fadeLeft = 0;
    }

    // 面板開著時暫停所有倒數
    function tickScan() {
      if (!$('shade').hidden) return;
      if (holdLeft > 0 && (holdLeft -= TICK_MS) <= 0) justSaved = [];
      if (statusLeft > 0) {
        statusLeft -= TICK_MS;
        if (statusLeft <= 0) {
          fadeLeft = matchMedia('(prefers-reduced-motion: reduce)').matches ? TICK_MS : FADE_MS;
          $('scan-status').parentElement.classList.add('fading');
          if (!pending[1] && !pending[2]) ['face', 1, 2].forEach(key => setZone(key));
        }
      } else if (fadeLeft > 0 && (fadeLeft -= TICK_MS) <= 0) {
        updateScanUI(); // 換回目前狀態的提示
      }
    }

    // key：face、1、2
    function setZone(key, state = '') {
      const el = $(`zone-${key}`);
      el.classList.remove('ok', 'warn');
      if (state) el.classList.add(state);
      const name = key === 'face' ? '面額' : key === 1 ? '①' : '②';
      el.firstElementChild.textContent = name + (state === 'ok' ? ' ✓' : state === 'warn' ? ' ！' : '');
    }

    function updateScanUI() {
      setZone(1, pending[1] ? 'ok' : '');
      setZone(2, pending[2] ? 'ok' : '');
      setZone('face', (pending[1] || pending[2]) && confirmedFaceValue() ? 'ok' : '');
      $('scan-reset').hidden = !pending[1] && !pending[2];
      if (pending[1] && !pending[2]) setScanStatus('尚缺 ②，請勿換卡', 'warn');
      else if (pending[2] && !pending[1]) setScanStatus('尚缺 ①，請勿換卡', 'warn');
      else setScanStatus(SCAN_HINT);
    }

    function resetPending() {
      pending = emptyPending();
      faceVotes = new Map();
      savingScan = false;
      streaks = { 1: { value: '', count: 0 }, 2: { value: '', count: 0 } };
      updateScanUI();
    }

    function openScanner() {
      session = [];
      justSaved = [];
      holdLeft = 0;
      clearInterval(scanTicker);
      scanTicker = setInterval(tickScan, TICK_MS);
      $('view-scanner').classList.remove('hidden');
      resetPending();
      renderSession();
      startCamera();
    }

    // 不用函式庫內建的相機迴圈：它以顯示尺寸解碼，解析度不足。
    // 改以相機原始解析度裁出紅線附近的長條，再交給同一函式庫解碼。
    async function startCamera() {
      const request = ++cameraRequest;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }
        });
        if (request !== cameraRequest) return stream.getTracks().forEach(t => t.stop()); // 開啟途中已關閉
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.srcObject = stream;
        $('reader').replaceChildren(video);
        camera = { stream, video, timer: 0 };
        await video.play();
        decodeLoop(request);
      } catch (err) {
        if (request === cameraRequest) alert("無法啟動相機，請確認網址為 HTTPS 並允許相機權限：\n" + err);
      }
    }

    function stopCamera() {
      cameraRequest++;
      if (!camera) return;
      clearTimeout(camera.timer);
      camera.stream.getTracks().forEach(t => t.stop());
      camera = null;
      $('reader').replaceChildren();
    }

    function closeScanner() {
      clearInterval(scanTicker);
      closeSheet();
      stopCamera();
      $('view-scanner').classList.add('hidden');
    }

    // 將畫面上的元素位置換算成影像座標（video 以 object-fit: cover 顯示）
    function toVideoRect(video, element) {
      const view = video.getBoundingClientRect();
      const box = element.getBoundingClientRect();
      const scale = Math.max(view.width / video.videoWidth, view.height / video.videoHeight);
      const offsetX = (view.width - video.videoWidth * scale) / 2;
      const offsetY = (view.height - video.videoHeight * scale) / 2;
      return {
        x: (box.left - view.left - offsetX) / scale,
        y: (box.top - view.top - offsetY) / scale,
        w: box.width / scale,
        h: box.height / scale
      };
    }

    // 依序嘗試的橫向範圍（相對取景框）：新版紙卡條碼靠左、右側有 QR Code；舊版置中。
    // average：沿條碼方向取平均，消除紙卡印刷網點（不依賴 canvas filter）。
    const SCAN_VARIANTS = [
      { from: 0.02, to: 0.64, average: true },
      { from: 0.02, to: 0.64, average: false },
      { from: 0.09, to: 0.91, average: false },
      { from: 0.13, to: 0.87, average: true },
      { from: 0.18, to: 0.82, average: true },  // 銀漆灰底：只取灰底內側
      { from: 0, to: 1, average: false },
      { from: 0.02, to: 0.64, average: true, height: 0.035 } // 手持歪斜時用較薄的長條
    ];

    function averageColumns(ctx, width, height, margin) {
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      const columns = new Array(width);
      for (let x = 0; x < width; x++) {
        let sum = 0;
        for (let y = 0; y < height; y++) {
          const i = (y * width + x) * 4;
          sum += data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
        }
        columns[x] = sum / height;
      }
      // 拉開明暗（灰底時提高對比），兩側補白邊不列入
      let min = 255;
      let max = 0;
      for (let x = margin; x < width - margin; x++) {
        min = Math.min(min, columns[x]);
        max = Math.max(max, columns[x]);
      }
      for (let x = 0; x < width; x++) {
        const gray = x < margin || x >= width - margin ? 255 : (columns[x] - min) * 255 / Math.max(1, max - min);
        for (let y = 0; y < height; y++) {
          const i = (y * width + x) * 4;
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    // at：長條中心在取景框內的高度比例
    async function decodeBand(video, at) {
      const box = toVideoRect(video, $('guide-box'));
      const margin = 30; // 左右補白邊，作為靜音區
      const canvas = document.createElement('canvas');
      for (const variant of SCAN_VARIANTS) {
        const bandHeight = box.h * (variant.height || 0.07);
        const width = box.w * (variant.to - variant.from);
        const outWidth = Math.max(800, Math.round(width));
        canvas.width = outWidth + margin * 2;
        canvas.height = Math.round(bandHeight * outWidth / width);
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, box.x + box.w * variant.from, box.y + box.h * at - bandHeight / 2, width, bandHeight, margin, 0, outWidth, canvas.height);
        if (variant.average) averageColumns(ctx, canvas.width, canvas.height, margin);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        try {
          const result = await decoder.scanFileV2(new File([blob], 'band.png', { type: 'image/png' }), false);
          return result.decodedText;
        } catch (e) {
        } finally {
          decoder.clear();
        }
      }
      return null;
    }

    const LINE_AT = { 1: 0.60, 2: 0.85 };
    const OFFSETS = [-0.05, 0.05, -0.1, 0.1];
    let offsetTurn = 0;

    // 尚未讀到的段落：先讀導引線本身，再輪流試上下偏移。
    // 已讀到的段落也持續讀，內容一變代表換了卡。
    function scanPositions() {
      const offset = OFFSETS[offsetTurn++ % OFFSETS.length];
      if (pending.confirm) return [LINE_AT[pending.confirm], LINE_AT[pending.confirm] + offset];
      const missing = [1, 2].filter(seg => !pending[seg]);
      const done = [1, 2].filter(seg => pending[seg]);
      return [...missing.map(seg => LINE_AT[seg]), ...done.map(seg => LINE_AT[seg]), ...missing.map(seg => LINE_AT[seg] + offset)];
    }

    async function decodeLoop(request) {
      // formatsToSupport 屬於建構子選項
      decoder = decoder || new Html5Qrcode('decode-area', { formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128], verbose: false });
      if (request !== cameraRequest || !camera) return;
      // 面板開著時暫停辨識與存檔
      if (camera.video.videoWidth && $('shade').hidden) {
        for (const at of scanPositions()) {
          if ((pending[1] || pending[2]) && !savingScan) sampleFaceValue();
          const text = await decodeBand(camera.video, at);
          if (request !== cameraRequest || !camera) return;
          if (text) onScanSuccess(text);
        }
      }
      camera.timer = setTimeout(() => decodeLoop(request), 80);
    }

    // 依畫面上的取景框裁切（video 以 object-fit: cover 顯示，需換算回影像座標）
    function captureCroppedCardImage() {
      try {
        const video = document.querySelector('#reader video');
        if (!video || video.videoWidth === 0) return null;

        const { x, y, w, h } = toVideoRect(video, $('guide-box'));

        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = Math.round(640 / 1.586);

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.8);
      } catch (e) {
        return null;
      }
    }

    function onScanSuccess(decodedText) {
      if (savingScan || !$('shade').hidden) return;
      if (justSaved.includes(decodedText)) {
        if (holdLeft > 0) holdLeft = HOLD_MS; // 剛刪除的卡還在鏡頭前，繼續擋
        return;
      }
      const segment = segmentOf(decodedText);
      if (!segment) return setScanStatus('這不是商品卡的條碼', 'warn', true, true);

      const streak = streaks[segment];
      streak.count = streak.value === decodedText ? streak.count + 1 : 1;
      streak.value = decodedText;

      if (pending[segment]) {
        if (pending[segment] === decodedText) {
          if (pending.confirm === segment) {
            pending.confirm = 0;
            finishCard();
          }
        } else if (streak.count >= SWAP_READS) {
          resetPending();
          setScanStatus('偵測到換卡，已清除，請重新對準', 'warn', true, true);
        }
        return;
      }
      if (streak.count >= READS_REQUIRED) acceptSegment(segment, decodedText);
    }

    function acceptSegment(segment, value) {
      if (savingScan || pending[segment]) return;

      const found = allCards.find(c => c.barcode === value || c.barcode2 === value);
      if (found) {
        setZone(segment, 'warn');
        return setScanStatus(`已存在，未新增・${tail8(found.barcode)}`, 'warn', true, true);
      }

      if (!pending[1] && !pending[2]) faceVotes = new Map(); // 丟掉上一張卡的殘留判讀
      pending[segment] = value;
      if (segment === 1) pending.image = captureCroppedCardImage();
      sampleFaceValue();
      if (navigator.vibrate) navigator.vibrate(60);

      updateScanUI();
      if (pending[1] && pending[2]) {
        pending.confirm = segment === 1 ? 2 : 1;
        setScanStatus('確認是否同一張卡，請保持對準', 'ok');
      }
    }

    const FACE_WAIT_MS = 2400; // 讀不到面額時，等這麼久才詢問

    // 面額一律採用卡面判讀值；讀不到才詢問
    async function finishCard() {
      savingScan = true; // 決定面額期間不再讀取條碼
      const current = pending;
      setScanStatus('兩段齊全，確認面額中', 'ok');
      const deadline = Date.now() + FACE_WAIT_MS;
      while (!confirmedFaceValue() && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 100));
        if (pending !== current || $('view-scanner').classList.contains('hidden')) return;
        sampleFaceValue();
      }

      const detected = confirmedFaceValue();
      if (detected) return savePending(detected);

      setZone('face', 'warn');
      setScanStatus('讀不到面額，請點選', 'warn', true);
      askScanFace(current);
    }

    function askScanFace(current) {
      const cancel = () => { closeSheet(); resetPending(); };
      openSheet(`<b>這張卡的面額是？</b><p class="muted">辨識已暫停</p>
        <div class="face-grid">${FACE_VALUES.map(v => `<button type="button" data-value="${v}">${miniCard(v, false)}<b>$${v}</b></button>`).join('')}</div>
        <button type="button" class="btn" data-act="retry">重掃這張</button>`, cancel);
      $('sheet').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => {
        closeSheet();
        if (pending === current) savePending(Number(btn.dataset.value));
      });
      sheetButton('retry', cancel);
    }

    function savePending(face) {
      savingScan = true;
      const current = pending;
      const codes = [current[1], current[2]];
      const card = { ...newCard(current[1], face, face, current.image), barcode2: current[2] };

      return addCard(card).then(() => {
        session.unshift({ id: card.id, face, barcode: card.barcode, codes });
        justSaved = codes;
        holdLeft = 0;
        resetPending();
        setZone('face', 'ok'); setZone(1, 'ok'); setZone(2, 'ok');
        $('guide-box').classList.add('saved');
        setTimeout(() => $('guide-box').classList.remove('saved'), 600);
        setScanStatus('已新增，換下一張', 'ok', false, true);
        renderSession(face);
      }).catch(() => {
        resetPending();
        setScanStatus('儲存失敗，請重掃這張', 'warn', true);
      });
    }

    // ----- 本次清單：最新一張＋依面額分組 -----
    function renderSession(bumpFace = 0) {
      const total = session.reduce((sum, c) => sum + c.face, 0);
      $('scan-total').textContent = `本次 ${session.length} 張・${money(total)}`;

      const last = session[0];
      $('scan-latest').innerHTML = last ? `<span style="color:#9ca3af">最新</span>
        <b class="text-lg ${faceClass(last.face)}" style="color:var(--tone)">$${last.face}</b>
        <span class="num">${escapeHTML(tail8(last.barcode))}</span>
        <button type="button" class="trash" aria-label="刪除最新一張">${TRASH}</button>` : '';
      if (last) $('scan-latest').querySelector('.trash').onclick = () => askRemoveScanned(last.id);

      $('scan-groups').innerHTML = FACE_VALUES.filter(v => session.some(c => c.face === v)).map(value => {
        const list = session.filter(c => c.face === value);
        return `<button type="button" class="grp ${value === bumpFace ? 'bump' : ''}" data-value="${value}">${miniCard(value)}
          <b class="text-lg w-12">× ${list.length}</b><span class="num flex-1">${escapeHTML(tail8(list[0].barcode))}</span>
          <span class="text-xs" style="color:#9ca3af">檢視 ›</span></button>`;
      }).join('') || '<p class="text-sm text-center pt-5" style="color:#9ca3af">掃描成功的卡會依面額出現在這裡</p>';
      $('scan-groups').querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => viewScanGroup(Number(btn.dataset.value)));
    }

    function viewScanGroup(value) {
      if (savingScan) return;
      const list = session.filter(c => c.face === value);
      if (!list.length) return closeSheet();
      openSheet(`<div class="row justify-between"><b>$${value}・本次 ${list.length} 張</b><button type="button" class="btn" data-act="close">關閉</button></div>
        <p class="muted">辨識已暫停</p>
        ${list.map(c => `<div class="sheet-row">${miniCard(value)}<span class="num">${escapeHTML(tail8(c.barcode))}</span>${c === session[0] ? '<span class="muted">最新</span>' : ''}
          <button type="button" class="trash" data-del="${escapeHTML(c.id)}" aria-label="刪除末碼 ${escapeHTML(tail8(c.barcode))}">${TRASH}</button></div>`).join('')}`);
      sheetButton('close', closeSheet);
      $('sheet').querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => askRemoveScanned(btn.dataset.del, value));
    }

    // fromFace：由分組視窗開啟時，結束後回到該組
    function askRemoveScanned(id, fromFace = 0) {
      if (savingScan) return;
      const entry = session.find(c => c.id === id);
      if (!entry) return;
      openSheet(`<b>刪除這張卡？</b><div class="row">${miniCard(entry.face)}<div><div class="num">${escapeHTML(tail8(entry.barcode))}</div>面額 $${entry.face}</div></div>
        <p class="muted">辨識已暫停。刪除後可重新掃描。</p>
        <button type="button" class="btn" data-act="cancel">取消</button>
        <button type="button" class="btn btn-fill-danger" data-act="delete">刪除</button>`);
      sheetButton('cancel', () => fromFace ? viewScanGroup(fromFace) : closeSheet());
      sheetButton('delete', () => {
        removeCard(id).then(() => {
          session = session.filter(c => c.id !== id);
          justSaved = entry.codes;
          holdLeft = HOLD_MS; // 拿開卡片後才可重掃
          closeSheet();
          resetPending();
          setScanStatus('已刪除', 'wait', false, true);
          renderSession();
          if (fromFace) viewScanGroup(fromFace);
        }).catch(() => toast('刪除失敗，請再試一次'));
      });
    }

    // ===== 左上紅字面額判讀 =====
    // 只在固定面額中判斷；任何不確定都回傳 null，不猜
    function detectFaceValue(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const { width, height } = canvas;
      const data = ctx.getImageData(0, 0, width, height).data;
      const red = new Uint8Array(width * height);
      for (let p = 0, i = 0; p < red.length; p++, i += 4) {
        if (data[i] > 80 && data[i] - data[i + 1] > 45 && data[i] - data[i + 2] > 25) red[p] = 1;
      }

      const runs = (size, filled) => {
        const out = [];
        let start = -1;
        for (let i = 0; i <= size; i++) {
          const on = i < size && filled(i);
          if (on && start < 0) start = i;
          if (!on && start >= 0) { out.push([start, i]); start = -1; }
        }
        return out;
      };

      // 標題是紅字中最高的一行
      const lines = runs(height, y => { let n = 0; for (let x = 0; x < width; x++) n += red[y * width + x]; return n > 1; });
      if (!lines.length) return null;
      const [top, bottom] = lines.reduce((a, b) => (b[1] - b[0] > a[1] - a[0] ? b : a));
      if (bottom - top < 14) return null; // 太小無法判讀

      const glyphs = runs(width, x => { for (let y = top; y < bottom; y++) if (red[y * width + x]) return true; return false; })
        .map(([x0, x1]) => {
          let y0 = bottom;
          let y1 = top;
          for (let y = top; y < bottom; y++) {
            for (let x = x0; x < x1; x++) {
              if (red[y * width + x]) { y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1); break; }
            }
          }
          return { x0, y0, w: x1 - x0, h: y1 - y0 };
        })
        .filter(g => g.w > 1 && g.h > (bottom - top) * 0.3);
      if (glyphs.length < 5) return null;

      // 結尾是較矮的「元」，往前連續的高窄字元即數字
      const tall = Math.max(...glyphs.map(g => g.h));
      if (glyphs[glyphs.length - 1].h > tall * 0.8) return null;
      const digits = [];
      for (let i = glyphs.length - 2; i >= 0; i--) {
        const g = glyphs[i];
        if (g.h < tall * 0.8 || g.w / g.h > 0.75) break;
        digits.unshift(g);
      }
      if (digits.length < 2 || digits.length > 4) return null;

      const value = Number(digits.map(g => classifyDigit(red, width, g)).join(''));
      return FACE_VALUES.includes(value) ? value : null;
    }

    // 面額只會出現 0、1、2、3、5
    function classifyDigit(red, stride, { x0, y0, w, h }) {
      const ink = (x, y) => red[(y0 + y) * stride + x0 + x] === 1;
      if (w / h < 0.4) return '1';

      // 封閉空洞：外圍淹水後仍未到達的背景
      const W = w + 2;
      const seen = new Uint8Array(W * (h + 2));
      const blank = (x, y) => x < 1 || y < 1 || x > w || y > h || !ink(x - 1, y - 1);
      const stack = [[0, 0]];
      seen[0] = 1;
      while (stack.length) {
        const [x, y] = stack.pop();
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= W || ny >= h + 2 || seen[ny * W + nx] || !blank(nx, ny)) continue;
          seen[ny * W + nx] = 1;
          stack.push([nx, ny]);
        }
      }
      let enclosed = 0;
      for (let y = 1; y <= h; y++) for (let x = 1; x <= w; x++) if (blank(x, y) && !seen[y * W + x]) enclosed++;
      if (enclosed > w * h * 0.08) return '0';

      // 筆畫重心偏左或偏右：2＝右左、5＝左右、3＝右右
      const side = (from, to) => {
        let sum = 0;
        let n = 0;
        for (let y = Math.floor(h * from); y < Math.ceil(h * to); y++) {
          for (let x = 0; x < w; x++) if (ink(x, y)) { sum += (x + 0.5) / w; n++; }
        }
        return !n ? '?' : sum / n > 0.54 ? 'R' : sum / n < 0.46 ? 'L' : '?';
      };
      const shape = side(0.22, 0.38) + side(0.62, 0.76);
      return { RL: '2', LR: '5', RR: '3' }[shape] || 'x';
    }

    // 以影像原始解析度裁出取景框左上角
    function sampleFaceValue() {
      if (!camera || !camera.video.videoWidth) return;
      const box = toVideoRect(camera.video, $('guide-box'));
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = Math.round(640 * (box.h * 0.2) / (box.w * 0.42));
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(camera.video, box.x, box.y - box.h * 0.03, box.w * 0.42, box.h * 0.2, 0, 0, canvas.width, canvas.height);
      const value = detectFaceValue(canvas);
      if (value) faceVotes.set(value, (faceVotes.get(value) || 0) + 1);
    }

    // 至少兩次且沒有其他答案才算有把握
    function confirmedFaceValue() {
      if (faceVotes.size !== 1) return null;
      const [value, count] = [...faceVotes][0];
      return count >= 2 ? value : null;
    }

    // ===== 結帳 =====
    let checkoutQueue = [];
    let checkoutIndex = 0;
    let sessionUsedAmount = 0;
    let sessionUsedCount = 0;
    let wakeLock = null;
    let showingRawImage = false;
    let checkoutBusy = false;
    const MARK_COOLDOWN_MS = 600; // 換卡後短暫鎖定，避免連點核銷到下一張

    function setCheckoutBusy(busy) {
      checkoutBusy = busy;
      $('btn-mark-used').disabled = busy;
    }

    async function openCheckout() {
      checkoutQueue = payableCards();
      if (checkoutQueue.length === 0) {
        alert('目前沒有可用的商品卡喔！');
        return;
      }
      checkoutIndex = 0;
      sessionUsedAmount = 0;
      sessionUsedCount = 0;
      setCheckoutBusy(false);
      $('view-checkout').classList.remove('hidden');
      renderCheckoutCard();

      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function closeCheckout() {
      $('view-checkout').classList.add('hidden');
      if (wakeLock) {
        wakeLock.release().then(() => wakeLock = null);
      }
    }

    function renderCheckoutCard() {
      $('checkout-session-total').innerText = `$${sessionUsedAmount} (${sessionUsedCount}張)`;

      if (checkoutIndex >= checkoutQueue.length) {
        alert(`🎉 佇列中的卡片已全部結帳完畢！本輪共核銷 $${sessionUsedAmount}`);
        closeCheckout();
        return;
      }

      const card = checkoutQueue[checkoutIndex];
      $('checkout-progress').innerText = `${checkoutIndex + 1} / ${checkoutQueue.length}`;
      $('co-balance').innerText = `$${card.balance}`;

      showingRawImage = false;
      $('co-barcodes').classList.remove('hidden');
      $('co-crop-img').classList.add('hidden');
      $('btn-toggle-img').innerText = '刷不過？切換顯示實體卡片裁切原圖';

      const options = { format: 'CODE128', lineColor: '#000000', background: '#ffffff', width: 2, height: 80, displayValue: true, fontSize: 16, margin: 20, marginTop: 6, marginBottom: 6 };
      JsBarcode('#co-barcode-svg', card.barcode, options);
      JsBarcode('#co-barcode2-svg', card.barcode2, options);

      if (card.cropImage) {
        $('co-crop-img').src = card.cropImage;
      }
    }

    function toggleBarcodeImage() {
      const card = checkoutQueue[checkoutIndex];
      if (!card.cropImage) {
        alert('這張卡片建檔時沒有儲存到照片喔！');
        return;
      }
      showingRawImage = !showingRawImage;
      $('co-barcodes').classList.toggle('hidden', showingRawImage);
      $('co-crop-img').classList.toggle('hidden', !showingRawImage);
      $('btn-toggle-img').innerText = showingRawImage
        ? '切換回高對比數位條碼'
        : '刷不過？切換顯示實體卡片裁切原圖';
    }

    function prevCheckoutCard() {
      if (!checkoutBusy && checkoutIndex > 0) {
        checkoutIndex--;
        renderCheckoutCard();
      }
    }

    function markUsedAndNext() {
      if (checkoutBusy) return;
      setCheckoutBusy(true);
      const card = checkoutQueue[checkoutIndex];
      // 回到已核銷的卡再按一次時，只換下一張，不重複計數
      let saved = Promise.resolve();
      if (card.status !== 'used') {
        const amount = Number(card.balance);
        saved = updateCard(card.id, c => applyChange(c, 'pay', 0)).then(() => {
          sessionUsedAmount += amount;
          sessionUsedCount++;
          card.balance = 0;
          card.status = 'used';
        });
      }
      saved.then(() => {
        checkoutIndex++;
        renderCheckoutCard();
      }).catch(() => alert('儲存失敗，請再試一次'))
        .finally(() => setTimeout(() => setCheckoutBusy(false), MARK_COOLDOWN_MS));
    }

    // ===== 備份與還原 =====
    function exportData() {
      const dataStr = JSON.stringify(allCards);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `711_cards_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      writePref('cv-last-backup', Date.now()); // 只能確認已觸發下載
      renderBell();
    }

    const MAX_IMAGE_CHARS = 2800000; // 約 2 MB 圖片的 base64 長度
    const HISTORY_TYPES = ['create', 'edit', 'face', 'pay', 'before'];
    const isAmount = v => typeof v === 'number' && Number.isFinite(v) && v >= 0;
    const isCode = v => typeof v === 'string' && v.length > 0 && v.length <= 64;

    // 嚴重錯誤丟例外（整檔不匯入）；小問題就地修正並計數
    function parseBackup(text) {
      let data;
      try { data = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (e) { throw new Error('不是有效的備份檔'); }
      if (!Array.isArray(data)) throw new Error('不是有效的備份檔');

      const ids = new Set(), codes = new Set();
      let fixed = 0;
      const cards = data.map((item, index) => {
        const fail = reason => { throw new Error(`第 ${index + 1} 筆${reason}`); };
        if (!item || typeof item !== 'object' || Array.isArray(item)) fail('格式錯誤');
        if (typeof item.id !== 'string' || !item.id) fail('缺少識別碼');
        if (!isCode(item.barcode)) fail('缺少卡號');
        if (item.barcode2 != null && item.barcode2 !== '' && !isCode(item.barcode2)) fail('第②段格式錯誤');
        if (!isAmount(item.initialAmount) || !isAmount(item.balance)) fail('金額錯誤');
        if (ids.has(item.id)) fail('與其他筆重複');
        ids.add(item.id);
        for (const code of [item.barcode, item.barcode2].filter(Boolean)) {
          if (codes.has(code)) fail('的卡號與其他筆重複');
          codes.add(code);
        }

        // 只保留已知欄位
        const card = {
          id: item.id,
          barcode: item.barcode,
          initialAmount: item.initialAmount,
          balance: item.balance,
          status: item.balance > 0 ? 'active' : 'used',
          cropImage: null,
          createdAt: isAmount(item.createdAt) ? item.createdAt : Date.now() + index
        };
        if (item.barcode2) card.barcode2 = item.barcode2;
        if (item.cropImage) {
          // 只接受內嵌圖片，避免顯示時向外部網址發出請求
          if (typeof item.cropImage === 'string' && item.cropImage.startsWith('data:image/') && item.cropImage.length <= MAX_IMAGE_CHARS) card.cropImage = item.cropImage;
          else fixed++;
        }
        if (item.history != null) {
          const ok = Array.isArray(item.history) && item.history.every(h => h && typeof h === 'object'
            && (h.at === null || isAmount(h.at)) && isAmount(h.balance) && isAmount(h.face) && HISTORY_TYPES.includes(h.type));
          if (ok) card.history = item.history.map(({ at, balance, face, type }) => ({ at, balance, face, type }));
          else fixed++;
        }
        if (item.needsCheck === true || item.balance > item.initialAmount) card.needsCheck = true;
        return card;
      });
      return { cards, fixed };
    }

    // 依 id、①、② 比對現有卡片
    function planImport(imported, existing) {
      const used = new Set();
      return imported.map(card => {
        const codes = [card.barcode, card.barcode2].filter(Boolean);
        const matches = existing.filter(c => c.id === card.id || codes.includes(c.barcode) || codes.includes(c.barcode2));
        if (matches.length > 1 || (matches[0] && used.has(matches[0].id))) throw new Error('備份與現有卡片的對應不明確（卡號互相重疊）');
        const current = matches[0] || null;
        if (current) used.add(current.id);
        const same = current && current.barcode === card.barcode && current.balance === card.balance
          && current.initialAmount === card.initialAmount && (!card.barcode2 || !current.barcode2 || card.barcode2 === current.barcode2);
        return { card, current, kind: !current ? 'new' : same ? 'same' : 'diff' };
      });
    }

    // 整批在單一 transaction 寫入；任何一筆失敗就全部不寫
    function applyImport(imported, overwrite) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const request = store.getAll();
        request.onsuccess = () => {
          try {
            for (const { card, current, kind } of planImport(imported, request.result)) {
              if (kind === 'new') { store.put(card); continue; }
              if (kind === 'diff' && overwrite) {
                const merged = {
                  ...card,
                  id: current.id,
                  createdAt: current.createdAt,
                  barcode2: card.barcode2 || current.barcode2,
                  cropImage: card.cropImage || current.cropImage
                };
                if (!card.history) {
                  // 備份沒有紀錄時保留現有紀錄，並記下這次覆蓋
                  const base = { ...current };
                  applyChange(base, 'edit', card.balance, card.initialAmount);
                  if (base.history) merged.history = base.history;
                }
                store.put(merged);
                continue;
              }
              // 保留現有：只補上現有缺少的②與照片
              const addCode = !current.barcode2 && card.barcode2;
              const addImage = !current.cropImage && card.cropImage;
              if (addCode || addImage) {
                store.put({ ...current, ...(addCode ? { barcode2: card.barcode2 } : {}), ...(addImage ? { cropImage: card.cropImage } : {}) });
              }
            }
          } catch (e) {
            failure = e;
            tx.abort();
          }
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    function runImport(cards, overwrite) {
      applyImport(cards, overwrite)
        .then(() => { closeSheet(); toast('匯入完成'); })
        .catch(() => { closeSheet(); alert('匯入失敗，沒有寫入任何資料。'); });
    }

    function importData(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async e => {
        input.value = ''; // 讓同一個檔案可以再選一次
        try {
          const { cards, fixed } = parseBackup(e.target.result);
          await loadCards();
          const plan = planImport(cards, allCards);
          const count = kind => plan.filter(p => p.kind === kind).length;
          const overCount = cards.filter(c => c.needsCheck).length;
          openSheet(`<b>匯入備份</b>
            <p>新增 ${count('new')} 張・相同 ${count('same')} 張・內容不同 ${count('diff')} 張</p>
            ${fixed ? `<p class="muted">${fixed} 處圖片或紀錄格式不符，不匯入該部分。</p>` : ''}
            ${overCount ? `<p class="muted">備份中有 ${overCount} 張需要核對餘額。</p>` : ''}
            ${count('diff') ? '<p class="muted">內容不同的卡預設保留手機裡現有的。</p>' : ''}
            <button type="button" class="btn btn-primary" data-act="keep">${count('diff') ? '匯入（保留現有）' : '匯入'}</button>
            ${count('diff') ? `<button type="button" class="btn btn-fill-danger" data-act="over">用備份覆蓋 ${count('diff')} 張</button>` : ''}
            <button type="button" class="btn" data-act="cancel">取消</button>`);
          sheetButton('keep', () => runImport(cards, false));
          if (count('diff')) sheetButton('over', () => runImport(cards, true));
          sheetButton('cancel', closeSheet);
        } catch (err) {
          alert(`匯入失敗：${err.message}。沒有寫入任何資料。`);
        }
      };
      reader.readAsText(file);
    }

    showQuote();
    initDB();
  </script>
</body>
</html>
