        record.items = [...done, ...allocate(list, need, done.map(i => i.cardId)).items];
        record.stage = 'swipe';
        delete record.edits[cardId];
      });
    }

    function setStage(sessionId, stage) {
      return updatePayment(sessionId, record => { record.stage = stage; });
    }

    // 放棄：已刷的卡門市可能已扣款，標為待核對
    function abandonPayment(sessionId) {
      return payTx(({ record, list, cards, store }) => {
        if (!record || record.sessionId !== sessionId) throw gone();
        for (const item of doneItems(record)) {
          const card = list.find(c => c.id === item.cardId);
          if (card) cards.put({ ...card, needsCheck: true });
        }
        store.delete('current');
      });
    }

    // 確認：寫入各卡餘額並刪除紀錄，全部成功或全部不寫
    function finalizePayment(sessionId, values) {
      return payTx(({ record, list, cards, store }) => {
        if (!record || record.sessionId !== sessionId) throw gone();
        for (const item of doneItems(record)) {
          const card = list.find(c => c.id === item.cardId);
          if (!card || card.balance !== item.before) throw new Error('卡片餘額和付款開始時不同，沒有寫入。請返回後放棄紀錄，再逐張核對。');
          const value = values[item.cardId];
          if (!Number.isInteger(value) || value < 0 || value > card.initialAmount) throw new Error('剩餘金額需為 0 到面額之間');
          applyChange(card, 'pay', value);
          cards.put(card);
        }
        store.delete('current');
      });
    }

    // ===== 付款：畫面 =====
    const STAMP_MS = 900;
    const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '清除', '0', '⌫'];
    let pay = null; // { screen: 'amount'|'swipe'|'confirm', sessionId, bill, other, typing, at, raw, whole, busy, row, fresh, values }
    let wakeLock = null;

    const keypad = () => `<div class="keys">${KEYS.map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>`;
    const bindKeys = handler => $('view-pay').querySelectorAll('[data-key]').forEach(btn => btn.onclick = () => handler(btn.dataset.key));
    const payCard = item => findCard(item.cardId) || { barcode: '', barcode2: '', initialAmount: 0, balance: item.before, cropImage: null };

    async function keepAwake() {
      try {
        if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    async function openPay() {
      await loadCards();
      if (!payment && !payableCards().length) return toast('目前沒有可付款的卡片');
      $('view-pay').hidden = false;
      keepAwake();
      if (payment) return resumePay();
      pay = { screen: 'amount', bill: '', other: '0', typing: 'bill' };
      renderAmount();
    }

    function resumePay() {
      const at = Math.max(0, payment.items.findIndex(i => !i.done));
      pay = { screen: payment.stage, sessionId: payment.sessionId, at, raw: false, whole: false, busy: false };
      if (payment.stage === 'confirm') startConfirm();
      else renderPay();
    }

    function closePay() {
      closeSheet();
      $('view-pay').hidden = true;
      $('view-pay').replaceChildren();
      pay = null;
      wakeLock?.release().catch(() => {});
      wakeLock = null;
    }

    // 寫入失敗：停在原畫面；紀錄已不存在就離開付款
    function payFailed(error) {
      if (pay) pay.busy = false;
      if (error?.gone) { closePay(); return toast(error.message); }
      toast('儲存失敗，請再試一次');
    }

    // 回到前景或另一個分頁改過紀錄後，重畫目前步驟
    function syncPay() {
      if (!pay || pay.busy || pay.screen === 'amount') return;
      if (!payment || payment.sessionId !== pay.sessionId) { closePay(); return toast('這筆付款已在別處結束'); }
      if (!$('shade').hidden) return;
      if (payment.stage !== pay.screen) return resumePay();
      // 同一步驟：保留正在看的卡（或列），避免在櫃台解鎖後跳到別張
      if (pay.screen === 'swipe') return renderPay();
      const { row, fresh } = pay;
      startConfirm();
      pay.row = Math.min(row, pay.row);
      pay.fresh = fresh;
      renderConfirm();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden || !pay) return;
      keepAwake();
      if (db) loadCards().then(syncPay);
    });

    // ----- 卡面 -----
    // 各面額同色系的深色（描邊與小卡字色）與淡色（小卡底色）
    const DEEP = { 35: '#8a2f0c', 50: '#07557f', 100: '#11602f', 200: '#7a5200', 500: '#4d5f06', 1000: '#8a1319' };
    const PALE = { 35: '#ffe1d3', 50: '#d6f0ff', 100: '#dbf5e2', 200: '#fff0bd', 500: '#eef9c4', 1000: '#ffdcdd' };
    const toneStyle = face => `--stroke:${DEEP[Number(face)] || '#3f4650'};--pale:${PALE[Number(face)] || '#e7e9ec'}`;

    function wideCard(face) {
      const art = FACE_VALUES.includes(Number(face)) ? `<img src="cards/card-${Number(face)}-wide.svg" alt="">` : '';
      return `<span class="wide" style="${toneStyle(face)}">${art}<i>${escapeHTML(face)}</i></span>`;
    }

    const payTop = (left, title, right, extra = '') => `<div class="pay-top"><div class="pay-head">${left}<b>${title}</b>${right}</div>${extra}</div>`;
    const PAY_GAP = '<span class="gap"></span>';
    const payClose = (act, label) => `<button type="button" data-act="${act}" aria-label="${label}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

    // ----- 輸入金額 -----
    function renderAmount() {
      const bill = Number(pay.bill), other = Number(pay.other), need = bill - other;
      const plan = need > 0 ? allocate(allCards, need) : null;
      const ready = Boolean(plan && !plan.short);
      const hint = !bill ? '輸入這次應付金額' : need < 0 ? '其他付款超過應付金額' : need === 0 ? '不需要使用商品卡'
        : plan.short ? `商品卡還差 <b class="amt">${money(plan.short)}</b>，請增加其他付款`
        : `商品卡支付 <br><b class="amt">${money(need)}</b>・<span class="nobreak">用 <b class="amt">${plan.items.length}</b> 張</span>`;
      const box = (key, label, value, size) => `<button type="button" class="amount-box" data-box="${key}" aria-pressed="${pay.typing === key}">
        <span>${label}</span><b style="font-size:${size}px">${Number(value) ? money(value) : `<i>${key === 'bill' || pay.typing === key ? '$' : '無'}</i>`}</b></button>`;
      // 疊卡最多畫 5 張，張數另有文字
      const hand = ready ? plan.items.slice(0, 5).map(i => wideCard(payCard(i).initialAmount)).join('') : '';
      $('view-pay').innerHTML = `${payTop(payClose('exit', '返回首頁'), '付款', PAY_GAP)}
        <div class="pay-slip"><div class="tear edge"></div>
          ${box('bill', '應付金額', pay.bill, 46)}${box('other', '其他付款（現金等）', pay.other, 22)}
          <div class="tear"></div>
          <div class="pay-plan"><p class="pay-hintline ${plan?.short || need < 0 ? 'short' : ''}" id="amount-hint">${hint}</p><div class="hand">${hand}</div></div>
          <div style="margin-top:auto">${keypad()}</div>
        </div>
        <div class="pay-foot"><button type="button" class="btn btn-primary w-full" data-act="start" ${ready ? '' : 'disabled'}>開始付款</button></div>`;
      const view = $('view-pay');
      view.querySelector('[data-act="exit"]').onclick = closePay;
      view.querySelectorAll('[data-box]').forEach(btn => btn.onclick = () => { pay.typing = btn.dataset.box; renderAmount(); });
      view.querySelector('[data-act="start"]').onclick = beginPay;
      bindKeys(key => {
        const old = pay[pay.typing];
        const next = key === '⌫' ? old.slice(0, -1) : key === '清除' ? '' : (old + key).replace(/^0+(?=\d)/, '').slice(0, 5);
        pay[pay.typing] = pay.typing === 'other' && !next ? '0' : next;
        renderAmount();
      });
    }

    function beginPay() {
      if (pay.busy) return;
      pay.busy = true;
      createPayment(Number(pay.bill), Number(pay.other)).then(resumePay).catch(error => {
        if (error.exists) return resumePay();
        pay.busy = false;
        toast(error.message || '儲存失敗，請再試一次');
        renderAmount();
      });
    }

    // ----- 逐張刷卡 -----
    // 已刷過的卡預設收起條碼，避免重複掃描
    function codesMarkup(item, card) {
      if (pay.raw) return rawMarkup(card);
      if (item.done && !pay.reveal) {
        return `<div class="gone"><span class="used-mark">已刷過・勿重刷</span><p>條碼已收起，避免重複掃描</p>
          <button type="button" class="btn" data-act="show">沒刷到？再顯示條碼</button>
          <button type="button" class="link" data-act="undo">按錯了？撤銷已刷</button>
          <small>撤銷只改本機紀錄，不會取消門市扣款</small></div>`;
      }
      return `<span class="seg"><em>1</em>第一段</span><svg id="bc1"></svg><span class="seg second"><em>2</em>第二段</span><svg id="bc2"></svg>
        ${item.done ? '<span class="used-mark">已刷過・勿重刷</span>' : ''}`;
    }

    function renderPay() {
      pay.screen = 'swipe';
      pay.at = Math.min(pay.at, payment.items.length - 1);
      const item = payment.items[pay.at], card = payCard(item);
      const paid = payment.other + paidByCards(payment), left = remaining(payment);
      const finished = left <= 0;
      const swiped = payment.items.filter(i => i.done).length;
      const last = !item.done && swiped === payment.items.length - 1; // 沒有下一張了（含只配到一張）
      const label = finished ? '前往確認餘額' : item.done ? '這張已刷過' : last ? '已刷，確認餘額' : '已刷，下一張';
      const hidden = item.done && !pay.reveal && !pay.raw;
      const figures = `<div class="sum"><div>應付<b>${money(payment.bill)}</b></div><div>已付<b>${money(paid)}</b></div>
          <div class="left">尚需<b>${money(Math.max(0, payment.bill - paid))}</b></div></div>
        ${payment.other ? `<p class="other-note">已付含其他付款 ${money(payment.other)}</p>` : ''}`;

      $('view-pay').innerHTML = `${payTop(payClose('abort', '結束付款'), '掃描支付', PAY_GAP, figures)}
        <div class="tear edge"></div>
        <div class="pay-item">${wideCard(card.initialAmount)}<div class="use">${item.done ? '已扣' : '本張扣'}<b>${money(item.use)}</b></div></div>
        <div class="pay-mid" id="pay-swipe">
          <div class="codes">${codesMarkup(item, card)}</div>
          ${hidden ? '' : `<button type="button" class="link" data-act="raw">${pay.raw ? '返回條碼' : '刷不過？看原圖'}</button>`}
        </div>
        <div class="tray">${payment.items.map((it, i) => `<button type="button" class="chipcard ${it.done ? 'done' : ''} ${i === pay.at ? 'current' : ''}" data-chip="${i}" aria-current="${i === pay.at}"
          aria-label="第 ${i + 1} 張，${it.done ? '已刷' : '未刷'}，扣 ${it.use}" style="${toneStyle(payCard(it).initialAmount)}">
          <span class="chip-face">−${money(it.use)}</span><span class="chip-bar"></span>${it.done ? '<span class="chip-ok">✓</span>' : ''}</button>`).join('')}</div>
        <p class="pay-count">已刷 <b>${swiped}</b> ／ ${payment.items.length} 張</p>
        <div class="pay-foot"><button type="button" class="paybtn" id="pay-btn" ${item.done && !finished ? 'disabled' : ''}><span>${label}</span></button></div>`;

      const view = $('view-pay');
      const on = (act, handler) => { const btn = view.querySelector(`[data-act="${act}"]`); if (btn) btn.onclick = handler; };
      on('abort', abortPay);
      on('raw', () => { pay.raw = !pay.raw; pay.whole = false; renderPay(); });
      on('show', () => { pay.reveal = true; renderPay(); });
      on('undo', undoPaid);
      view.querySelectorAll('[data-chip]').forEach(btn => btn.onclick = () => showItem(Number(btn.dataset.chip)));
      $('pay-btn').onclick = () => finished ? goConfirm() : markPaid();
      if (pay.raw) showRaw(card);
      else if (!hidden) drawBarcodes(card);

      // 明確的水平滑動才換卡，斜向或垂直移動不算
      let start = null;
      const area = $('pay-swipe');
      area.onpointerdown = e => start = { x: e.clientX, y: e.clientY };
      area.onpointercancel = () => start = null;
      area.onpointerup = e => {
        if (!start) return;
        const dx = e.clientX - start.x, dy = (e.clientY - start.y) || 0;
        start = null;
        if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showItem(pay.at + (dx < 0 ? 1 : -1));
      };
      view.querySelector('.chipcard.current')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    // 切換卡片不等於核銷
    function showItem(index) {
      if (pay.busy || index < 0 || index >= payment.items.length) return;
      pay.at = index;
      pay.raw = false;
      pay.reveal = false;
      renderPay();
    }

    function drawBarcodes(card) {
      const options = { format: 'CODE128', lineColor: '#000000', background: '#ffffff', width: 2, height: window.innerHeight <= 660 ? 40 : 56, margin: 12, marginTop: 2, marginBottom: 2, fontSize: 13 };
      try {
        // ① 下方數字四碼一組（只改顯示文字）；② 只顯示條碼
        JsBarcode('#bc1', card.barcode, { ...options, text: String(card.barcode).replace(/(.{4})(?=.)/g, '$1  '),
          font: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fontOptions: 'bold', fontSize: 18, textMargin: 4 });
        JsBarcode('#bc2', card.barcode2, { ...options, displayValue: false });
      } catch (e) {
        $('view-pay').querySelector('.codes').innerHTML = '<p class="muted">無法產生條碼，請看原圖或改用其他付款</p>';
      }
    }

    const hasPhoto = card => String(card.cropImage || '').startsWith('data:image/');
    function rawMarkup(card) {
      if (!hasPhoto(card)) return '<p class="muted">沒有原圖</p>';
      return `<img id="raw-img" alt="卡背照片"><span class="muted">${pay.whole ? '整張卡背・點圖放大條碼' : '已放大條碼・點圖看整張'}</span>`;
    }

    // 預設放大兩段條碼區域（卡背左側下半），點一下看整張
    function showRaw(card) {
      const img = $('raw-img');
      if (!img) return;
      img.onclick = () => { pay.whole = !pay.whole; renderPay(); };
      if (pay.whole) return img.src = card.cropImage;
      const source = new Image();
      source.onload = () => {
        const sw = source.width * 0.68, sh = source.height * 0.5;
        const canvas = document.createElement('canvas');
        canvas.width = sw;
        canvas.height = sh;
        canvas.getContext('2d').drawImage(source, 0, source.height * 0.48, sw, sh, 0, 0, sw, sh);
        img.src = canvas.toDataURL('image/jpeg', 0.92);
      };
      source.src = card.cropImage;
    }

    function markPaid() {
      if (pay.busy) return;
      const session = pay, item = payment.items[pay.at];
      if (item.done) return;
      pay.busy = true;
      pay.raw = false;
      // 寫入與蓋章期間整頁擋住點按與滑動，避免連點跳卡
      const cover = document.createElement('div');
      cover.className = 'pay-cover';
      $('view-pay').append(cover);
      markDone(session.sessionId, item.cardId).then(() => {
        if (pay !== session) return;
        const button = $('pay-btn');
        button.classList.add('filling');
        button.firstElementChild.textContent = `✓ ${money(item.use)} 記錄在案`;
        cover.innerHTML = `<div class="stamp" role="status"><b>已刷</b><small>${money(item.use)} 在案</small></div>`;
        navigator.vibrate?.(60);
        setTimeout(() => {
          if (pay !== session) return;
          pay.busy = false;
          pay.reveal = false;
          if (!payment || payment.sessionId !== pay.sessionId) return syncPay();
          if (payment.stage === 'confirm') return startConfirm();
          const next = payment.items.findIndex((i, n) => n > pay.at && !i.done);
          pay.at = next >= 0 ? next : payment.items.findIndex(i => !i.done);
          renderPay();
        }, STAMP_MS);
      }).catch(error => { cover.remove(); payFailed(error); });
    }

    // 撤銷目前這張的「已刷」，只重配未刷的卡
    function undoPaid() {
      if (pay.busy) return;
      const item = payment.items[pay.at];
      if (!item?.done) return;
      pay.busy = true;
      undoDone(pay.sessionId, item.cardId).then(() => {
        pay.busy = false;
        pay.at = Math.max(0, payment.items.findIndex(i => i.cardId === item.cardId && !i.done));
        pay.raw = false;
        pay.reveal = false;
        renderPay();
        toast('已撤銷，請重新確認');
      }).catch(payFailed);
    }

    function goConfirm() {
      if (pay.busy) return;
      pay.busy = true;
      setStage(pay.sessionId, 'confirm').then(() => { pay.busy = false; startConfirm(); }).catch(payFailed);
    }

    function abortPay() {
      if (pay.busy) return;
      // 還沒刷任何一張：刪掉紀錄，回到金額輸入
      if (!paidByCards(payment)) {
        const { bill, other } = payment;
        pay.busy = true;
        return abandonPayment(pay.sessionId).then(() => {
          pay = { screen: 'amount', bill: String(bill), other: String(other), typing: 'bill' };
          renderAmount();
        }).catch(payFailed);
      }
      openSheet(`<b>結束這次付款？</b><p class="muted">已刷 ${money(paidByCards(payment))}。放棄紀錄<b>不會撤銷門市實際扣款</b>，已刷的卡會標為「待核對」。</p>
        <button type="button" class="btn btn-primary" data-act="stay">繼續付款</button>
        <button type="button" class="btn" data-act="partial">只記錄已刷的部分</button>
        <button type="button" class="btn" style="color:var(--danger)" data-act="abandon">放棄紀錄</button>`);
      sheetButton('stay', closeSheet);
      sheetButton('partial', () => { closeSheet(); goConfirm(); });
      sheetButton('abandon', () => {
        closeSheet();
        pay.busy = true;
        abandonPayment(pay.sessionId).then(() => { closePay(); toast('已放棄紀錄，請核對已刷的卡'); }).catch(payFailed);
      });
    }

    // ----- 確認餘額 -----
    const presetOf = item => String(item.before - item.use);

    // 依刷卡順序列出，預設選最後刷的卡
    function startConfirm() {
      const done = doneItems(payment);
      pay.screen = 'confirm';
      pay.values = Object.fromEntries(done.map(i => [i.cardId, payment.edits[i.cardId] ?? presetOf(i)]));
      pay.row = done.length - 1;
      pay.fresh = true;
      renderConfirm();
    }

    function renderConfirm(error = '') {
      const done = doneItems(payment);
      $('view-pay').innerHTML = `${payTop('<button type="button" data-act="back">‹ 返回付款</button>', '確認餘額', '<span style="width:6em"></span>')}
        <div class="tear edge"></div>
        <p class="muted text-center" style="flex:none">依收據核對，點金額可改。按確認才會寫入。</p>
        <div class="pay-mid" style="padding:6px 12px">${done.map((item, i) => {
          const card = payCard(item), value = pay.values[item.cardId];
          const color = value !== presetOf(item) ? 'var(--danger)' : '#1d4ed8';
          return `<div class="confirm-row">${wideCard(card.initialAmount)}
            <div class="flex-1 min-w-0"><div class="num" style="font-size:13px">${escapeHTML(fullNo(card.barcode))}</div><span class="muted">扣 ${money(item.use)}</span></div>
            <span class="muted">剩餘</span>
            <button type="button" class="after" data-row="${i}" aria-pressed="${i === pay.row}" style="color:${color};${i === pay.row ? `border:3px solid ${color}` : ''}">${escapeHTML(value) || '&nbsp;'}</button></div>`;
        }).join('')}</div>
        <p role="alert" style="flex:none;color:var(--danger);text-align:center;font-size:13px;min-height:18px">${escapeHTML(error)}</p>
        <div class="compact" style="flex:none">${keypad()}</div>
        <div class="pay-foot"><button type="button" class="btn btn-primary w-full" data-act="confirm">確認</button></div>`;
      const view = $('view-pay');
      view.querySelector('[data-act="back"]').onclick = () => {
        if (pay.busy) return;
        pay.busy = true;
        setStage(pay.sessionId, 'swipe').then(() => {
          pay.busy = false;
          pay.at = Math.max(0, payment.items.findIndex(i => !i.done));
          pay.raw = false;
          renderPay();
        }).catch(payFailed);
      };
      view.querySelectorAll('[data-row]').forEach(btn => btn.onclick = () => { pay.row = Number(btn.dataset.row); pay.fresh = true; renderConfirm(); });
      view.querySelector('[data-act="confirm"]').onclick = finishPay;
      bindKeys(key => {
        const id = done[pay.row].cardId, old = pay.values[id];
        const next = key === '清除' ? '' : key === '⌫' ? old.slice(0, -1) : ((pay.fresh ? '' : old) + key).replace(/^0+(?=\d)/, '').slice(0, 4);
        pay.values[id] = next;
        pay.fresh = false;
        saveEdit(pay.sessionId, id, next).catch(() => toast('暫存失敗，請完成確認後再離開'));
        renderConfirm();
      });
      view.querySelector('.after[aria-pressed="true"]')?.scrollIntoView({ block: 'nearest' });
    }

    function finishPay() {
      if (pay.busy) return;
      const done = doneItems(payment);
      const bad = done.findIndex(item => {
        const value = pay.values[item.cardId];
        return value === '' || Number(value) > payCard(item).initialAmount;
      });
      if (bad >= 0) {
        pay.row = bad;
        pay.fresh = true;
        return renderConfirm('剩餘金額需為 0 到面額之間');
      }
      pay.busy = true;
      const values = Object.fromEntries(done.map(i => [i.cardId, Number(pay.values[i.cardId])]));
      finalizePayment(pay.sessionId, values)
        .then(() => { closePay(); toast('已記錄這次付款'); })
        .catch(error => {
          if (error.gone) return payFailed(error);
          pay.busy = false;
          renderConfirm(error.message || '儲存失敗，請再試一次');
        });
    }

    // ===== 備份與還原 =====
    function exportData() {
      const dataStr = JSON.stringify(allCards);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `711_cards_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      writePref('cv-last-backup', Date.now()); // 只能確認已觸發下載
      renderBackup();
    }

    const MAX_IMAGE_CHARS = 2800000; // 約 2 MB 圖片的 base64 長度
    const HISTORY_TYPES = ['create', 'edit', 'face', 'pay', 'before'];
    const isAmount = v => typeof v === 'number' && Number.isFinite(v) && v >= 0;
    const isCode = v => typeof v === 'string' && v.length > 0 && v.length <= 64;

    // 嚴重錯誤丟例外（整檔不匯入）；小問題就地修正並計數
    function parseBackup(text) {
      let data;
      try { data = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (e) { throw new Error('不是有效的備份檔'); }
      if (!Array.isArray(data)) throw new Error('不是有效的備份檔');

      const ids = new Set(), codes = new Set();
      let fixed = 0;
      const cards = data.map((item, index) => {
        const fail = reason => { throw new Error(`第 ${index + 1} 筆${reason}`); };
        if (!item || typeof item !== 'object' || Array.isArray(item)) fail('格式錯誤');
        if (typeof item.id !== 'string' || !item.id) fail('缺少識別碼');
        if (!isCode(item.barcode)) fail('缺少卡號');
        if (item.barcode2 != null && item.barcode2 !== '' && !isCode(item.barcode2)) fail('第②段格式錯誤');
        if (!isAmount(item.initialAmount) || !isAmount(item.balance)) fail('金額錯誤');
        if (ids.has(item.id)) fail('與其他筆重複');
        ids.add(item.id);
        for (const code of [item.barcode, item.barcode2].filter(Boolean)) {
          if (codes.has(code)) fail('的卡號與其他筆重複');
          codes.add(code);
        }

        // 只保留已知欄位
        const card = {
          id: item.id,
          barcode: item.barcode,
          initialAmount: item.initialAmount,
          balance: item.balance,
          status: item.balance > 0 ? 'active' : 'used',
          cropImage: null,
          createdAt: isAmount(item.createdAt) ? item.createdAt : Date.now() + index
        };
        if (item.barcode2) card.barcode2 = item.barcode2;
        if (item.cropImage) {
          // 只接受內嵌圖片，避免顯示時向外部網址發出請求
          if (typeof item.cropImage === 'string' && item.cropImage.startsWith('data:image/') && item.cropImage.length <= MAX_IMAGE_CHARS) card.cropImage = item.cropImage;
          else fixed++;
        }
        if (item.history != null) {
          const ok = Array.isArray(item.history) && item.history.every(h => h && typeof h === 'object'
            && (h.at === null || isAmount(h.at)) && isAmount(h.balance) && isAmount(h.face) && HISTORY_TYPES.includes(h.type));
          if (ok) card.history = item.history.map(({ at, balance, face, type }) => ({ at, balance, face, type }));
          else fixed++;
        }
        if (item.needsCheck === true || item.balance > item.initialAmount) card.needsCheck = true;
        return card;
      });
      return { cards, fixed };
    }

    // 依 id、①、② 比對現有卡片
    function planImport(imported, existing) {
      const used = new Set();
      return imported.map(card => {
        const codes = [card.barcode, card.barcode2].filter(Boolean);
        const matches = existing.filter(c => c.id === card.id || codes.includes(c.barcode) || codes.includes(c.barcode2));
        if (matches.length > 1 || (matches[0] && used.has(matches[0].id))) throw new Error('備份與現有卡片的對應不明確（卡號互相重疊）');
        const current = matches[0] || null;
        if (current) used.add(current.id);
        const same = current && current.barcode === card.barcode && current.balance === card.balance
          && current.initialAmount === card.initialAmount && (!card.barcode2 || !current.barcode2 || card.barcode2 === current.barcode2);
        return { card, current, kind: !current ? 'new' : same ? 'same' : 'diff' };
      });
    }

    // 整批在單一 transaction 寫入；任何一筆失敗就全部不寫
    function applyImport(imported, overwrite) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, PAY_STORE], 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        let failure = null;
        const pending = tx.objectStore(PAY_STORE).count();
        const request = store.getAll();
        request.onsuccess = () => {
          try {
            if (pending.result) throw new Error('有一筆付款尚未完成');
            for (const { card, current, kind } of planImport(imported, request.result)) {
              if (kind === 'new') { store.put(card); continue; }
              if (kind === 'diff' && overwrite) {
                const merged = {
                  ...card,
                  id: current.id,
                  createdAt: current.createdAt,
                  barcode2: card.barcode2 || current.barcode2,
                  cropImage: card.cropImage || current.cropImage
                };
                if (!card.history) {
                  // 備份沒有紀錄時保留現有紀錄，並記下這次覆蓋
                  const base = { ...current };
                  applyChange(base, 'edit', card.balance, card.initialAmount);
                  if (base.history) merged.history = base.history;
                }
                store.put(merged);
                continue;
              }
              // 保留現有：只補上現有缺少的②與照片
              const addCode = !current.barcode2 && card.barcode2;
              const addImage = !current.cropImage && card.cropImage;
              if (addCode || addImage) {
                store.put({ ...current, ...(addCode ? { barcode2: card.barcode2 } : {}), ...(addImage ? { cropImage: card.cropImage } : {}) });
              }
            }
          } catch (e) {
            failure = e;
            tx.abort();
          }
        };
        tx.oncomplete = () => loadCards().then(resolve);
        tx.onabort = () => { loadCards(); reject(failure || tx.error); };
      });
    }

    function runImport(cards, overwrite) {
      applyImport(cards, overwrite)
        .then(() => { closeSheet(); toast('匯入完成'); })
        .catch(() => { closeSheet(); alert('匯入失敗，沒有寫入任何資料。'); });
    }

    function importData(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async e => {
        input.value = ''; // 讓同一個檔案可以再選一次
        try {
          const { cards, fixed } = parseBackup(e.target.result);
          await loadCards();
          if (payment) throw new Error('有一筆付款尚未完成，完成或放棄後才能匯入');
          const plan = planImport(cards, allCards);
          const count = kind => plan.filter(p => p.kind === kind).length;
          const overCount = cards.filter(c => c.needsCheck).length;
          openSheet(`<b>匯入備份</b>
            <p>新增 ${count('new')} 張・相同 ${count('same')} 張・內容不同 ${count('diff')} 張</p>
            ${fixed ? `<p class="muted">${fixed} 處圖片或紀錄格式不符，不匯入該部分。</p>` : ''}
            ${overCount ? `<p class="muted">備份中有 ${overCount} 張需要核對餘額。</p>` : ''}
            ${count('diff') ? '<p class="muted">內容不同的卡預設保留手機裡現有的。</p>' : ''}
            <button type="button" class="btn btn-primary" data-act="keep">${count('diff') ? '匯入（保留現有）' : '匯入'}</button>
            ${count('diff') ? `<button type="button" class="btn btn-fill-danger" data-act="over">用備份覆蓋 ${count('diff')} 張</button>` : ''}`);
          sheetButton('keep', () => runImport(cards, false));
          if (count('diff')) sheetButton('over', () => runImport(cards, true));
        } catch (err) {
          alert(`匯入失敗：${err.message}。沒有寫入任何資料。`);
        }
      };
      reader.readAsText(file);
    }

    // ===== 離線與更新 =====
    let updating = false;

    function watchWorker(registration) {
      const check = () => {
        // 沒有 controller 代表第一次安裝，不算更新
        if (!registration.waiting || !navigator.serviceWorker.controller) return;
        waitingWorker = registration.waiting;
        if (db) renderHome();
      };
      check();
      registration.addEventListener('updatefound', () => registration.installing?.addEventListener('statechange', check));
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) registration.update().catch(() => {});
      });
    }

    async function applyUpdate() {
      await loadCards();
      if (payment || !waitingWorker) return;
      if (waitingWorker.state !== 'installed') return location.reload(); // 已由另一個分頁套用
      updating = true;
      waitingWorker.postMessage('skip');
    }

    function startOffline() {
      // 請瀏覽器保留資料（不保證同意，仍須備份）
      navigator.storage?.persist?.().catch(() => {});
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating) location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(watchWorker).catch(() => {});
    }

    // ===== 加入主畫面說明 =====
    const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

    function showInstallGuide() {
      openSheet(`<b>加入主畫面</b>
        <p class="muted">主畫面版和瀏覽器各存一份資料，圖示第一次打開是空的。</p>
        <ol class="list-decimal pl-5 space-y-2 text-sm">
          <li>先按下面的「備份」，確認檔案存好。</li>
          <li>iPhone：Safari 的分享鈕 →「加入主畫面」（有「以網頁 App 開啟」就打開）。Android：Chrome 選單 →「加到主畫面」。</li>
          <li>從主畫面圖示打開 → 設定 → 還原，核對張數與餘額。</li>
          <li><b>之後只用圖示開啟</b>。兩邊餘額不會同步，兩邊都用會重複扣款或算錯。</li>
        </ol>
        <button type="button" class="btn btn-primary" data-act="backup">備份</button>`);
      sheetButton('backup', exportData);
    }

    $('install-row').hidden = isStandalone();
    showQuote();
    initDB();
    startOffline();
  </script>
</body>
</html>
